/* ---------- persistencia: merge, nunca pisar lo del otro ---------- */
async function leerBlob(){
  const r=await fetch(BLOB,{cache:"no-store"});
  if(!r.ok)throw new Error("GET "+r.status);
  const j=await r.json();
  return Object.assign({}, j, {decisiones:j.decisiones||{}, referentes:j.referentes||[],
                                 calendario:j.calendario||{}, f1:j.f1||{}});
}
async function guardar(aplicar){
  if(guardando){pendiente=aplicar;return;}
  guardando=true;
  for(let i=0;i<3;i++){
    try{
      const srv=await leerBlob(); aplicar(srv);
      const r=await fetch(BLOB,{method:"POST",headers:{"Content-Type":"application/json"},
                                body:JSON.stringify(srv)});
      if(!r.ok)throw new Error("POST "+r.status);
      E=srv; aviso("Guardado"); guardando=false;
      const p=pendiente; pendiente=null; if(p)guardar(p); else render();
      return;
    }catch(e){ if(i===2){guardando=false;pendiente=null;
        aviso("No se pudo guardar (almacén caído). El panel sigue en solo-lectura.",true);
        render();return;}
      await new Promise(r=>setTimeout(r,600*(i+1))); }
  }
}

   se guarda en el almacen -> el equipo lo ve al instante, sin esperar ningun push.
   El f1 horneado en DATOS queda como base; el voto del almacen lo pisa. */
const f1de=p=>{const v=(E.f1||{})[p.id];return v?v.estado:(p.f1||"pendiente");};
const f1motivo=p=>{const v=(E.f1||{})[p.id];return v?(v.motivo||""):(p.f1_motivo||"");};
const HAY_F1=()=>DATOS.piezas.some(p=>f1de(p)==="aprobado");
const paso_f1=p=>!HAY_F1()||f1de(p)==="aprobado";
function pendientes(){
  /* 13-ago, orden de Gerard: SIN filtro previo. Todos (Gerard incluido) ven la MISMA
     cola y votan de golpe; una pieza sale de la cola en cuanto alguien decide. */
  return DATOS.piezas.filter(p=>{
    if(FCUENTA!=="todo"&&p.cuenta!==FCUENTA)return false;
    const d=dec(p.id);
    return paso_f1(p) && f1de(p)!=="denegado" && (!d||d.estado==="corregir");});
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===TAB));
  $("#nrev").textContent="("+pendientes().length+")";
  $("#nref").textContent="("+(E.referentes||[]).length+")";
  $("#quien").textContent=YO?("· "+YO):"";
  const app=$("#app");
  if(TAB==="revisar")app.innerHTML=vistaRevisar();
  else if(TAB==="calendario")app.innerHTML=vistaCalendario();
  else app.innerHTML=vistaReferentes();
  cablear();
}

  ).join("")+'</div>';
}

    const pc=e=>Math.round(100*(r[e]||0)/n);
    h+=`<h2 style="font-size:15px;margin:18px 0 7px">${c}`
      +`<span style="font-weight:400;color:#8b8b9c;font-size:12px"> · ${n} colocadas · `
      +`TOFU ${pc("TOFU")}% / MOFU ${pc("MOFU")}% / BOFU ${pc("BOFU")}%</span></h2>`;
    (d.violaciones||[]).forEach(v=>h+=`<div class="alerta">⛔ ${esc(v)}</div>`);
    if(d.lm>d.techo_lm)h+=`<div class="alerta">⚠ ${d.lm} de ${d.feed} piezas piden un recurso por `
      +`DM. Sin 2 seguidos caben ${d.techo_lm}: el resto sobra siempre.</div>`;
    const fechas=[...new Set([...(d.colocadas||[]),...(d.vacios||[])].map(x=>x.fecha))].sort();
    for(const f of fechas){
      const dia=((d.colocadas||[]).concat(d.vacios||[]).find(x=>x.fecha===f)||{}).dia||"";
      h+=`<div class="dia"><h3>${esc(dia)} ${esc(f)}</h3><div class="slots">`;
      for(let s=0;s<3;s++){
        const c1=(d.colocadas||[]).find(x=>x.fecha===f&&x.slot===s);
        const v1=(d.vacios||[]).find(x=>x.fecha===f&&x.slot===s);
        const fmt=(c1||v1||{}).formato_santi||(v1||{}).formato||"";
        const sm=(c1||v1||{}).sin_motor?' <span style="color:#e8a500">⚠sin motor</span>':"";
        if(c1){
          const dd=dec(c1.id);
          const est=dd?({aprobado:"✅ visto bueno",denegado:"⛔ tumbada",
                          corregir:"✏️ a corregir"}[dd.estado]||""):"";
          h+=`<div class="slot lleno"><div class="fmt">${esc(fmt)}${sm}</div>`
            +`<b>${esc(c1.id)}</b><br><span class="tag ${esc(c1.etapa)}">${esc(c1.etapa)}</span>`
            +(c1.lead_magnet?' <span class="tag tipo">LM</span>':"")
            +(c1.encaje==="exacto"?"":` <span class="tag tipo">${esc(c1.formato)}</span>`)
            +(est?`<div style="font-size:11px;color:#8b8b9c;margin-top:4px">${est}</div>`:"")
            +`</div>`;
        }else{
          h+=`<div class="slot"><div class="fmt">${esc(fmt)}${sm}</div>`
            +`<span style="color:#5f5f70">— libre —</span>`
            +`<div style="font-size:10.5px;color:#8b8b9c;margin-top:3px">`
            +`${esc((v1||{}).motivo||"")}</div></div>`;
        }
      }
      h+='</div></div>';
    }
    if((d.sin_colocar||[]).length)
      h+=`<div class="nota" style="font-size:11.5px">Sin hueco esta semana (${d.sin_colocar.length}): `
        +`${esc(d.sin_colocar.join(", "))}</div>`;
  }
  return h;
}

function vistaReferentes(){
  let h='<div class="nota">Pega aquí links de vídeos o carruseles que te gusten para replicar. '
       +'<b>No hace falta que digas de qué tipo es</b>: eso lo analizo yo y lo relleno.</div>'
       +'<div class="addref"><input id="rurl" placeholder="https://instagram.com/reel/... o TikTok">'
       +'<input id="rnota" placeholder="¿qué te gusta de él? (opcional)" style="max-width:270px">'
       +'<button id="raddr">Añadir</button></div>';
  const rs=E.referentes||[];
  if(!rs.length)return h+'<div class="vacio">Aún no hay referentes. Pega el primero arriba.</div>';
  for(let i=rs.length-1;i>=0;i--){
    const r=rs[i];
    h+=`<div class="ref"><div style="flex:1;min-width:210px">
      <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
      <div style="font-size:11.5px;color:#8b8b9c;margin-top:3px">
        ${esc(r.quien||"")} ${r.fecha?"· "+esc(r.fecha):""} ${r.nota?"· "+esc(r.nota):""}</div></div>
      <span class="tag ${(r.etapa||"SIN").toUpperCase()}">${esc(r.etapa||"sin analizar")}</span>
      <span class="tag tipo">${esc(r.estado||"")}</span></div>`;
  }
  return h;
}

/* ---------- eventos ---------- */
function cablear(){
  document.querySelectorAll(".filtros button").forEach(b=>b.onclick=()=>{FCUENTA=b.dataset.f;render();});
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id, ta=card.querySelector(".motivo");
    card.querySelectorAll(".acc button").forEach(b=>b.onclick=()=>{
      const est=b.dataset.a, motivo=(ta.value||"").trim();
      if(est==="corregir"&&!motivo){
        aviso("Escribe qué hay que corregir",true); ta.focus(); return;
      }
      guardar(srv=>{ const sello=new Date().toISOString().slice(0,16).replace("T"," ");
        srv.decisiones=srv.decisiones||{};
        srv.decisiones[id]={estado:est,motivo:motivo,por:YO,cuando:sello};
      });
    });
  });
  const add=$("#raddr");
  if(add)add.onclick=()=>{
    const u=($("#rurl").value||"").trim();
    if(!/^https?:\/\//.test(u)){aviso("Pega un link válido",true);return;}
    const nota=($("#rnota").value||"").trim();
    guardar(srv=>{ srv.referentes=srv.referentes||[];
      srv.referentes.push({url:u.split("?")[0],quien:YO,nota:nota,
        fecha:new Date().toISOString().slice(0,16).replace("T"," "),
        etapa:"",estado:"sin analizar"});
    });
    $("#rurl").value="";$("#rnota").value="";
  };
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  if(b.dataset.t==="salir")return salir();
  TAB=b.dataset.t; render();
});

async function arranca(){
  /* pase lo que pase con el almacén, el panel SIEMPRE pinta (13-ago: el blob caído
     dejaba la página entera en negro porque nunca se llegaba a render()) */
  let vivo=true;
  try{ E=await leerBlob(); }catch(e){ vivo=false; aviso("Sin conexión con el guardado",true); }
  render();
  if(vivo && !(E.referentes||[]).length && REFS_INI.length){
    /* primera vez: precarga los referentes que ya nos pasaron por WhatsApp */
    guardar(srv=>{ srv.referentes=REFS_INI.slice(); });
  }
}
