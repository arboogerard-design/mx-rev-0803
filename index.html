<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Mentorium · revisar y calendario</title>
<meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0e;color:#e9e9ee;
font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:#111116;border-bottom:1px solid #26262e;
padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:.3px}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:#1a1a22;border:1px solid #2c2c36;color:#c9c9d4;padding:10px 17px;
border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}
.tabs button.on{background:#D3AF39;border-color:#D3AF39;color:#151509}
.wrap{padding:14px;max-width:1250px;margin:0 auto}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtros button{background:#15151b;border:1px solid #2a2a34;color:#b9b9c6;padding:9px 15px;
border-radius:9px;font-size:14px;cursor:pointer}
.filtros button.on{background:#2b2b38;color:#fff;border-color:#4a4a5c}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:#131319;border:1px solid #242430;border-radius:12px;overflow:hidden;
display:flex;flex-direction:column}
/* ⛔ 18-ago · EL PANEL RECORTABA LAS PIEZAS. Este selector forzaba aspect-ratio:9/16 +
   object-fit:cover a TODOS los videos. Medido: los carruseles son 540x676 (4:5) y los reels
   540x960 (9:16) — o sea, cada carrusel se veia RECORTADO dentro de una caja vertical que no es
   la suya: titular cortado por abajo y sujeto descentrado. Y en pantalla completa el recorte se
   mantiene, porque Chrome respeta el object-fit del elemento. Gerard: "cuando hago zoom o pantalla
   completa se ve mal todo el formato, asi no se puede revisar". Tenia razon.
   Ahora manda la relacion REAL de cada fichero: contain nunca recorta, y el alto maximo evita
   que un 4:5 se coma la pantalla. */
.card video,.card img{width:100%;max-height:78vh;object-fit:contain;background:#000;display:block}
.card .b{padding:12px 13px;display:flex;flex-direction:column;gap:10px;flex:1}
.tit{font-weight:800;font-size:17px;line-height:1.3}
.meta{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;padding:2px 7px;border-radius:5px}
.TOFU{background:#123d29;color:#7ee2ab}.MOFU{background:#2b2b42;color:#b9b9ff}
.BOFU{background:#42311b;color:#ffcf8a}.SIN{background:#3a2020;color:#ff9c9c}
.cuenta{background:#1e1e28;color:#a9a9bb}.tipo{background:#191922;color:#8f8fa3}
.cap{font-size:14px;color:#b6b6c6;white-space:pre-wrap;max-height:76px;overflow:hidden;cursor:pointer}
.cap.abierta{max-height:none}
.cap:not(.abierta):not(:empty)::after{content:" … (toca para leer)";color:#6c6c80}
.med{position:relative}
.med .nav{position:absolute;top:50%;transform:translateY(-50%);background:#000000aa;border:0;color:#fff;
font-size:22px;font-weight:900;width:36px;height:48px;cursor:pointer;border-radius:9px;line-height:1}
.med .nav.izq{left:6px}.med .nav.der{right:6px}
.med .cnt{position:absolute;top:8px;right:8px;background:#000000bb;color:#fff;font-size:11px;
font-weight:800;padding:3px 9px;border-radius:999px}
.sec{margin:20px 0 10px;display:flex;align-items:center;gap:9px}
.sec h2{font-size:16px;margin:0;letter-spacing:.4px}
.sec .lin{flex:1;height:1px;background:#242430}
.sec .n{font-size:13px;color:#8b8b9c;font-weight:800}
.acc{display:flex;gap:5px;margin-top:auto}
.acc button{flex:1;border:0;border-radius:10px;padding:13px 6px;font-weight:800;font-size:15px;cursor:pointer}
.ok{background:#1d5c39;color:#c6ffe2}.fix{background:#6b5316;color:#ffe6ad}.no{background:#5e2226;color:#ffc9c9}
.acc button.sel{outline:2px solid #fff}
.motivo{width:100%;background:#0d0d12;border:1px solid #33333f;color:#eee;border-radius:8px;
padding:10px;font-size:14px;resize:vertical;min-height:62px}
.dia{background:#131319;border:1px solid #242430;border-radius:12px;padding:11px;margin-bottom:11px}
.dia h3{margin:0 0 8px;font-size:13.5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.slots{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.slot{background:#0f0f15;border:1px dashed #2e2e3a;border-radius:9px;padding:8px;min-height:64px;font-size:12px}
.slot.lleno{border-style:solid;border-color:#3a3a48}
.slot .fmt{font-size:10px;color:#7d7d90;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.alerta{background:#4a1d1f;color:#ffc9c9;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
.okdia{background:#123d29;color:#7ee2ab;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
.ref{background:#131319;border:1px solid #242430;border-radius:10px;padding:10px;margin-bottom:9px;
display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ref a{color:#8fc7ff;font-size:12.5px;word-break:break-all}
.addref{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.addref input{flex:1;min-width:230px;background:#0d0d12;border:1px solid #33333f;color:#eee;
border-radius:9px;padding:10px;font-size:13px}
.addref button{background:#D3AF39;border:0;color:#151509;font-weight:800;padding:10px 17px;
border-radius:9px;cursor:pointer}
.nota{background:#15151d;border-left:3px solid #D3AF39;padding:9px 12px;border-radius:0 8px 8px 0;
font-size:12.5px;color:#b6b6c6;margin-bottom:13px}
.sync{position:fixed;right:12px;bottom:12px;background:#1d5c39;color:#d9ffe9;padding:8px 14px;
border-radius:9px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.sync.ver{opacity:1}.sync.mal{background:#6b2226;color:#ffd6d6}
#login{position:fixed;inset:0;background:#0b0b0e;display:flex;align-items:center;justify-content:center;z-index:80}
#login .box{background:#131319;border:1px solid #242430;border-radius:14px;padding:22px;width:min(340px,92vw)}
#login input{width:100%;background:#0d0d12;border:1px solid #33333f;color:#eee;border-radius:9px;
padding:11px;margin:9px 0 12px;font-size:15px}
#login .q{display:flex;gap:7px;flex-wrap:wrap}
#login .q button{flex:1;background:#1e1e28;border:1px solid #2e2e3a;color:#ddd;padding:11px;
border-radius:9px;font-weight:700;cursor:pointer}
.err{color:#ff9c9c;font-size:12.5px;min-height:16px}
.vacio{color:#77778a;padding:26px;text-align:center;font-size:13.5px}

/* VISOR — pedido literal de Gerard 14-ago: «si le doy clic a un carrusel quiero ver TODAS
   las slides, incluso hasta con la musica». Abre a pantalla completa, se pasan con el dedo
   y el video suena (no va muteado, que es como se juzga la musica). */
.visor{position:fixed;inset:0;z-index:60;background:#000000f2;display:none;flex-direction:column}
.visor.on{display:flex}
.visor .vtop{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff;
font-size:15px;font-weight:800;border-bottom:1px solid #23232c}
.visor .vcerrar{margin-left:auto;background:#26262f;border:0;color:#fff;font-size:22px;
width:46px;height:46px;border-radius:11px;cursor:pointer;line-height:1}
.visor .vpistas{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;
padding:14px;align-items:center}
.visor .vslide{scroll-snap-align:center;flex:0 0 auto;height:100%;display:flex;
flex-direction:column;gap:8px;align-items:center;justify-content:center}
.visor .vslide video,.visor .vslide img{height:calc(100% - 34px);max-height:74vh;width:auto;
border-radius:12px;background:#000;display:block}
.visor .vn{color:#9a9aab;font-size:13px;font-weight:800}
.visor .vcap{padding:12px 16px;color:#d8d8e4;font-size:15px;line-height:1.5;white-space:pre-wrap;
border-top:1px solid #23232c;max-height:26vh;overflow:auto}
.verver{position:absolute;left:8px;bottom:8px;background:#000000c4;border:1px solid #ffffff30;
color:#fff;font-size:13px;font-weight:800;padding:8px 12px;border-radius:9px;cursor:pointer}

/* MODO FOCO — Gerard 14-ago: «la organizacion es malisima… mas sencillo, mas util,
   mejor explicado». 69 tarjetas en una pared no se revisan en un movil. Se revisa
   de UNA EN UNA, con la pieza grande y tres botones que se puedan pulsar con el pulgar. */
.foco{max-width:540px;margin:0 auto}
.foco .card{border-radius:16px}
.foco .card video,.foco .card img{aspect-ratio:9/16;max-height:58vh;object-fit:contain;background:#000}
.foco .acc button{padding:17px 6px;font-size:17px;border-radius:12px}
.foco .tit{font-size:19px}
.barra{height:8px;background:#1c1c24;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.barra i{display:block;height:100%;background:#D3AF39}
.avance{display:flex;align-items:baseline;gap:10px;font-size:15px;color:#c9c9d4;font-weight:800}
.avance b{font-size:26px;color:#fff}
.avance .resto{margin-left:auto;font-weight:700;color:#8b8b9c;font-size:14px}
.pasos{display:flex;gap:10px;margin:14px 0 4px}
.pasos button{flex:1;background:#17171f;border:1px solid #2c2c36;color:#c9c9d4;
padding:12px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
.pasos button:disabled{opacity:.35;cursor:default}
.comovva{background:#12121a;border:1px solid #23232d;border-radius:12px;padding:13px 15px;
margin-bottom:14px;font-size:15px;line-height:1.6;color:#c4c4d2}
.comovva b{color:#fff}
.comovva div{margin:5px 0}
.vermodo{background:none;border:0;color:#8fc7ff;font-size:14px;font-weight:700;
cursor:pointer;padding:10px 0;text-decoration:underline}
.terminado{text-align:center;padding:50px 20px}
.terminado .big{font-size:46px}
.terminado h2{font-size:22px;margin:12px 0 6px}
.terminado p{color:#9a9aab;font-size:15px;margin:0}

/* BURBUJA del porqué — Gerard 14-ago: «la línea amarilla parece que se mezcle con el caption,
   ponlo en burbuja y dale más animación». Burbuja cerrada con su etiqueta, nada de borde suelto. */
.porque{position:relative;background:linear-gradient(180deg,#191505,#14120a);
border:1px solid #3d3312;border-radius:14px;padding:22px 14px 11px;margin:2px 0;
font-size:13.8px;line-height:1.55;color:#d8d2b8;white-space:pre-wrap;
box-shadow:0 2px 10px rgba(211,175,57,.07)}
.porque::before{content:"POR QUÉ EXISTE ESTA PIEZA";position:absolute;top:-9px;left:12px;
background:#D3AF39;color:#151509;font-size:10px;font-weight:900;letter-spacing:.09em;
padding:2.5px 9px;border-radius:999px}
.porque .q{color:#ffe89a;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.wrap>*{animation:fadeUp .28s ease both}
.card{animation:fadeUp .3s ease both}
.card:hover{transform:translateY(-2px);transition:transform .18s ease}
/* ESPÍA */
.espgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-top:12px}
.espcard{background:#101016;border:1px solid #26262f;border-radius:14px;overflow:hidden;
animation:fadeUp .3s ease both;transition:transform .18s ease,border-color .18s ease}
.espcard:hover{transform:translateY(-3px);border-color:#3a3a48}
.espcard iframe{width:100%;height:420px;background:#000;display:block}
.espmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:9px 10px}
.repl{margin-left:auto;background:#BAFC68;color:#10140b;font-weight:900;font-size:12px;
border:none;border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .15s}
.repl:hover{transform:scale(1.06)}
.repl.hecho{background:#2a3a2e;color:#9fe0b8}
/* HOOKS */
.hk{background:#101016;border:1px solid #26262f;border-radius:13px;padding:13px 14px;
margin-bottom:11px;animation:fadeUp .3s ease both}
.hk .htxt{font-size:16.5px;font-weight:700;color:#eee;line-height:1.4}
.hk .hmeta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.hk textarea{width:100%;background:#12121a;border:1px solid #33333f;color:#eee;border-radius:9px;
padding:9px 10px;font-size:14.5px;resize:vertical;min-height:44px;display:none;margin-top:8px}
.hk.editando textarea{display:block}
.hk .hfuente{font-size:11.5px;color:#77778a;margin-top:5px}
.hk.ap{border-color:#1d4030;background:#0d1510}
.hk.dn{opacity:.45}
.hk .acc{margin-top:9px}
/* IG */
.igbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:14px}
.igcard{background:#101016;border:1px solid #26262f;border-radius:13px;padding:14px;text-align:center}
.igcard .n{font-size:27px;font-weight:900;color:#fff;letter-spacing:-.02em}
.igcard .l{font-size:11.5px;color:#8b8b9c;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.igtab{width:100%;border-collapse:collapse;font-size:13.5px}
.igtab th{color:#8b8b9c;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
padding:7px 8px;border-bottom:1px solid #26262f}
.igtab td{padding:8px;border-bottom:1px solid #1a1a22;color:#ccc}
.igtab tr.nos td{color:#ffe89a;font-weight:700}
.igtab .r{text-align:right;font-variant-numeric:tabular-nums}

/* CORRECCION POR SLIDE — Gerard 14-ago: «si en un carrusel solo falla UNA slide, ¿qué?».
   Antes solo habia un motivo para la pieza entera, asi que decir «la 4 esta mal» era imposible
   sin escribirlo a mano en el motivo general y esperar que yo lo interpretase bien. */
.visor .vslide{position:relative}
.visor .snota{width:100%;max-width:min(34vh,320px);background:#12121a;border:1px solid #33333f;
color:#eee;border-radius:9px;padding:9px 10px;font-size:13.5px;resize:none;min-height:42px}
.visor .snota:focus{border-color:#D3AF39;outline:none}
.visor .snota.tiene{border-color:#D3AF39;background:#1a1710}
.visor .vslide .marca{position:absolute;top:6px;left:6px;background:#D3AF39;color:#151509;
font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;display:none}
.visor .vslide.conmarca .marca{display:block}
.nslides{background:#3a2f10;color:#ffd97a;font-size:12px;font-weight:800;padding:3px 9px;
border-radius:6px}

/* === SKIN MENTORIUM V4 (15-ago noche) — capa override, no toca la logica === */
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap');
/* tokens de BRAND/design_system_mentorium.json (ESTANDAR_ELITE_22AGO §3): dorado apagado
   #F5D96D (el amarillo chillon esta prohibido, delata AI) + fondos/lineas de marca. */
:root{--mx-oro:#F5D96D;--mx-negro:#08080b;--mx-panel:#131317;--mx-borde:#22222a;
      --mx-tx:#f3f1ea;--mx-dim:#9a978e;--mx-ok:#3ECF8E;--mx-no:#E5484D;
      --javi:#3ECF8E;--jordi:#5B9DFF;--jose:#FF8A3D;}
body{background:var(--mx-negro)!important;font-family:'Montserrat',system-ui,sans-serif!important;color:var(--mx-tx)!important;}
h1,h2,h3,.titulo{font-family:'Montserrat',sans-serif!important;font-weight:800!important;letter-spacing:.02em;}
button,.btn,.tab{font-family:'Montserrat',sans-serif!important;font-weight:700!important;border-radius:10px!important;}
.card,.pieza,.tarjeta{background:var(--mx-panel)!important;border:1px solid var(--mx-borde)!important;border-radius:14px!important;box-shadow:0 8px 28px rgba(0,0,0,.45)!important;transition:transform .15s,border-color .15s;}
.card:hover,.pieza:hover,.tarjeta:hover{transform:translateY(-3px);border-color:var(--mx-oro)!important;}
/* 18-ago: esta regla llevaba !important y era la que de verdad mandaba — recortaba las imagenes de carrusel (4:5) dentro de una caja 9:16. Se quita el recorte; el radio se queda. */
.card img,.pieza img{border-radius:10px 10px 0 0!important;max-height:78vh;object-fit:contain;width:100%!important;}
.mx-header{position:static;z-index:50;/* 20-ago: era sticky top:0 igual que el header de pestañas (z-20): al hacer scroll el banner TAPABA las pestañas y dejaban de responder al toque. El banner se va con el scroll; las pestañas se quedan. */display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(180deg,#0d0d0d 70%,rgba(13,13,13,.92));border-bottom:1px solid var(--mx-borde);backdrop-filter:blur(8px);}
.mx-logo{font-weight:900;font-size:19px;letter-spacing:.14em;color:var(--mx-oro);}
.mx-sub{font-size:11px;letter-spacing:.22em;color:#8a8a8a;text-transform:uppercase;}
.mx-pill{margin-left:auto;background:#1b1b1b;border:1px solid var(--mx-borde);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--mx-oro);}
.tab.activa,.tab.active,.tab[aria-selected=true]{background:var(--mx-oro)!important;color:#111!important;}
::selection{background:var(--mx-oro);color:#111}


.espana{margin-top:8px;background:#161616;border:1px solid #2a2a2a;border-radius:10px;padding:8px 10px;font-size:12px;}
.espana summary{cursor:pointer;font-weight:800;color:#C9A961;letter-spacing:.04em;}
.esparec{margin:8px 0;color:#cfcfcf;line-height:1.5;}
.espcol ul{margin:4px 0 8px 16px;padding:0;color:#bdbdbd;line-height:1.55;}


/* comparación referente ↔ réplica (18-ago) */
.cmp{margin-top:10px;border-top:1px solid #24242e;padding-top:10px}
.cmp>summary{cursor:pointer;color:#8b8b9c;font-size:13px;list-style:none;user-select:none}
.cmp>summary::-webkit-details-marker{display:none}
.cmp>summary:before{content:"⇄ ";color:#5B9DFF}
.cmp[open]>summary{color:#c9c9d6;margin-bottom:8px}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmpgrid figure{margin:0}
.cmpgrid figcaption{font-size:11px;color:#8b8b9c;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.cmpgrid video,.cmpgrid img{width:100%;border-radius:8px;background:#0b0b10;display:block}
.cmpnota{font-size:11px;color:#6f6f80;margin-top:6px}
@media(max-width:720px){.cmpgrid{grid-template-columns:1fr}}

/* correcciones de un toque + aprobar seccion (18-ago) */
.fixr{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.fixr b{width:100%;font-size:11px;color:#6f6f80;font-weight:400;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.fixr button{background:#1a1a22;border:1px solid #2e2e3a;color:#c9c9d6;border-radius:999px;
  padding:6px 11px;font-size:12px;cursor:pointer;line-height:1.1}
.fixr button:hover{border-color:#5B9DFF;color:#fff}
.secacc{float:right;background:#14351f;border:1px solid #2b6b40;color:#8fe0aa;border-radius:8px;
  padding:6px 12px;font-size:12px;cursor:pointer}
.secacc:hover{background:#1a4527}
@media(max-width:720px){.secacc{float:none;display:block;width:100%;margin:8px 0 4px}
  .fixr button{padding:8px 12px;font-size:13px}}

/* REPASAR — una pieza, una decision (18-ago) */
.rp{max-width:560px;margin:0 auto;padding:0 4px}
.rphead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.rpprog{font-size:13px;color:#8b8b9c}
.rpbar{flex:1;height:5px;background:#1c1c24;border-radius:99px;overflow:hidden}
.rpbar i{display:block;height:100%;background:#5B9DFF;border-radius:99px;transition:width .25s}
.rpmed{background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.rpmed video,.rpmed img{width:100%;max-height:62vh;object-fit:contain;display:block}
.rptit{font-size:15px;font-weight:600;margin:10px 0 2px;line-height:1.25}
.rpsub{font-size:12px;color:#8b8b9c;margin-bottom:10px}
.rpsub .sig{opacity:.55;font-size:11px}
.rpacc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.rpacc button{padding:14px 8px;border-radius:11px;border:1px solid #2e2e3a;background:#16161d;
  color:#c9c9d6;font-size:14px;font-weight:600;cursor:pointer}
.rpacc .ok{border-color:#2b6b40;color:#8fe0aa}
.rpacc .ok:hover,.rpacc .ok.sel{background:#14351f}
.rpacc .fix{border-color:#6b5a2b;color:#e0cf8f}
.rpacc .fix:hover,.rpacc .fix.sel{background:#352d14}
.rpacc .no{border-color:#6b2b2b;color:#e08f8f}
.rpacc .no:hover,.rpacc .no.sel{background:#351414}
.rp details{border-top:1px solid #20202a;padding:9px 0}
.rp details>summary{cursor:pointer;color:#8b8b9c;font-size:13px;list-style:none}
.rp details>summary::-webkit-details-marker{display:none}

,"archivos": [{"archivo": "PAPEL_JAVI_CUATRO_FUGAS.mp4","poster": "media/PAPEL_JAVI_CUATRO_FUGAS_19AGO__00.jpg","peso_mb": 1.7,"video": "media/PAPEL_JAVI_CUATRO_FUGAS_19AGO__00.mp4"}],"origen": "PARA_REVISAR/PAPEL_JAVI_CUATRO_FUGAS_19AGO"},{"id": "FRASE_JORDI_PORSCHE_PROCESO_19AGO","cuenta": "JORDI","tipo": "reel","dia": "vie 28","hora": "19:30","etiqueta": "TOFU","caption": "El vídeo dura diez segundos. Lo de antes duró años.\n\nDías de no dormir y meses facturando sin ganar nada. Eso último, además, no es mala señal: significa que estás aprendiendo dónde se te va el dinero.\n\n¿En qué punto estás tú ahora mismo?\n\n#ecommerce #dropshipping #emprender","archivos": [{"archivo": "FRASE_JORDI_PORSCHE_PROCESO.mp4","poster": "media/FRASE_JORDI_PORSCHE_PROCESO_19AGO__00.jpg","peso_mb": 13.36}],"origen": "PARA_REVISAR/FRASE_JORDI_PORSCHE_PROCESO_19AGO"},{"id": "JAVI_CAJITA_PUBLICO_9AGO","cuenta": "JAVI","tipo": "reel","dia": "vie 28","hora": "20:00","etiqueta": "","caption": "Para todos los dueños de tiendas online\n\n#ecommerce #negocios","archivos": [{"archivo": "JAVI_CAJITA_PUBLICO.mp4","poster": "media/JAVI_CAJITA_PUBLICO_9AGO__00.jpg","peso_mb": 15.35}],"origen": "PARA_REVISAR/JAVI_CAJITA_PUBLICO_9AGO"},{"id": "REEL_JORDI_FILTRO_2AGO","cuenta": "JORDI","tipo": "reel","dia": "vie 28","hora": "20:00","etiqueta": "MOFU","caption": "La mayoría prueba productos. Muy poca gente construye un filtro.\n\nCoges cuatro o cinco, los lanzas… y ahí es donde casi todo el mundo se equivoca: sigue\nlanzando sin pararse a mirar qué pasó con los anteriores.\n\nPara. Analiza. ¿Cuál creó más interés? ¿Cuál te dejaba menos margen? ¿Cuál se vendió de verdad?\n\nDe ahí sale un patrón: producto pequeño, con margen, que funciona en ese mercado concreto.\nY de ese patrón sale tu filtro, el tuyo, no el que te vendan.\n\nEs lo más complicado del negocio. Y a la vez lo más bonito.\n\n#ecommerce #dropshipping #producto","archivos": [{"archivo": "REEL_JORDI_FILTRO.mp4","poster": "media/REEL_JORDI_FILTRO_2AGO__00.jpg","peso_mb": 38.81}],"origen": "PARA_REVISAR/REEL_JORDI_FILTRO_2AGO"},{"id": "JAVI_CARRUSEL_B_6preguntas_8slides","cuenta": "JAVI","tipo": "carrusel","dia": "sáb 29","hora": "19:00","etiqueta": "","caption": "","archivos": [{"archivo": "slide_01.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__00.jpg"},{"archivo": "slide_02.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__01.jpg"},{"archivo": "slide_03.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__02.jpg"},{"archivo": "slide_04.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__03.jpg"},{"archivo": "slide_05.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__04.jpg"},{"archivo": "slide_06.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__05.jpg"},{"archivo": "slide_07.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__06.jpg"},{"archivo": "slide_08.png","poster": "media/JAVI_CARRUSEL_B_6preguntas_8slides__07.jpg"}],"origen": "_CONTENIDO_JAVI_JORDI_HOY/1_JAVI/CARRUSEL_B_6preguntas_8slides"},{"id": "REEL_JAVI_EVENTO_ALUMNOS_20AGO","cuenta": "JAVI","tipo": "reel","dia": "sáb 29","hora": "20:00","etiqueta": "BOFU","caption": "No me creas a mí. Escúchalos a ellos.\n\nGrabado en nuestro último evento, sin guion. Tres alumnos, tres momentos distintos, la misma historia.\n\n#ecommerce #tiendaonline #emprender","archivos": [{"archivo": "JAVI_EVENTO_ALUMNOS_20AGO.mp4","poster": "media/REEL_JAVI_EVENTO_ALUMNOS_20AGO__00.jpg","peso_mb": 23.3}],"origen": "PARA_REVISAR/REEL_JAVI_EVENTO_ALUMNOS_20AGO"},{"id": "REEL_JORDI_MIEDO_QUEDIRAN","cuenta": "JORDI","tipo": "reel","dia": "sáb 29","hora": "20:00","etiqueta": "TOFU","caption": "Tardé en comprarme el coche por miedo al qué dirán.\n\nCuando por fin lo hice, no me crucé con una sola persona que me hiciera un comentario. Ni uno.\n\nEl miedo casi nunca es a la consecuencia. Es a la reacción de gente que ni se acuerda de ti al día siguiente. Y te bloquea igual para comprarte algo que para abrir una tienda, o ue audita los .txt, .md\ny .json de la pieza) se la pondría. Su copy no se corrige, así que el literal vive en un .csv,\nque además es el formato con el que Ads Manager importa el texto de los anuncios. Aquí abajo van\nel reparto y el criterio.\n\n======================================================================\nCOPY A — de qué va (el literal, en el .csv)\n======================================================================\nAbre por el dolor del sueldo: \"Cansado de trabajar 8horas por un sueldo mediocre...\",\npromete recurso gratis y cierra con la flecha.\n\n======================================================================\nCOPY B — de qué va (el literal, en el .csv)\n======================================================================\nAbre por la desconfianza: \"Cansado de vender humos ? Y estafas online...\", ofrece los recursos\ngratis para montarlo paso a paso y cierra mandando pinchar en el enlace.\n\n======================================================================\nQUÉ COPY VA CON CADA CREATIVIDAD\n======================================================================\n| # | creatividad                          | ángulo de Javi                             | copy |\n|---|--------------------------------------|--------------------------------------------|------|\n| 01| AD_JAVI_01_ESTAFA                    | Estafa                                     |  B   |\n| 02| AD_JAVI_02_PRUEBA_SOCIAL             | casos de éxito (texto en el medio)         |  B   |\n| 03| AD_JAVI_03_AUTORIDAD_PRENSA          | autoridad prensa                           |  B   |\n| 04| AD_JAVI_04_TRABAJO_A_ONLINE          | trabajo tradicional a online               |  A   |\n| 05| AD_JAVI_05_IA_QUITA_PUESTOS          | la IA quita puestos / te monta el negocio  |  A   |\n| 06| AD_JAVI_06_TIENDA_MONTADA_IA         | dueño de tienda online montada por IA      |  A   |\n| 07| AD_JAVI_07_NEGOCIO_RENTABLE_2026     | el negocio con IA más rentable de 2026     |  B   |\n| 08| AD_JAVI_08_MONTA_Y_VENDE             | monta tu negocio de IA y vende online      |  A   |\n\nCriterio del reparto: el COPY B abre por credibilidad (\"humos / estafas\") y va con los cuatro\nángulos que atacan la desconfianza (01, 02, 03, 07). El COPY A abre por el dolor del sueldo y va\ncon los cuatro que venden el cambio y el montaje (04, 05, 06, 08).\n\n======================================================================\nDESTINO DEL LINK — OBLIGATORIO\n======================================================================\nEl \"Recurso GRATIS\" y el cierre del COPY B tienen que caer en un DOMINIO PROPIO\n(mentoriumacademy.com). NUNCA sites.leadconnectorhq.com: Gerard se lo dijo a Javi el 11-jul\n(\"ese está muy quemado\") y aún se le siguen pasando URLs de leadconnector.\nLa URL exacta la pone Gerard en Ads Manager. Aquí no se inventa ninguna ruta.\n\n======================================================================\nCANDADOS QUE CUMPLE ESTE PAQUETE\n======================================================================\n- Hashtags: 0. Son ads, no post orgánico; el techo de 3 de Javi ni se roza.\n- Cero cifras de dinero, de resultados o de alumnos, ni en imagen ni en texto. Las únicas cifras\n  que aparecen en pantalla son \"8 horas\" (sale del propio COPY A que escribió Javi) y el año\n  \"2026\".\n- Cifra en imagen sí / cifra en texto no: no hay cifra en ninguno de los dos lados, así que la\n  regla se cumple por defecto.\n- Un solo acento de color: el verde de Javi #3ECF8E. Cero morado, cero #333 y cero #666.\n- El diferenciador que marcó Javi: donde el referente (Toni) pone \"LIVE\" arriba, aquí va\n  \"Recurso GRATIS\".\n- NADA SE PUBLICA sin OK de Gerard, creatividad a creatividad.","archivos": [{"archivo": "AD_JAVI_01_ESTAFA_1080x1350.png","poster": "media/ADS_8_ANGULOS_JAVI_5AGO__00.jpg"},{"archivo": "AD_JAVI_02_PRUEBA_SOCIAL_1080x1350.png","poster": "media/ADS_8_ANGULOS_JAVI_5AGO__01.jpg"},{"archivo": "AD_JAVI_03_AUTORIDAD_PRENSA_1080x1350.p  "Dentro del panel hay 64 herramientas repartidas en 10 secciones. Calculadoras, auditores, generadores, simuladores.\n\nNinguna decide qué vendes, ni a quién, ni a qué precio. Eso lo decides tú, y es la única parte que no se puede automatizar.\n\nLas herramientas ahorran horas. No ahorran criterio.\n\nComenta RECURSOS.\n\n#ecommerce #shopify #herramientas","archivos": [{"archivo": "M3_64_herramientas.mp4","poster": "media/MEME_JAVI_M3_64_HERRAMIENTAS_1AGO__00.jpg","peso_mb": 0.89,"video": "media/MEME_JAVI_M3_64_HERRAMIENTAS_1AGO__00.mp4"}],"origen": "PARA_REVISAR/MEME_JAVI_M3_64_HERRAMIENTAS_1AGO"},{"id": "MEME_JAVI_M4_PRECIO_ANTES_1AGO","cuenta": "JAVI","tipo": "meme","dia": "","hora": "","etiqueta": "BOFU","caption": "El primer paso no cuesta dinero, cuesta ponerse.\n\nLa clase 01 del módulo va de abrir tu tienda de Shopify por un euro al mes, y dura 1 minuto y 23 segundos. Está dentro del panel, sin pagar nada.\n\nSi eso no lo has hecho todavía, no preguntes por lo de después. Haz eso primero.\n\nComenta RECURSOS.\n\n#ecommerce #shopify","archivos": [{"archivo": "M4_precio_antes_de_empezar.mp4","poster": "media/MEME_JAVI_M4_PRECIO_ANTES_1AGO__00.jpg","peso_mb": 0.98,"video": "media/MEME_JAVI_M4_PRECIO_ANTES_1AGO__00.mp4"}],"origen": "PARA_REVISAR/MEME_JAVI_M4_PRECIO_ANTES_1AGO"},{"id": "MEME_JAVI_TIP_15AGO","cuenta": "JAVI","tipo": "meme","dia": "","hora": "","etiqueta": "TOFU","caption": "Tutorial de cómo hacerse rico rápido 🤣","archivos": [{"archivo": "MEME_JAVI_TIP.mp4","poster": "media/MEME_JAVI_TIP_15AGO__00.jpg","peso_mb": 1.02,"video": "media/MEME_JAVI_TIP_15AGO__00.mp4"},{"archivo": "frame.png","poster": "media/MEME_JAVI_TIP_15AGO__01.jpg"}],"origen": "PARA_REVISAR/MEME_JAVI_TIP_15AGO"},{"id": "MEME_REPLICA_JAVI_DEV1K","cuenta": "JAVI","tipo": "meme","dia": "","hora": "","etiqueta": "TOFU","caption": "CUENTA: @javier.sanchezecom\nFORMATO: meme letterbox @co1e0 · banda NEGRA + texto BLANCO · 1 plano fijo · 0 cortes · 7,50 s\nESTADO: SIN PUBLICAR. Pendiente de OK de Gerard.\n\nQUÉ VIRAL REPLICA (esto es lo que faltaba en la versión anterior)\n Réplica del post real `DYn3Ujti6Sd` de @co1e0 — 59.714 plays medidos (scrape Apify, 04-jun).\n Original literal:\n   \"How I look at bro after he just paid a dev $1k to build him a Shopify theme and I just\n    took a screenshot and asked Claude to give me the custom liquid\"\n Nuestra versión, traducción casi palabra por palabra:\n   \"Cómo miro a mi colega después de pagarle 1.000 € a un programador para el tema de Shopify,\n    y yo hice una captura y le pedí el código a Claude\"\n   (la captura tardó 4 segundos)\n 4 líneas, igual que el original. El remate entre paréntesis lo llevan solo el nº1 (407K) y el\n nº8 del corpus: es lo que separa un meme de 40K de uno de 400K.\n\n Y lo mejor: es VERDAD. El panel tiene una biblioteca de Liquid de Shopify hecha exactamente\n así (`biblioteca-liquid-shopify.html`, 175 KB, la herramienta más grande del panel).\n\nPLANO: Javi solo, en el evento, mirada de lado con media sonrisa — que es literalmente\n \"cómo miro a mi colega\". Clip verificado como Javi en el banco (`evento_r1c5602_17`, 4K).\n Descartado el plano del salón del evento donde salían los dos: identidad cruzada = pieza tirada.\n Descartada también la placa del alumno que aparece en ese clip: lleva una cifra visible y Javi\n viene de un baneo de Meta (cero cifras como reclamo).\n\nMÚSICA VIRAL: Cochise — Tell Em (Instrumental Remix, slowed + reverb). Trending, sin letra.\n Si puedes, súbela con la canción desde la app nativa de Instagram en vez de con el audio\n incrustado: así el reel entra en la página de esa canción y arrastra alcance.\n\nLUFS: input_i = -14,04 · input_tp = -4,52 (gate 2 PASS)\n\nCAPTION (pegar tal cual):\nEl tema no hay que programarlo desde cero. Hay que saber qué pedirle.\n\nDentro del panel está la biblioteca de códigos de Shopify y el módulo nuevo: 12 clases,\n1 h 06 min, de la cuenta vacía a la tienda publicada.\n\nComenta RECURSOS y te llega el acceso.\n\n#shopify #ecommerce\n\nNOTAS:\n - Post-baneo: cero promesas de dinero, cero cifras como reclamo. 2 hashtags de 3.\n - No nombrar ninguna agencia ni programador concreto, ni en pantalla ni en comentarios.","archivos": [{"archivo": "MEME_REPLICA_JAVI_DEV1K.mp4","poster": "media/MEME_REPLICA_JAVI_DEV1K__00.jpg","peso_mb": 3.2,"video": "media/MEME_REPLICA_JAVI_DEV1K__00.mp4"},{"archivo": "MEME_REPLICA_JAVI_DEV1K_PORTADA.png","poster": "media/MEME_REPLICA_JAVI_DEV1K__01.jpg"}],"origen": "PARA_REVISAR/MEME_REPLICA_JAVI_DEV1K"},{"id": "MUESTRA_JAVI_TOFU_V3_11AGO","cuenta": "JAVI","tipo": "reel","dia": "","hora": "","etiqueta": "TOFU","caption": "Trabajaba de lunes a sábado buscando clientes de casa en casa. Sin tiempo y sin vida social.\n\nY aun así no llegaba. El problema no era currar más: era que nadie me había enseñado dónde mirar.\n\nComenta RECURSOS y te mando el pack completo.\n\n#emprender #ecommerce #mentalidad","archivos": [{"archivo": "MUESTRA_JAVI_TOFU_V3_11AGO.mp4","poster": "media/MUESTRA_JAVI_TOFU_V3_11AGO__00.jpg","peso_mb": 33.68}],"origen": "PARA_REVISAR/MUESTRA_JAVI_TOFU_V3_11AGO"},{"id": "PAPEL_JAVI_EL_QUE_DUDA_19AGO","cuenta": "JAVI","tipo": "reel","dia": "","hora": "","etiqueta": "TOFU","caption": "El que duda no compra, y encima no te lo dice. Se va y ya está.\n\nPor eso las tiendas que no venden casi nunca tienen un problema de producto: tienen un problema de confianza. Y la confianza no se nota mirándola por dentro, porque tú ya te fías de ti.\n\nTres cosas que se miran antes de tocar el presupuesto, y ninguna te cuesta nada: si tu tienda da confianza a un desconocido, en qué punto de madurez estás de verdad, y qué pasaría si doblaras la inversión.\n\n¿Cuál de las tres crees que tienes peor?\n\n#ecommerce #emprender #tiendaonline","archivos": [{"archivo": "PAPEL_JAVI_EL_QUE_DUDA_NO_COMPRA.mp4","poster": "media/PAPEL_JAVI_EL_QUE_DUDA_19AGO__00.jpg","peso_mb": 1.57,"video": "media/PAPEL_JAVI_EL_QUE_DUDA_19AGO__00.mp4"}],"origen": "PARA_REVISAR/PAPEL_JAVI_EL_QUE_DUDA_19AGO"},{"id": "POD_QA15_JAVI_15AGO","cuenta": "JAVI","tipo": "reel","dia": "","hora": "","etiqueta": "BOFU","caption": "Te enseñan el Rolex, pero nunca sus números.\nNosotros no mostramos lifestyle porque estamos currando. Lo fácil no existe.\n¿Tú de qué lado estás? Te leo en comentarios.\n#ecommerce #emprender #negocios","archivos": [{"archivo": "POD_QA15_JAVI.mp4","poster": "media/POD_QA15_JAVI_15AGO__00.jpg","peso_mb": 50.83},{"archivo": "POD_QA15_JAVI_V2.mp4","poster": "media/POD_QA15_JAVI_15AGO__01.jpg","peso_mb": 48.02},{"archivo": "POD_QA15_JAVI_V3.mp4","poster": "media/POD_QA15_JAVI_15AGO__02.jpg","peso_mb": 48.18},{"archivo": "POD_QA15_JAVI_V4.mp4","poster": "media/POD_QA15_JAVI_15AGO__03.jpg","peso_mb": 48.2}],"origen": "PARA_REVISAR/POD_QA15_JAVI_15AGO"},{"id": "REEL_JAVI_CERO_2AGO","cuenta": "JAVI","tipo": "reel","dia": "","hora": "","etiqueta": "BOFU","caption": "No venimos de ser programadores. Ni de haber sido informáticos.\n\nYo era entrenador personal. Jordi tenía su trabajo. Ocho horas al día, profesiones\nnormales y corrientes, cambiando nuestro tiempo por dinero.\n\nEmpezamos totalmente de cero, aprendiendo como cualquier persona normal.\n\nSi estás esperando tener el perfil, el título o la experiencia para arrancar:\nnosotros tampoco los teníamos. Y así empezamos.\n\n#ecommerce #emprender #mentalidad","archivos": [{"archivo": "REEL_JAVI_CERO.mp4","poster": "media/REEL_JAVI_CERO_2AGO__00.jpg","peso_mb": 57.04}],"origen": "PARA_REVISAR/REEL_JAVI_CERO_2AGO"},{"id": "REEL_JAVI_CERO_V2","cuenta": "JAVI","tipo": "reel","dia": "","hora": "","etiqueta": "BOFU","caption": "No venimos de ser programadores. Ni de haber sido informáticos.\n\nYo era entrenador personal. Jordi tenía su trabajo. Ocho horas al día, profesiones\nnormales y corrientes, cambiando nuestro tiempo por dinero.\n\nEmpezamos totalmente de cero, aprendiendo como cualquier persona normal.\n\nSi estás esperando tener el perfil, el título o la experiencia para arr ia/CARRUSEL_JORDI_7BARES_4AGO__04.jpg"},{"archivo": "slide_06.png","poster": "media/CARRUSEL_JORDI_7BARES_4AGO__05.jpg"},{"archivo": "slide_07.png","poster": "media/CARRUSEL_JORDI_7BARES_4AGO__06.jpg"}],"origen": "PARA_REVISAR/CARRUSEL_JORDI_7BARES_4AGO"},{"id": "CARRUSEL_JORDI_ALQUILADO_4AGO","cuenta": "JORDI","tipo": "carrusel","dia": "","hora": "","etiqueta": "BOFU","caption": "«¿Es alquilado?» Me lo preguntan todas las semanas.\n\nNo: lo compré con una de mis empresas. Y sí, es verdad que lo podría alquilar — sería más barato y nadie lo notaría.\n\nPero yo no quiero hacer un personaje. Si el coche es el negocio, no hay negocio.\n\nLo compré por la experiencia que me da. Y porque a veces creo que necesitamos todos un caramelo: cualquier negocio son muchas horas, y un día malo pesa igual con coche o sin él.\n\nEl coche no monta la tienda. El sistema sí.\n\nComenta «RECURSOS» y te paso las 64 herramientas que uso.\n\n#ecommerce #dropshipping #mentalidad","archivos": [{"archivo": "slide_01.png","poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__00.jpg"},{"archivo": "slide_02.png","poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__01.jpg"},{"archivo": "slide_03.png","poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__02.jpg"},{"archivo": "slide_04.png","poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__03.jpg"},{"archivo": "slide_05.png","poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__04.jpg"},{"archivo": "slide_06.png","poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__05.jpg"},{"archivo": "slide_07.png","poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__06.jpg"}],"origen": "PARA_REVISAR/CARRUSEL_JORDI_ALQUILADO_4AGO"},{"id": "CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO","cuenta": "JORDI","tipo": "carrusel","dia": "","hora": "","etiqueta": "BOFU","caption": "Hay casas donde todo son problemas.\n\nUn niño de 10, 12, 15 años llega a casa y sus padres: problemas con el dinero, problemas con la familia, problemas con las amistades. Se quejan de la televisión y se quejan.\n\nEso crea un círculo de queja, una energía negativa dentro de casa que puede que te influya en tu futuro. Y eso es lo importante: romperlo.\n\nEn mi casa montaron negocios y se quebraron. Gracias a esos errores soy conservador en todos los negocios que monto.\n\nHoy cada día soy más estricto con mi círculo: cuando a la gente de mi entorno le pasa un problema, busca solución. No se queja.\n\n¿Te suena esa casa? Cuéntamelo en comentarios.\n\n#ecommerce #mentalidad #entorno","archivos": [{"archivo": "slide_01.png","poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__00.jpg"},{"archivo": "slide_02.png","poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__01.jpg"},{"archivo": "slide_03.png","poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__02.jpg"},{"archivo": "slide_04.png","poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__03.jpg"},{"archivo": "slide_05.png","poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__04.jpg"},{"archivo": "slide_06.png","poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__05.jpg"},{"archivo": "slide_07.png","poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__06.jpg"}],"origen": "PARA_REVISAR/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO"},{"id": "CARRUSEL_JORDI_ELEGIR_PRODUCTO","cuenta": "JORDI","tipo": "carrusel","dia": "","hora": "","etiqueta": "","caption": "","archivos": [{"archivo": "slide_01.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__00.jpg"},{"archivo": "slide_02.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__01.jpg"},{"archivo": "slide_03.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__02.jpg"},{"archivo": "slide_04.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__03.jpg"},{"archivo": "slide_05.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__04.jpg"},{"archivo": "slide_06.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__05.jpg"},{"archivo": "slide_07.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__06.jpg"},{"archivo": "slide_08.png","poster": "media/CARRUSEL_JORDI_ELEGIR_PRODUCTO__07.jpg"}],"origen": "_CONTENIDO_JAVI_JORDI_HOY/2_JORDI/CARRUSEL_JORDI_ELEGIR_PRODUCTO"},{"id": "CARRUSEL_JORDI_FILTRO_2AGO","cuenta": "JORDI","tipo": "carrusel","dia": "","hora": "","etiqueta": "MOFU","caption": "CUENTA: @jordigarcia89\nFORMATO: carrusel de 6 slides 4:5. Slide 1 = CLIP DE VÍDEO (1080x1350, 7 s, con música);\nslides 2-6 = PNG 2160x2700.\nSPEC: la MISMA clonada de @gala_lc que usa CARRUSEL_CLON_GALA_JORDI_31JUL (foto real a sangre,\ntitular serif Playfair + cuerpo Montserrat, UN solo acento, arco objeción -> remate -> antes\ncrudo -> verdad -> prueba real -> reencuadre + CTA). Cambia el QUÉ, nunca el CÓMO.\nESTADO: SIN PUBLICAR. Pendiente de OK de Gerard, pieza a pieza.\n\nCAPTION (pegar tal cual):\n\"He probado cinco productos y ninguno ha tirado.\"\n\nMe lo dicen cada semana. Y casi siempre el fallo no está en el producto: está en que se lanza el\nsexto sin haber mirado qué pasó con los cinco anteriores.\n\nPara. Y mira hacia atrás. ¿Cuál creó más interés? ¿Cuál te dejaba menos margen? ¿Cuál se vendió\nde verdad, sin tener que regalarlo?\n\nDe ahí sale un patrón: producto pequeño, con margen, que funciona en ese mercado concreto. Y de\nese patrón sale tu filtro. El tuyo, no el que te vendan.\n\nEs lo más complicado del negocio. Y a la vez lo más bonito.\n\nComenta RECURSOS y te paso el panel entero. Gratis.\n\n#ecommerce #dropshipping #producto\n\nNOTAS PARA GERARD:\n- Cero cifras de facturación de Jordi (Hacienda). Su autoridad va sin número: \"alguien que ha\n  tirado más productos de los que recuerda\".\n- Las dos capturas son de herramientas REALES y publicadas: validador-producto.html y\n  calculadora-rentabilidad-sku.html (06_HERRAMIENTAS_HTML/_deploy/). Se muestran en su estado\n  inicial, sin rellenar: no hay ni un dato inventado ni un resultado de alumno.\n- Portada = CLIP DE VÍDEO, no foto (Gerard 24-jul). Es también lo que la distingue de la portada\n  del carrusel de Javi (gate C6: tipo de portada distinto).\n- El copy sale del guion ya aprobado por gate de REEL_JORDI_FILTRO_2AGO. Ese reel y este carrusel\n  cuentan lo mismo: NO se publican el mismo día. Escalonar 2-3 días (regla C6).\n- Cuerpo de texto subido de 48 a 62 px respecto al clon del 31-jul: en móvil el tamaño original\n  se leía a 9 px. Responde a la petición de Jordi del 1-ago (20:49): que el texto se vea más grande.\n\nAUDITORÍA 2-ago (segunda pasada, slides miradas una a una):\n- ARREGLADO · slide 5. El pantallazo de la calculadora estaba cortado POR LA MITAD de la fila de\n  inputs: la fila quedaba a ras del borde, sin margen, y el panel \"TUS PRODUCTOS\" salía rebanado.\n  Parecía un pantallazo a medio cargar, y al lado de la slide 4 (que cierra limpia y redondeada)\n  cantaba. Re-cortado del mismo `rentabilidad.png`: ahora entra la tarjeta ENTERA — cabecera, las\n  3 filas, \"+ Añadir producto\" y el botón \"Analizar rentabilidad\". Además queda en formato retrato\n  como la captura de la slide 4, así que las dos slides de prueba pesan visualmente igual.\n- AÑADIDO · `_gate/_CLON_CHECK.png` — el lado a lado referente/pieza que exige replica-100.md\n  punto 5 y que faltaba. Cuatro columnas: portada, texto, pruebas y cierre. Va dentro de `_gate/`\n  a propósito: en la raíz de la pieza, el gate lo audita como si fuera una slide más y lo tumba\n  por apaisado (2200x1536), que es justo lo que tiene que ser un lado a lado.\n- DESVIACIÓN QUE DECIDE GERARD (está marcada en el _CLON_CHECK): en la portada, el referente\n  centra el remate en MAYÚSCULAS sobre un plano de objeto (el lambo). Aquí el remate va a la\n  IZQUIERDA y en caja baja, porque la portada es un CLIP de Jordi hablando y su cara ocupa la\n  mitad derecha: centrarlo se lo comería. Es la única desviación del CÓMO en toda la pieza.\n- OJO A LA FOTO DE LA SLIDE 2 (criterio, no fallo): es un rincón de hotel — butaca, planta y un\n  enchufe con el cable colgando en medio del encuadre. De Jordi solo se le ve el brazo. Encaja con\n  la spec (el referente también mete un plano ambiente sin cara), pero es el asset más flojo de la\n  pieza. Si quieres otra, se cambia y se vuelve a pasar el gate.\n- Verificado hoy, con mis ojos: identidad de la portada (Facenet512, dist_jordi 0,115 vs\n  dist_javi 0,576, exit 0) · cara de la portada a 89,8/255 de luminancia y la del cierre a 85,6\n  (mínimo 70) · las 6 slides caben en el 1:1 que recorta la cuadrícula de IG · las dos capturas\n  son pantallazos Playwright de los HTML reales y TODO lo que se ve en ellas (45, 12, 4, 80, \"Ej:\n  Masajeador\", el 60%, el rango 25-80€) son atributos `placeholder=` del propio HTML: cero dato\n  tecleado, cero dato inventado.","archivos": [{"archivo": "s01_portada.mp4","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__00.jpg","peso_mb": 4.04,"video": "media/CARRUSEL_JORDI_FILTRO_2AGO__00.mp4"},{"archivo": "s02_texto.mp4","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__01.jpg","peso_mb": 0.33,"video": "media/CARRUSEL_JORDI_FILTRO_2AGO__01.mp4"},{"archivo": "s02_texto.png","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__02.jpg"},{"archivo": "s03_texto.mp4","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__03.jpg","peso_mb": 0.42,"video": "media/CARRUSEL_JORDI_FILTRO_2AGO__03.mp4"},{"archivo": "s03_texto.png","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__04.jpg"},{"archivo": "s04_pruebas.mp4","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__05.jpg","peso_mb": 0.25,"video": "media/CARRUSEL_JORDI_FILTRO_2AGO__05.mp4"},{"archivo": "s04_pruebas.png","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__06.jpg"},{"archivo": "s05_pruebas.mp4","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__07.jpg","peso_mb": 0.24,"video": "media/CARRUSEL_JORDI_FILTRO_2AGO__07.mp4"},{"archivo": "s05_pruebas.png","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__08.jpg"},{"archivo": "s06_testimonio.mp4","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__09.jpg","peso_mb": 0.21,"video": "media/CARRUSEL_JORDI_FILTRO_2AGO__09.mp4"},{"archivo": "s06_testimonio.png","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__10.jpg"},{"archivo": "s07_cierre.mp4","poster": "media/CARRUSEL_JORDI_FILTRO_2AGO_ .jpg","peso_mb": 15.04}],"origen": "PARA_REVISAR/REEL_JORDI_CEREBRO_CORAZON_2AGO"},{"id": "REEL_JORDI_META300_1AGO","cuenta": "JORDI","tipo": "reel","dia": "","hora": "","etiqueta": "BOFU","caption": "Mi objetivo nunca fue el coche.\n\nTenía un trabajo normal y solo quería un extra a final de mes. Esa era toda la ambición: una meta pequeña, de trescientos euros.\n\nY la cumplí. Y al cumplirla vi que había otra un poco más arriba que también podía cumplir. Así diez años.\n\nLa gente se pone metas enormes porque cree que las grandes son las que motivan. Es al revés: la meta enorme te frustra el primer mes y lo dejas. La pequeña la cumples, y cumplirla es lo que te enseña que puedes con la siguiente.\n\nEse es el proceso. No hay más.\n\n#emprendimiento #ecommerce #mentalidad","archivos": [{"archivo": "REEL_JORDI_META300.mp4","poster": "media/REEL_JORDI_META300_1AGO__00.jpg","peso_mb": 9.12}],"origen": "PARA_REVISAR/REEL_JORDI_META300_1AGO"},{"id": "REEL_JORDI_NO_CAMBIO_NADA","cuenta": "JORDI","tipo": "reel","dia": "","hora": "","etiqueta": "TOFU","caption": "Me preguntaron qué me ha cambiado la vida esto. Y la respuesta decepciona: nada.\n\nMe levanto a la misma hora, llevo a mi hijo al colegio y trabajo las mismas horas. Antes esas horas las pasaba en el coche viajando y vendiendo. Ahora las paso en la oficina.\n\nEso es literalmente lo único que ha cambiado.\n\nSi esperas que el negocio te cambie la rutina, vas a esperar sentado. Lo que cambia es a quién le rindes cuentas.\n\n#ecommerce #mentalidad","archivos": [{"archivo": "REEL_JORDI_NO_CAMBIO_NADA.mp4","poster": "media/REEL_JORDI_NO_CAMBIO_NADA__00.jpg","peso_mb": 12.52}],"origen": "PARA_REVISAR/REEL_JORDI_NO_CAMBIO_NADA"},{"id": "REEL_JORDI_OBJETIVOS_13AGO","cuenta": "JORDI","tipo": "reel","dia": "","hora": "","etiqueta": "BOFU","caption": "Una persona sin objetivos es una persona muerta.\n\nEl día que se te acaban los objetivos, dejas de tener éxito. Si quieres el coche, cúrratelo. Si quieres viajar, trabaja par }).catch(()=>{});
