<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La mesa · Mentorium</title>
<style>
/* LA MESA 2.0 — 23-ago-2026. Tres pestañas: POR VOTAR (la cola de tu dedo) · SEMANA (la
   parrilla real, hueco = hueco dicho) · VOTADO (tu historial). Cero siglas internas.
   El tipo de pieza sale de los FICHEROS, los vídeos SE VEN, y el voto viaja entre móvil
   y PC (se lee tu blob al abrir). La cocina interna vive en cocina.html y no se enseña. */
:root{
  --negro:#0B0B0D;--panel:#151518;--panel2:#1B1B1F;--linea:#2A2A30;
  --crema:#F4F1EA;--gris:#A19C93;--gris2:#6B675F;
  --oro:#D4A017;--oro2:#E8B83A;--ok:#3E9B5F;--no:#C24B42;--duda:#C9A227;
  --r:16px;--sombra:0 10px 30px #0007;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--negro);color:var(--crema);
  font:15px/1.55 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{width:min(1100px,100%);margin:0 auto;padding:0 14px}

/* ---------- cabecera ---------- */
header{position:sticky;top:0;z-index:40;background:#0B0B0Df2;backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linea)}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.logo{font-weight:800;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.logo b{color:var(--oro)}
.fecha{color:var(--gris);font-size:12px;margin-left:auto;text-align:right;line-height:1.3}
.quien{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.quien::-webkit-scrollbar{display:none}
.quien button{background:transparent;border:1px solid var(--linea);color:var(--gris);
  padding:6px 14px;border-radius:999px;font:700 12.5px Montserrat,sans-serif;cursor:pointer;
  white-space:nowrap;transition:.15s}
.quien button.on{border-color:var(--oro);color:var(--oro);background:#D4A0171a}
.tabs{display:flex;gap:6px;padding-bottom:10px}
.tabs button{flex:1;background:var(--panel);border:1px solid var(--linea);color:var(--gris);
  padding:10px 0;border-radius:12px;font:800 13px Montserrat,sans-serif;cursor:pointer;
  transition:.15s;position:relative}
.tabs button.on{background:var(--oro);border-color:var(--oro);color:#141414}
.tabs .n{position:absolute;top:-7px;right:-4px;background:var(--no);color:#fff;
  font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;border:2px solid var(--negro)}

/* ---------- secciones ---------- */
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris);
  font-weight:800;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 span{color:var(--crema)}
h2 small{font-weight:600;letter-spacing:0;text-transform:none;color:var(--gris2);font-size:12px}
.cuenta-tag{display:inline-block;font-weight:800;font-size:11.5px;letter-spacing:.1em;
  color:var(--oro);margin:18px 0 10px}

/* ---------- tarjeta de pieza ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1060px){.grid{grid-template-columns:1fr 1fr 1fr}}
.pieza{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sombra)}
.mediabox{position:relative;background:#000;aspect-ratio:4/5;overflow:hidden}
.mediabox video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{width:100%;height:100%;object-fit:contain;flex:0 0 100%;scroll-snap-align:center;background:#000}
.contador{position:absolute;top:10px;right:10px;background:#000a;color:#fff;font-size:11.5px;
  font-weight:700;padding:4px 10px;border-radius:999px;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.chip{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;border:1px solid var(--linea);color:var(--gris)}
.chip.slot{border-color:#3A5A9B55;color:#7FA3E8}
.chip.falta{border-color:var(--duda);color:var(--duda)}
.cap{padding:10px 14px 0;color:#D8D4CB;font-size:13.5px;white-space:pre-wrap;
  max-height:5.8em;overflow:hidden;position:relative;transition:max-height .2s}
.cap.abierta{max-height:60em}
.cap:not(.abierta):after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;
  background:linear-gradient(#1515180f,var(--panel))}
.cap-fila{display:flex;gap:8px;padding:8px 14px 0}
.mini{background:transparent;border:1px solid var(--linea);color:var(--gris);border-radius:9px;
  padding:7px 12px;font:700 12px Montserrat,sans-serif;cursor:pointer}
.mini:active{transform:scale(.97)}
.votobar{display:flex;gap:8px;padding:12px 14px 14px}
.votobar button{flex:1;padding:12px 0;border-radius:11px;border:1px solid var(--linea);
  background:var(--panel2);color:var(--crema);font:800 13.5px Montserrat,sans-serif;cursor:pointer;
  transition:.12s}
.votobar .b-ok.on{background:var(--ok);border-color:var(--ok)}
.votobar .b-duda.on{background:var(--duda);border-color:var(--duda);color:#141414}
.votobar .b-no.on{background:var(--no);border-color:var(--no)}
.notazona{display:none;padding:0 14px 14px;flex-direction:column;gap:8px}
.notazona.on{display:flex}
textarea{background:#0F0F12;border:1px solid var(--linea);border-radius:10px;color:var(--crema);
  padding:11px;font:14px Montserrat,sans-serif;min-height:70px;resize:vertical;width:100%}
.enviar{padding:12px 0;border-radius:11px;border:0;background:var(--oro);color:#141414;
  font:800 13.5px Montserrat,sans-serif;cursor:pointer;width:100%}
.estado-envio{font-size:12px;color:var(--gris);padding:0 14px 12px;min-height:14px}
.votado-sello{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;
  padding:5px 11px;border-radius:999px;color:#fff;letter-spacing:.06em}
.s-ok{background:var(--ok)} .s-no{background:var(--no)} .s-duda{background:var(--duda);color:#141414}

/* ---------- semana ---------- */
.dia-bloque{margin-bottom:8px}
.hueco{background:#C9A2270d;border:1px dashed #C9A22766;border-radius:12px;
  padding:12px 14px;margin-bottom:10px}
.hueco b{color:var(--duda);font-size:12px;letter-spacing:.08em}
.hueco p{color:var(--gris);font-size:12.5px;margin-top:3px}
.slotmini{display:flex;gap:12px;align-items:center;background:var(--panel);
  border:1px solid var(--linea);border-radius:12px;padding:9px;margin-bottom:10px;cursor:pointer}
.slotmini img{width:56px;height:70px;object-fit:cover;border-radius:8px;background:#000}
.slotmini .inf{flex:1;min-width:0}
.slotmini .l1{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gris);
  text-transform:uppercase}
.slotmini .l2{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.slotmini .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.vacio{color:var(--gris2);font-size:13.5px;padding:14px 0}
footer{padding:44px 0 70px;color:#514E48;font-size:12px;text-align:center}
footer a{color:#2c2c31;text-decoration:none}

/* ---------- clave ---------- */
.velo-clave{position:fixed;inset:0;background:var(--negro);z-index:99;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px}
.velo-clave input{background:#141417;border:1px solid var(--linea);border-radius:10px;
  color:var(--crema);padding:12px 16px;font:15px Montserrat,sans-serif;width:240px;text-align:center}
.velo-clave .logo{font-size:24px}
.velo-clave .enviar{width:240px}
</style>
</head>
<body>
<div class="velo-clave" id="vclave">
  <div class="logo"><b>M</b> MENTORIUM</div>
  <input id="clv" type="password" placeholder="Clave" autocomplete="off"
    onkeydown="if(event.key==='Enter')entra()">
  <button class="enviar" onclick="entra()">Entrar</button>
</div>

<header><div class="wrap">
  <div class="top">
    <div class="logo"><b>M</b> La mesa</div>
    <div class="fecha" id="fecha"></div>
  </div>
  <div class="quien" id="quien"></div>
  <div class="tabs">
    <button id="t-votar" class="on" onclick="tab('votar')">Por votar<span class="n" id="n-votar" style="display:none"></span></button>
    <button id="t-semana" onclick="tab('semana')">Semana</button>
    <button id="t-votado" onclick="tab('votado')">Votado</button>
  </div>
</div></header>

<main class="wrap" id="main"></main>
<footer class="wrap">Cada OK / NO / DUDA se guarda con tu nombre y le llega a Gerard como orden.
Nada se publica sin OK, pieza a pieza.<a href="cocina.html"> ·</a></footer>

<script>
/* ================= datos y estado ================= */
const BLOBS={
 "Gerard":"https://api.npoint.io/68aa90c4c40af52e94ac",
 "Javi":  "https://api.npoint.io/88c82cab5478b18404f1",
 "Jordi": "https://api.npoint.io/8d25623222020a3f41ec",
 "Santi": "https://api.npoint.io/6a1e5a7506cc4248da2b"};
const TIPO={reel:"Reel",carrusel:"Carrusel",meme:"Meme",story:"Historia"};
let DATOS=null;
let quien=localStorage.getItem("mesa_quien")||"Gerard";
let votos=JSON.parse(localStorage.getItem("mesa_votos_"+quien)||"{}");
let TAB="votar";
let temp={};   // {id:{v,txt}} elecciones sin enviar

function entra(){
  if(document.getElementById("clv").value.trim()==="mentorium2026"){
    localStorage.setItem("mesa_auth","1");
    document.getElementById("vclave").style.display="none";
  }
}
if(localStorage.getItem("mesa_auth")==="1"){
  document.addEventListener("DOMContentLoaded",()=>{
    document.getElementById("vclave").style.display="none";});
}

function fechaHoy(){
  const d=new Date();
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return dias[d.getDay()]+" "+d.getDate()+" "+meses[d.getMonth()];
}
function hook(c){const l=(c||"").trim().split("\n")[0];return l.slice(0,110)}
function esStory(p){return (p.tipo||"").toLowerCase()==="story"}

/* ================= personas ================= */
function chipQuien(){
  const q=document.getElementById("quien");q.innerHTML="";
  Object.keys(BLOBS).forEach(n=>{
    const b=document.createElement("button");b.textContent=n;
    if(n===quien)b.classList.add("on");
    b.onclick=async()=>{quien=n;localStorage.setItem("mesa_quien",n);
      votos=JSON.parse(localStorage.getItem("mesa_votos_"+quien)||"{}");
      chipQuien();await syncVotos();pinta();};
    q.appendChild(b);});
}

/* al abrir: fusionar los votos del blob de ESTA persona (movil <-> PC) */
async function syncVotos(){
  try{
    const blob=await (await fetch(BLOBS[quien]+"?t="+Date.now())).json();
    const remotos=(blob&&blob.mesa)||{};
    for(const id in remotos){
      const r=remotos[id],l=votos[id];
      if(!l||(r.cuando||"")>(l.cuando||""))votos[id]=r;
    }
    localStorage.setItem("mesa_votos_"+quien,JSON.stringify(votos));
  }catch(e){}
}

/* ================= pestañas ================= */
function tab(t){TAB=t;
  ["votar","semana","votado"].forEach(x=>
    document.getElementById("t-"+x).classList.toggle("on",x===t));
  pinta();
}
function cuentaPendientes(){
  if(!DATOS)return 0;
  return DATOS.piezas.filter(p=>!esStory(p)&&!votos[p.id]).length;
}

/* ================= tarjeta ================= */
function mediaHTML(p){
  const vids=p.archivos.filter(a=>a.video);
  const imgs=p.archivos.filter(a=>!a.video&&a.poster);
  if(vids.length){
    const v=vids[0];
    return `<div class="mediabox">
      <video src="${v.video}" poster="${v.poster||""}" controls playsinline preload="none"></video>
      ${voto(p)?sello(p):""}</div>`;
  }
  if(imgs.length>1){
    const id="s"+Math.random().toString(36).slice(2,8);
    return `<div class="mediabox">
      <div class="slides" id="${id}" onscroll="cont('${id}',${imgs.length})">
        ${imgs.map(a=>`<img loading="lazy" src="${a.poster}">`).join("")}
      </div>
      <div class="contador" id="${id}c">1/${imgs.length}</div>
      ${voto(p)?sello(p):""}</div>`;
  }
  const a=p.archivos[0]||{};
  return `<div class="mediabox"><img style="width:100%;height:100%;object-fit:contain"
    loading="lazy" src="${a.poster||""}">${voto(p)?sello(p):""}</div>`;
}
function cont(id,n){
  const el=document.getElementById(id);if(!el)return;
  const i=Math.round(el.scrollLeft/el.clientWidth)+1;
  const c=document.getElementById(id+"c");if(c)c.textContent=i+"/"+n;
}
function voto(p){return votos[p.id]}
function sello(p){
  const v=votos[p.id];
  const M={ok:"OK",duda:"DUDA",no:"NO"};
  return `<div class="votado-sello s-${v.v}">${M[v.v]||""} · ${v.quien||quien}</div>`;
}
function chips(p){
  let h=`<span class="chip">${TIPO[(p.tipo||"").toLowerCase()]||p.tipo||""}${p.slides?` · ${p.slides} slides`:""}</span>`;
  h+=`<span class="chip">${p.cuenta}</span>`;
  if(p.dia)h+=`<span class="chip slot">${p.dia.toUpperCase()} · ${p.hora||""}</span>`;
  if(p.sin_caption)h+=`<span class="chip falta">falta caption</span>`;
  return `<div class="chips">${h}</div>`;
}
function tarjeta(p){
  const d=document.createElement("div");d.className="pieza";d.id="pz-"+p.id;
  const v=votos[p.id]||temp[p.id]||{};
  d.innerHTML=`${mediaHTML(p)}
    ${chips(p)}
    <div class="cap" onclick="this.classList.toggle('abierta')">${(p.caption||"— sin caption todavía —")}</div>
    <div class="cap-fila">
      <button class="mini" onclick="copia('${p.id}',this)">Copiar caption</button>
    </div>
    <div class="votobar">
      <button class="b-ok${v.v==="ok"?" on":""}" onclick="elige('${p.id}','ok',this)">OK</button>
      <button class="b-duda${v.v==="duda"?" on":""}" onclick="elige('${p.id}','duda',this)">DUDA</button>
      <button class="b-no${v.v==="no"?" on":""}" onclick="elige('${p.id}','no',this)">NO</button>
    </div>
    <div class="notazona${v.v&&v.v!=="ok"?" on":""}" id="nz-${p.id}">
      <textarea id="tx-${p.id}" placeholder="Qué cambiarías (me llega como orden)">${v.txt||""}</textarea>
    </div>
    <div style="padding:0 14px 14px"><button class="enviar" onclick="envia('${p.id}')">Enviar como ${quien}</button></div>
    <div class="estado-envio" id="ev-${p.id}"></div>`;
  return d;
}
function copia(id,btn){
  const p=DATOS.piezas.find(x=>x.id===id);
  navigator.clipboard.writeText(p.caption||"").then(()=>{
    btn.textContent="Copiado ✓";setTimeout(()=>btn.textContent="Copiar caption",1600);
  }).catch(()=>{btn.textContent="No se pudo";});
}
function elige(id,v,btn){
  temp[id]=temp[id]||{};temp[id].v=v;
  const card=btn.closest(".pieza");
  card.querySelectorAll(".votobar button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  document.getElementById("nz-"+id).classList.toggle("on",v!=="ok");
}
async function envia(id){
  const el=document.getElementById("ev-"+id);
  const v=(temp[id]&&temp[id].v)||(votos[id]&&votos[id].v);
  if(!v){el.textContent="Elige OK, DUDA o NO.";return}
  const txt=(document.getElementById("tx-"+id)||{}).value||"";
  votos[id]={v,txt:txt.trim(),quien,cuando:new Date().toISOString().slice(0,16)};
  localStorage.setItem("mesa_votos_"+quien,JSON.stringify(votos));
  el.textContent="Guardado aquí. Subiendo…";
  try{
    const url=BLOBS[quien];
    let blob={};try{blob=await (await fetch(url)).json()||{}}catch(e){}
    blob.mesa=blob.mesa||{};blob.mesa[id]=votos[id];
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(blob)});
    el.textContent=r.ok?"Enviado ✓ — le llega a Gerard como orden.":"Guardado en este móvil; se subirá al reabrir.";
  }catch(e){el.textContent="Guardado en este móvil; sin red ahora."}
  document.getElementById("n-votar").textContent=cuentaPendientes();
  if(TAB==="votar"){
    const card=document.getElementById("pz-"+id);
    if(card){card.style.transition="opacity .5s";card.style.opacity=".35";
      setTimeout(()=>pinta(),900);}
  }else pinta();
}

/* ================= vistas ================= */
function seccion(m,titulo,extra){
  const h=document.createElement("h2");
  h.innerHTML=titulo+(extra?` <small>${extra}</small>`:"");
  m.appendChild(h);
}
function vistaVotar(m){
  const cola=DATOS.piezas.filter(p=>!esStory(p)&&!votos[p.id]);
  const asignadas=cola.filter(p=>p.dia), resto=cola.filter(p=>!p.dia);
  document.getElementById("n-votar").style.display=cola.length?"":"none";
  document.getElementById("n-votar").textContent=cola.length;
  if(!cola.length){
    m.innerHTML+='<div class="vacio" style="padding:44px 0;text-align:center">Todo votado. 🫡<br><br>Mira la pestaña SEMANA para ver la parrilla.</div>';
    return;
  }
  seccion(m,`Por votar · <span>${cola.length}</span>`,"lo de la semana primero");
  ["JAVI","JORDI"].forEach(c=>{
    const ps=[...asignadas.filter(p=>p.cuenta===c),...resto.filter(p=>p.cuenta===c)];
    if(!ps.length)return;
    const t=document.createElement("div");t.className="cuenta-tag";t.textContent=c;m.appendChild(t);
    const g=document.createElement("div");g.className="grid";
    ps.forEach(p=>g.appendChild(tarjeta(p)));
    m.appendChild(g);
  });
}
function vistaSemana(m){
  seccion(m,`Semana del <span>${DATOS.semana||""}</span>`,"hueco = hueco; aquí no se esconde nada");
  (DATOS.dias||[]).forEach(dia=>{
    const ps=DATOS.piezas.filter(p=>p.dia===dia&&!esStory(p));
    const hs=(DATOS.huecos||[]).filter(h=>h.dia===dia);
    if(!ps.length&&!hs.length)return;
    const bl=document.createElement("div");bl.className="dia-bloque";
    const h=document.createElement("h2");h.innerHTML=`<span>${dia.toUpperCase()}</span>`;bl.appendChild(h);
    ["JAVI","JORDI"].forEach(c=>{
      const mias=ps.filter(p=>p.cuenta===c).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
      const misH=hs.filter(x=>x.cuenta===c);
      if(!mias.length&&!misH.length)return;
      const t=document.createElement("div");t.className="cuenta-tag";t.textContent=c;bl.appendChild(t);
      mias.forEach(p=>{
        const v=votos[p.id];
        const s=document.createElement("div");s.className="slotmini";
        s.innerHTML=`<img loading="lazy" src="${(p.archivos[0]||{}).poster||""}">
          <div class="inf"><div class="l1">${p.hora||""} · ${TIPO[(p.tipo||"").toLowerCase()]||p.tipo}${p.slides?` · ${p.slides}sl`:""}</div>
          <div class="l2">${hook(p.caption)||"— sin caption —"}</div></div>
          <div class="dot" style="background:${v?({ok:"var(--ok)",no:"var(--no)",duda:"var(--duda)"})[v.v]:"#3a3a40"}"></div>`;
        s.onclick=()=>{TAB="votar";abreEnVotar(p.id)};
        bl.appendChild(s);
      });
      misH.forEach(x=>{
        const hv=document.createElement("div");hv.className="hueco";
        hv.innerHTML=`<b>${x.hora||""} · FALTA — ${x.formato}</b><p>${x.motivo||""}</p>`;
        bl.appendChild(hv);
      });
    });
    m.appendChild(bl);
  });
}
function abreEnVotar(id){
  ["votar","semana","votado"].forEach(x=>
    document.getElementById("t-"+x).classList.toggle("on",x==="votar"));
  TAB="votar";
  const m=document.getElementById("main");m.innerHTML="";
  const p=DATOS.piezas.find(x=>x.id===id);
  if(p){seccion(m,`Pieza de <span>${p.cuenta}</span>`,'<a style="color:var(--gris);cursor:pointer" onclick="tab(\'semana\')">← volver a la semana</a>');
    const g=document.createElement("div");g.className="grid";g.appendChild(tarjeta(p));m.appendChild(g);}
}
function vistaVotado(m){
  const ids=Object.keys(votos);
  if(!ids.length){m.innerHTML+='<div class="vacio">Aún no has votado nada con este nombre.</div>';return}
  seccion(m,`Votado por <span>${quien}</span>`,`${ids.length} piezas`);
  const lista=ids.map(id=>({id,...votos[id],p:DATOS.piezas.find(x=>x.id===id)}))
    .sort((a,b)=>(b.cuando||"").localeCompare(a.cuando||""));
  lista.forEach(x=>{
    const s=document.createElement("div");s.className="slotmini";
    const M={ok:"var(--ok)",no:"var(--no)",duda:"var(--duda)"};
    s.innerHTML=`<img loading="lazy" src="${x.p?(x.p.archivos[0]||{}).poster||"":""}">
      <div class="inf"><div class="l1">${(x.v||"").toUpperCase()} · ${x.cuando||""}</div>
      <div class="l2">${x.p?hook(x.p.caption)||x.id:x.id}</div>
      ${x.txt?`<div style="font-size:12px;color:var(--duda);margin-top:2px">✎ ${x.txt.slice(0,90)}</div>`:""}</div>
      <div class="dot" style="background:${M[x.v]||"#3a3a40"}"></div>`;
    if(x.p)s.onclick=()=>abreEnVotar(x.id);
    lista&&m.appendChild(s);
  });
}
function pinta(){
  const m=document.getElementById("main");m.innerHTML="";
  document.getElementById("fecha").textContent=fechaHoy();
  if(!DATOS){m.innerHTML='<div class="vacio">Cargando…</div>';return}
  if(TAB==="votar")vistaVotar(m);
  else if(TAB==="semana")vistaSemana(m);
  else vistaVotado(m);
}

/* ================= arranque ================= */
(async()=>{
  chipQuien();
  document.getElementById("fecha").textContent=fechaHoy();
  try{DATOS=await (await fetch("piezas.json?t="+Date.now())).json()}catch(e){}
  await syncVotos();
  pinta();
})();
</script>
