<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mentorium · Contenido de hoy</title>
<style>
/* Rehecho el 6-ago. Lo que Gerard pedia: verlo TODO de una tirada, sin pantalla completa, y
   que el video NO salga recortado. Por eso la rejilla muestra las 6 piezas a la vez y cada
   video va en un marco 9:16 con object-fit:contain (nunca cover: cover es lo que recortaba). */
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0c0f;--card:#14161c;--line:#242833;--tx:#eef0f5;--mut:#9aa2b4;
      --javi:#3ECF8E;--jordi:#5B9DFF;--am:#FFE400;--ok:#2fbf71;--no:#e0504f;--duda:#e8a33d}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
     padding:18px;max-width:1180px;margin:0 auto}
h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:13.5px;margin-top:4px}
.est{background:#12141a;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
     margin:14px 0 18px;font-size:13px;color:var(--mut)}
.est b{color:var(--am)}
#login{position:fixed;inset:0;background:#07080b;display:flex;align-items:center;
       justify-content:center;flex-direction:column;gap:16px;z-index:99}
#login h2{font-size:19px}
.quien{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.quien button{padding:14px 26px;border:0;border-radius:12px;background:#1d2027;color:var(--tx);
              font-weight:800;font-size:15px;cursor:pointer}
.quien button:hover{background:var(--javi);color:#04150d}
.yo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin-bottom:10px}
.yo button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;
           color:var(--mut);cursor:pointer;font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.colh{font-weight:800;font-size:15px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
.colh.JAVI{background:var(--javi);color:#04150d}
.colh.JORDI{background:var(--jordi);color:#03142c}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
      margin-bottom:14px}
.meta{padding:11px 13px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 8px;
      border-radius:99px;margin-right:5px}
.pill.TOFU{background:#3a2a12;color:#ffb84d}
.pill.MOFU{background:#12303a;color:#5fd3f0}
.pill.BOFU{background:#2c1436;color:#d98cff}
.pill.fmt{background:#1c1f27;color:var(--mut)}
.tit{font-weight:700;font-size:14.5px;margin:7px 0 5px}
.fu{font-size:11.5px;color:var(--mut);line-height:1.45}
.fu b{color:#c3cad8}
/* el marco del video: 9:16 y CONTAIN, jamas cover */
.vwrap{position:relative;width:100%;aspect-ratio:9/16;background:#000}
.vwrap video{width:100%;height:100%;object-fit:contain;display:block}
.dur{position:absolute;bottom:8px;right:8px;background:#000b;color:#fff;font-size:11px;
     font-weight:700;padding:2px 7px;border-radius:6px;pointer-events:none}
.votos{display:flex;gap:6px;padding:0 13px 13px}
.votos button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;
              background:#1a1d24;color:var(--tx);font-weight:800;font-size:12.5px;cursor:pointer}
.votos button.on.ok{background:var(--ok);color:#04150d;border-color:var(--ok)}
.votos button.on.no{background:var(--no);color:#fff;border-color:var(--no)}
.votos button.on.duda{background:var(--duda);color:#231402;border-color:var(--duda)}
.coment{margin:0 13px 13px;width:calc(100% - 26px);background:#0e1015;
        border:1px solid var(--line);border-radius:9px;color:var(--tx);padding:9px;
        font:13px system-ui;resize:vertical;min-height:38px}
.quien_voto{padding:0 13px 11px;font-size:11.5px;color:var(--mut)}
.quien_voto span{display:inline-block;margin-right:8px}
#estado{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1d2027;
        border:1px solid var(--line);padding:9px 16px;border-radius:11px;font-size:12.5px;
        color:var(--mut);z-index:50}
.pend{background:#1a1206;border:1px solid #3a2a12;border-radius:12px;padding:12px 14px;
      margin-top:18px;font-size:13px;color:#ffcf85}
.pend b{color:var(--am)}
</style>
</head>
<body>

<div id="login">
  <h2>¿Quién eres?</h2>
  <div class="quien" id="quienes"></div>
  <div class="sub">Se guarda en este navegador. Puedes cambiarlo cuando quieras.</div>
</div>

<div class="yo" id="barra" style="display:none">
  <span>Estás como <b id="nyo"></b></span>
  <button onclick="salir()">Cambiar de persona</button>
</div>

<h1>Contenido de hoy</h1>
<div class="sub" id="fecha"></div>
<div class="est" id="est"></div>
<div class="cols" id="cols"></div>
<div class="pend" id="pend"></div>
<div id="estado">cargando…</div>

<script>
const BLOB="https://jsonblob.com/api/jsonBlob/019fc97b-6f60-7c6b-8983-0a922843051e";
const PERSONAS=["Gerard","Javi","Jordi","Santi"];
let DATOS=null, VOTOS={}, YO=localStorage.getItem("yo")||"";

function est(t){document.getElementById("estado").textContent=t;}
function salir(){localStorage.removeItem("yo");location.reload();}
function entrar(p){localStorage.setItem("yo",p);location.reload();}

document.getElementById("quienes").innerHTML=PERSONAS.map(p=>
  `<button onclick="entrar('${p}')">${p}</button>`).join("");

if(YO&&PERSONAS.includes(YO)){
  document.getElementById("login").style.display="none";
  document.getElementById("barra").style.display="flex";
  document.getElementById("nyo").textContent=YO;
}

async function cargar(){
  DATOS=await (await fetch("piezas.json?v="+Date.now())).json();
  document.getElementById("fecha").textContent=DATOS.dia+" · "+DATOS.piezas.length+" piezas";
  document.getElementById("est").innerHTML="<b>Estrategia:</b> "+DATOS.estrategia;
  document.getElementById("pend").innerHTML="<b>Pendiente de hoy:</b><br>· "+
    (DATOS.pendiente_hoy||[]).join("<br>· ");
  try{
    const r=await fetch(BLOB+"?v="+Date.now());
    if(r.ok){const j=await r.json(); VOTOS=(j&&j.votos)||{};}
  }catch(e){}
  pintar(); est("listo");
}

function pintar(){
  const c=document.getElementById("cols"); c.innerHTML="";
  ["JAVI","JORDI"].forEach(cta=>{
    const col=document.createElement("div");
    col.innerHTML=`<div class="colh ${cta}">${cta} · 3 posts</div>`;
    DATOS.piezas.filter(p=>p.cuenta===cta).sort((a,b)=>a.post-b.post).forEach(p=>{
      const v=(VOTOS[p.id]||{});
      const mio=(v[YO]||{}).voto||"";
      const otros=Object.keys(v).filter(k=>k!==YO)
        .map(k=>`<span>${k}: <b>${v[k].voto}</b>${v[k].nota?" ✎":""}</span>`).join("");
      const d=document.createElement("div"); d.className="card";
      d.innerHTML=`
        <div class="vwrap">
          <video src="media/${p.id}.mp4" poster="media/${p.id}.jpg" controls preload="metadata"
                 playsinline loop></video>
          <div class="dur">${p.dur}s</div>
        </div>
        <div class="meta">
          <span class="pill ${p.bucket}">${p.bucket}</span><span class="pill fmt">post ${p.post} · ${p.formato}</span>
          <div class="tit">${p.titular}</div>
          <div class="fu"><b>De dónde sale:</b> ${p.fuente}<br><b>Nota:</b> ${p.nota}</div>
        </div>
        <div class="votos">
          <button class="ok ${mio==="Aprobado"?"on":""}"   onclick="votar('${p.id}','Aprobado')">Aprobado</button>
          <button class="no ${mio==="Denegado"?"on":""}"   onclick="votar('${p.id}','Denegado')">Denegado</button>
          <button class="duda ${mio==="Duda"?"on":""}"     onclick="votar('${p.id}','Duda')">Duda</button>
        </div>
        <textarea class="coment" id="c_${p.id}" placeholder="Qué cambiarías (se guarda con tu voto)">${(v[YO]||{}).nota||""}</textarea>
        <div class="quien_voto">${otros||"nadie más ha votado todavía"}</div>`;
      col.appendChild(d);
    });
    c.appendChild(col);
  });
}

async function votar(id,voto){
  if(!YO){alert("Dime quién eres primero");return;}
  est("guardando…");
  const nota=(document.getElementById("c_"+id)||{}).value||"";
  // merge: se relee lo que haya y solo se escribe MI rama, para no pisar el voto de otro
  let actual={votos:{}};
  try{const r=await fetch(BLOB+"?v="+Date.now()); if(r.ok) actual=await r.json();}catch(e){}
  actual.votos=actual.votos||{};
  actual.votos[id]=actual.votos[id]||{};
  actual.votos[id][YO]={voto:voto,nota:nota,cuando:new Date().toISOString().slice(0,16)};
  try{
    await fetch(BLOB,{method:"PUT",headers:{"Content-Type":"application/json"},
                      body:JSON.stringify(actual)});
    VOTOS=actual.votos; pintar(); est("guardado · "+voto);
  }catch(e){est("no se pudo guardar, reintenta");}
}
cargar();
</script>
</body>
</html>
