N elemento visual). Elegida porque el falso culpable aqui es literal y comprobable: el novato cree que le falta la herramienta de IA buena, y lo que le falta es criterio para descartar. F7 permite matar ese culpable en una frase sin explicar el como (gate S2 de Santi).", "escena": {"donde": "Su despacho en casa, de dia, luz natural lateral de ventana. Fondo limpio (pared y estanteria), cero pantallas encendidas detras.", "plano": "Plano medio corto (de pecho para arriba), camara a la altura de los ojos, sentado. Camara fija en tripode, cero movimiento.", "que_se_ve": "Jordi sentado, camisa o sudadera clara, hablando a camara pausado. En el frame 0 sostiene el folio a la altura del pecho, bien iluminado y enfocado, para que se lea en mute. A partir del bloque PROBLEMA baja el folio y lo deja sobre la mesa a la vista.", "atrezzo": "UN folio impreso con una lista de productos escrita por la IA, con casi todas las lineas tachadas a boligrafo rojo. Es el elemento visual del hook y tiene que verse el rojo desde el primer fotograma."}, "bloques": [{"bloque": "ATENCION", "texto": "Esta hoja la ha escrito una inteligencia artificial. Son los productos ganadores que me dio. Estan todos tachados.", "segundos": 7, "nota_direccion": "Hook LEIDO + sostenido (ventana 6,0-7,5 s de Jordi). Levanta el folio ANTES de decir la primera palabra: el frame 0 ya tiene estimulo visual, nunca cara muda esperando. Tono seco y bajo, sin sonreir. Pausa de un segundo entero despues de 'tachados' antes de bajar el folio. Rotulo del hook en pantalla solo durante este bloque; despues NO queda rotulo fijo arriba (manda el subtitulo)."}, {"bloque": "PROBLEMA", "texto": "Y se perfectamente lo que estas haciendo, porque lo hace todo el que empieza. Abres la inteligencia artificial y le pides productos ganadores. Te da una lista. La miras, no te acaba de convencer, y le pides otra. Y otra. Y llevas tres semanas con el movil lleno de listas y la tienda vacia. No has vendido nada, pero te sientes ocupado. Y eso es lo peor de todo: parece trabajo y no lo es. Le estas pidiendo a una maquina que tome la unica decision que no puede tomar, porque no sabe lo que ya has intentado, ni el dinero que tienes, ni a quien le vas a vender.", "segundos": 20, "nota_direccion": "Bajar al barro: aqui se describe SU semana, no un concepto. Ritmo pausado, frases cortas, mirada fija. La frase 'parece trabajo y no lo es' se dice mas lenta y bajando el volumen, es el golpe del bloque. Insertos de apoyo (la voz sigue, cortes cortos): pantalla del movil con listas de productos, el folio sobre la mesa, boli tachando."}, {"bloque": "SOLUCION", "texto": "Y el cambio no es encontrar una herramienta mejor. Es cambiar para que la usas. La inteligencia artificial no esta para decirte que vender. Esta para quitarte de encima rapido lo que no vale. Deja de pedirle ideas y empieza a pedirle que destroce la tuya. Que te diga por que ese producto no se va a vender, quien lo esta vendiendo ya mas barato, y que te pasa el dia que empiecen a devolvertelo. Si el producto aguanta eso, ya no necesitas ninguna lista. Y si no aguanta, acabas de ahorrarte un mes. Elegir es descartar. Lo otro es coleccionar ideas.", "segundos": 20, "nota_direccion": "PARADIGMA, no paso a paso (gate S2: que hacer, no como). No se dice el prompt exacto ni se ensena la pantalla escribiendolo: eso es el producto. 'Elegir es descartar' se dice despues de una pausa, mirando fijo, y es la frase que se resalta sola en el subtitulo."}, {"bloque": "PRUEBA SOCIAL", "texto": "Es lo mismo que hizo Nil. Llego sin haber vendido nada en su vida. Dejo que le tumbaran las primeras ideas sin defenderlas, y con la que aguanto lleva mas de doscientos mil euros facturados.", "segundos": 10, "nota_direccion": "UNA sola cifra en toda la pieza y va DENTRO de la imagen: se inserta la captura o la placa de Nil con la cifra visible (caso validado: caso_Nil_200K_2meses_Jordi.md). Cifra jamas escrita en el caption. NO se dice en cuanto tiempo la hizo. Si la captura no esta disponible el dia de grabacion, se corta la cifra y se dice solo 'lleva su primera tienda funcionando' hasta tener la imagen."}, {"bloque": "CTA", "texto": "Te he dejado hecho el validador de producto: metes tu producto y te marca por donde se cae antes de que te gastes un euro en el. Es la misma criba que acabas de ver, en una pagina. Comenta la palabra FILTRO y lo dejo fijado en los comentarios y en mi perfil.", "segundos": 10, "nota_direccion": "CTA de 3 partes (entregable concreto + conexion directa con el problema del guion + la prueba social ya dada). CANDADO: NO se promete mandar nada por privado; se pide comentario, el recurso se nombra y vive en la bio. Recurso REAL en disco: 06_HERRAMIENTAS_HTML/validador-producto.html. Se dice mirando a camara, sin subir el tono, y se corta seco al terminar la frase."}], "musica": "Dos pistas, las dos por debajo de la voz (regla 12 de Jordi). Hook: pista viral de USA/Espana con entrada seca, 90 BPM o mas, solo durante los 7 s del hook. Cuerpo: colchon instrumental sobrio, plano, sin melodia protagonista, entrando en la frontera del hook. Prohibida la lenta o de cementerio. Nada de orquesta.", "duracion_s": 67, "texto_en_pantalla": "LOS PRODUCTOS GANADORES QUE ME DIO LA IA. TODOS TACHADOS.", "caption": "La herramienta no es el problema. Le estas pidiendo que decida por ti y no sabe nada de tu situacion. Usala para tumbar tu idea, no para darte ideas nuevas. Si aguanta, es tu producto. Comenta FILTRO y te dejo el validador fijado en comentarios y en el perfil."}, {"id": "JOR-MOFU-02", "cuenta": "JORDI", "etapa": "MOFU", "titulo": "Montar la tienda nunca fue lo dificil", "formula": "F13 · NOTICIA / DESCUBRIMIENTO (banco 16-ago), girada: se abre con el descubrimiento que todos celebran (la IA te monta la tienda en una tarde) y se convierte en el problema. Es la fórmula del banco para el tema IA y encaja con el tema fuerte medido de Jordi (IA + ecom).", "escena": {"donde": "En la calle, junto a su coche parado y con el motor apagado, a ultima hora de la tarde (luz calida y baja). Sitio real suyo, cero estudio.", "plano": "Plano medio, camara ligeramente por debajo de los ojos, apoyado en el lateral del coche. Camara fija; nada de conducir hablando.", "que_se_ve": "Jordi de pie, apoyado, con el movil en la mano. En el frame 0 gira la pantalla del movil hacia camara y se ve una tienda online entera, montada y bonita. Despues baja el movil y habla. Lifestyle si, cifras suyas NO, cero pantallazos de facturacion propia.", "atrezzo": "El movil con una tienda online completa abierta en pantalla (tienda de demostracion, nunca la de un alumno ni una tienda real de cliente). Es el elemento visual del hook."}, "bloques": [{"bloque": "ATENCION", "texto": "Hoy montas una tienda entera con inteligencia artificial en una tarde. Y ese es justo el problema.", "segundos": 7, "nota_direccion": "Hook LEIDO (6,0-7,5 s). La pantalla del movil entra a camara ANTES de la primera palabra. Tono tranquilo pero con la ceja levantada en 'y ese es justo el problema': el giro se nota en la cara, no en el volumen. Pausa de un segundo antes de bajar el movil. Rotulo del hook solo aqui; despues sin rotulo fijo arriba."}, {"bloque": "PROBLEMA", "texto": "Porque montarla nunca fue lo dificil. Tu ya la tienes hecha: tus fotos, tus textos, tus colores, todo. Entra gente y no compra nadie. Entonces cambias el color del boton. Cambias la foto de portada. Le pides a la maquina otra version del texto. Y sigue sin comprar nadie. Y lo que esta pasando ahi no se ve en la pantalla: el que entra no se fia de ti. No sabe quien hay detras, no sabe que le pasa si el paquete no llega, no sabe si manana sigues existiendo. Y esa confianza una maquina no te la puede inventar, porque tu no se la has dado.", "segundos": 20, "nota_direccion": "Aqui se baja al barro con SUS gestos: el color del boton, la foto de portada. Ritmo lento, una idea por frase. Insertos cortos con la voz encima: dedo cambiando el color de un boton, ficha de producto sin resenas, pagina de contacto vacia. Nada de graficas ni paneles."}, {"bloque": "SOLUCION", "texto": "Asi que deja de pedirle a la inteligencia artificial que te haga mas cosas y empieza a pedirle que te mire la tienda con los ojos del que va a pagar. Cambia la pregunta. No es hazme una tienda bonita. Es dime por que no me fiaria de esta tienda si el dinero lo pusiera yo. La maquina es rapidisima ejecutando y es malisima decidiendo. Y lo que no puedes delegar nunca es a quien le vendes y por que te tiene que creer. Eso lo decides tu. Y una vez decidido, entonces si, que te lo monte ella en una tarde.", "segundos": 20, "nota_direccion": "PARADIGMA, cero tutorial: se dice el cambio de pregunta, no se ensena la respuesta ni se lee la pantalla del chat. 'Rapidisima ejecutando, malisima decidiendo' es la frase-tesis: pausa antes y despues, y es la unica que lleva tratamiento fuerte en el subtitulo."}, {"bloque": "PRUEBA SOCIAL", "texto": "Alejandro trabajaba en una nave industrial cuando empezo con nosotros. No cambio de herramienta ni de producto. Cambio el orden: primero decidio a quien le vendia. Hoy tiene colgada una placa de mas de un millon de euros.", "segundos": 11, "nota_direccion": "Caso validado: caso_Alejandro_1M_ultimo_ano_Jordi.md (placa 1M entregada por Jordi, entrevista directa). UNA sola cifra de la pieza y va DENTRO de la imagen: inserto del video o la foto real de la entrega de placa con la cifra visible. Nunca en el caption. NO se dice en cuanto tiempo lo hizo. La frase 'cambio el orden' es lo unico que se afirma del metodo: no se le atribuye ninguna accion que no este en su entrevista."}, {"bloque": "CTA", "texto": "Tengo hecho el auditor de confianza de tienda: le pasas tu tienda y te marca lo que hace que alguien se vaya sin comprar. Es lo primero que miro yo cuando alguien me dice que le entra gente y no vende. Comenta la palabra CONFIANZA y lo dejo fijado en los comentarios y en mi perfil.", "segundos": 10, "nota_direccion": "CTA de 3 partes. CANDADO: cero promesa de mandar nada por privado; comentario + recurso nombrado + bio. Recurso REAL en disco: 06_HERRAMIENTAS_HTML/auditor-confianza-tienda.html. Cierre seco, sin despedida, sin 'nos vemos'."}], "musica": "Dos pistas por debajo de la voz. Hook: pista viral con pegada, 90 BPM o mas, entra en el frame 0 y muere en la frontera del hook. Cuerpo: instrumental calido y sobrio, sin voces cantadas, que no compita con la calle. Nada lento ni funebre. Si se cuela sonido de motor en la toma, se limpia: no hay plano de coche en marcha que lo justifique.", "duracion_s": 68, "texto_en_pantalla": "MONTAR LA TIENDA NUNCA FUE LO DIFICIL", "caption": "Tienes la tienda hecha, entra gente y no compra nadie. El problema no es el color del boton. El que entra no se fia todavia, y eso no lo arregla pedirle otra version del texto a la maquina. Decide tu a quien le vendes y por que te tiene que creer; ejecutar ya es lo barato. Comenta CONFIANZA y te dejo el auditor fijado en comentarios y en el perfil."}, {"id": "JOR-MOFU-03", "cuenta": "JORDI", "etapa": "MOFU", "titulo": "La IA no es una fuente, es un espejo", "formula": "F21 · CONTRAINTUITIVO PURO (banco 16-ago): «el que mas X es el que menos Y». Elegida porque el paradigma de la pieza es exactamente una inversion (usar menos la IA como fuente y mas como espejo) y F21 lo mete entero en el primer segundo, entendible en mute.", "escena": {"donde": "Terraza al atardecer, sentado, ciudad o mar de fondo desenfocado. Sitio suyo, luz natural cayendo.", "plano": "Plano medio, camara fija a la altura de los ojos, el sujeto ligeramente descentrado con el fondo abierto al otro lado.", "que_se_ve": "Jordi sentado, tranquilo, movil en la mano. Frame 0: gira el movil a camara y se ve una conversacion de un cliente real con el nombre, la foto y el telefono DIFUMINADOS. Despues lo apoya boca abajo en la mesa y habla sin tocarlo mas.", "atrezzo": "El movil con la conversacion de cliente difuminada. Es el elemento visual del hook. Material real y anonimizado: si no hay conversacion real disponible y difuminada, NO se graba con una inventada; se sustituye por el movil con la ficha de producto de su propia tienda."}, "bloques": [{"bloque": "ATENCION", "texto": "El que mas vende de tu sector es el que menos cosas le pide a la inteligencia artificial. Y no es casualidad.", "segundos": 7, "nota_direccion": "Hook LEIDO (6,0-7,5 s). El movil ya esta girado a camara en el frame 0, con el difuminado bien visible: en mute se entiende que es una conversacion de un cliente. Tono bajo, casi confidencial, y pausa larga en 'y no es casualidad'. Rotulo solo durante el hook, sin rotulo fijo despues."}, {"bloque": "PROBLEMA", "texto": "Piensa en lo que le das de comer. Abres el chat y escribes: hazme la descripcion de este producto. Y la maquina hace lo unico que puede hacer, que es devolverte el promedio de internet. Por eso tu ficha suena igual que la del proveedor, igual que la de tu competencia y igual que la de una tienda de otro pais que ni conoces. Frases suaves que no molestan a nadie y que no convencen a nadie. Y el que entra ya ha leido eso quince veces esta semana sin darse cuenta. No es que la maquina escriba mal. Es que le estas pidiendo que hable de un cliente al que no ha visto en su vida.", "segundos": 21, "nota_direccion": "Bajar al barro con el gesto exacto: abrir el chat y escribir esa frase. Ritmo pausado. Insertos cortos con la voz encima: tres fichas de producto distintas con textos casi identicos, en scroll lento. Cero graficas."}, {"bloque": "SOLUCION", "texto": "El cambio es dejar de pedirle ideas y empezar a darle material. Tu material. Los mensajes de la gente que ya te ha comprado. Las preguntas que te repiten siempre antes de pagar. Los motivos de verdad por los que te devuelven un pedido. Eso no lo tiene internet. Lo tienes tu, muerto de risa en el movil. Y el dia que le das eso, deja de escribir bonito y empieza a escribir lo que tu cliente ya esta pensando. Esa es toda la diferencia. La inteligencia artificial no es una fuente. Es un espejo: te devuelve lo que le pones delante.", "segundos": 21, "nota_direccion": "PARADIGMA puro, cero paso a paso: se dice QUE darle, nunca el prompt ni el orden ni el formato. 'No es una fuente, es un espejo' es la frase-tesis: pausa antes, mirada fija, y es la unica palabra con tratamiento fuerte en el subtitulo ('espejo')."}, {"bloque": "PRUEBA SOCIAL", "texto": "Y esto no es teoria mia. Luis llego a la mentoria ya facturando, buscando romper su techo. Del evento salio con una placa de dos millones de euros.", "segundos": 10, "nota_direccion": "Caso validado: caso_Luis_placa_2M_euros_Jordi.md. UNA sola cifra de la pieza y va DENTRO de la imagen: inserto del video real de la entrega de placa. Nunca en el caption. Redaccion neutra a proposito (la ficha tiene un aviso de genero sin confirmar): cero adjetivos con genero al hablar de Luis. No se le atribuye ninguna accion que no este en su entrevista: solo el punto de partida y la placa."}, {"bloque": "CTA", "texto": "Te he dejado el auditor de fichas de producto: pegas tu descripcion y te marca las frases que podria haber escrito cualquiera. Empieza por la ficha del producto que mas vendes, que es donde mas te cuesta cada frase generica. Comenta la palabra ESPEJO y lo dejo fijado en los comentarios y en mi perfil.", "segundos": 11, "nota_direccion": "CTA de 3 partes. CANDADO: cero promesa de privado; comentario + recurso nombrado + bio. Recurso REAL en disco: 06_HERRAMIENTAS_HTML/auditor-fichas-producto.html. Se dice sin prisa y se corta seco, sin despedida."}], "musica": "Dos pistas por debajo de la voz. Hook: pista viral con entrada marcada, 90 BPM o mas, solo en los 7 s del hook. Cuerpo: instrumental calido y sobrio de atardecer, sin voz cantada, plano y constante. Prohibida la lenta o de cementerio (queja literal suya del 28-jul).", "duracion_s": 70, "texto_en_pantalla": "LA IA NO ES UNA FUENTE. ES UN ESPEJO.", "caption": "Le pides ideas a la maquina y te devuelve el promedio de internet. Por eso tu ficha suena igual que la de todos. Dale tu material: lo que te escriben tus clientes, lo que preguntan antes de pagar, por que te devuelven un pedido. Entonces deja de escribir bonito y escribe lo que tu cliente ya piensa. Comenta ESPEJO y te dejo el auditor de fichas fijado en comentarios y en el perfil."}, {"id": "JORDI-BOFU-01", "cuenta": "JORDI", "etapa": "BOFU", "titulo": "La persona que aguanta los meses malos", "formula": "F12 · ESPEJO INCOMODO DE VIDA (banco 16-ago): «A mi no me para de sorprender... La gente esta dispuesta a [SACRIFICIO ENORME POR OTRO], pero no puede [ESFUERZO PEQUENO POR SI MISMA]». Se elige esta porque el BOFU de Jordi es mentalidad y su angulo validado es «el exito viene con quien tienes al lado»: F12 es la unica del banco que trabaja el espejo vida/sacrificio sin necesitar ni una cifra de facturacion propia (candado Hacienda). Bloque PROBLEMA escrito con F23 (verdad incomoda) y bloque SOLUCION con F24 (paradigma, no paso a paso).", "escena": {"donde": "Terraza de casa de Jordi al atardecer, mesa exterior. Sitio real suyo, cero decorado, cero oficina.", "plano": "Plano medio de pecho arriba, camara fija a la altura de los ojos, sentado. 9:16 a sangre.", "que_se_ve": "Jordi sentado a la mesa, sin moverse del sitio en toda la pieza. Sobre la mesa dos tazas de cafe: la suya delante y otra en el sitio de enfrente, vacia. 9:16 a sangre, SIN bandas ni encaje de cuadricula de feed (Jordi 12-ago). El rotulo del hook va CENTRADO y solo durante los 9 primeros segundos: nada de banda fija arriba toda la pieza (Jordi 13-ago: «el de arriba sobra, los subtitulos es lo importante»). Subtitulos quemados abajo, cuerpo >=80 px en lienzo 1080x1920, baseline entre y1250 y y1450. En el bloque de PRUEBA SOCIAL entra a pantalla completa la foto de la entrega de placa de Alejandro en el evento (unica cifra visible de la pieza, y va dentro de la imagen).", "atrezzo": "La segunda taza de cafe. En el segundo 1 Jordi la coge, la deja en el sitio de enfrente y la empuja un poco hacia la camara. Ahi se queda toda la pieza sin que nadie la toque. Es el elemento visual del hook (gate S4 de Santi) y se entiende en mute."}, "bloques": [{"bloque": "ATENCION", "texto": "Hay gente que aguanta diez años a un jefe que no le mira a la cara. Y no aguanta seis meses de tienda que no vende.", "segundos": 9, "nota_direccion": "Mirada fija a camara, sin sonreir, sin saludo. Dice la primera frase mientras coloca la segunda taza enfrente. Pausa entera de un segundo despues de «cara». Tono un punto mas alto de lo normal en «diez años» y seco en el remate."}, {"bloque": "PROBLEMA", "texto": "Y te digo por que. Al jefe lo aguantas tu solo. La tienda la aguanta tambien quien vive contigo. Los primeros meses no vendes. Cenas mirando el movil. Contestas mal por un pedido cancelado. Y no le has contado nada, porque te da verguenza que todavia no funcione. Asi que quien tienes al lado no ve un negocio. Ve que has cambiado y no sabe por que.", "segundos": 21, "nota_direccion": "Baja el volumen y la velocidad aqui: esto es el barro. Enumera «cenas mirando el movil / contestas mal» sin enfasis, como quien lo ha hecho. Pausa antes de «no sabe por que» y ahi mira a camara sin parpadear."}, {"bloque": "SOLUCION", "texto": "El cambio no esta en el producto. Esta en dejar de esconderlo. Sientate con la persona que vive contigo y cuentale que estas montando, que te va a costar y cuanto tiempo le vas a quitar. No para que te aplauda. Para que sepa que esta pagando. El negocio que aguanta no es el mas rapido: es el que no tiene a nadie en contra dentro de casa.", "segundos": 23, "nota_direccion": "Tono CEO, pausado, frases cortas separadas. «No para que te aplauda» dicho casi en voz baja. La ultima frase se dice entera sin respirar en medio, es el remate de la pieza."}, {"bloque": "PRUEBA SOCIAL", "texto": "Alejandro entro conmigo trabajando en una nave industrial y con una hija pequeña en casa. Lo primero que hizo fue contarlo en su casa. Esta es la placa que se llevo del evento.", "segundos": 12, "nota_direccion": "Al decir «esta es la placa» entra a pantalla completa la foto real de la entrega en el evento (gente real, regla 21). La cifra solo se ve en la placa, no se dice ni se escribe en ningun rotulo."}, {"bloque": "CTA", "texto": "Si no sabes ni en que punto esta tu tienda para poder explicarlo, tengo un test de madurez de tienda hecho. Comenta NIVEL y lo tienes en mi perfil.", "segundos": 10, "nota_direccion": "Vuelve el plano de la terraza. Cero fricción: una sola accion, comentar una palabra. NO se promete mandar nada por privado (sancion de links viva). El recurso se nombra y se deja en bio. Pildora con la palabra NIVEL en pantalla al decirla."}], "musica": "Dos pistas (regla 12 de Jordi, «nada de musica de cementerio»). HOOK 0-9 s: pista viral de los trending USA/España, 100-115 BPM, entra en seco en el frame 0 y corta justo al desaparecer el rotulo. CUERPO 9-75 s: instrumental calida verificada como instrumental en MUSICA_CATALOGO.json (campo instrumental=true; prohibida METAMORPHOSIS, tiene voz cantada), a -20 LUFS, siempre por debajo de la voz. Nada por debajo de 90 BPM en el hook. Fuente: D:\\PACK_EDICION\\PACKS\\MÚSICA DE FONDO (110 pistas). Canción no usada en las ultimas piezas de la cuenta.", "duracion_s": 75, "texto_en_pantalla": "EL PRECIO LO PAGA EL DE AL LADO", "caption": "Nadie monta esto solo, aunque por fuera lo parezca. Antes de arreglar la tienda, cuentalo en tu casa. Comenta NIVEL. El test de madurez de tienda esta en mi perfil."}, {"id": "JORDI-BOFU-02", "cuenta": "JORDI", "etapa": "BOFU", "titulo": "Este coche no arreglo nada", "formula": "F7 · MATA EL FALSO CULPABLE (banco 16-ago): «[COMPRA QUE TODOS CREEN NECESARIA] no te va a hacer [RESULTADO]. Solo te asegura que [COSTE] se va de tu cuenta». Es la unica del banco que permite sacar el coche (su estetica propia y validada) tumbandolo en vez de presumirlo: asi el contraste fuera/dentro se ve literalmente en pantalla y no hace falta ninguna cifra suya. SOLUCION escrita con F24 (paradigma) y prueba social con F28.", "escena": {"donde": "Garaje o calle tranquila de dia, luz natural. El coche de Jordi, que es SU estetica (en la cuenta de Javi esto seria BLOCK).", "plano": "Plano medio corto de cintura arriba, camara a la altura del pecho, Jordi apoyado en el lateral del coche. El coche reconocible pero desenfocado detras. 9:16 a sangre.", "que_se_ve": "Jordi apoyado en el coche, quieto, hablando a camara. Nada de conducir, nada de arrancar, nada de plano de lujo. 9:16 a sangre sin bandas. Rotulo del hook CENTRADO solo en los 8 primeros segundos, sin banda fija arriba el resto de la pieza. Subtitulos abajo, cuerpo >=80 px, baseline y1250-y1450. En PRUEBA SOCIAL entra a pantalla completa el pantallazo real del panel de ventas de Nil (unica cifra visible de la pieza, dentro de la imagen).", "atrezzo": "La llave del coche. La lanza al aire y la recoge una vez mientras dice el hook, y en el segundo 8 la deja sonando sobre el capo y no la vuelve a tocar. Elemento visual unico del hook, se entiende en mute."}, "bloques": [{"bloque": "ATENCION", "texto": "Este coche no ha arreglado ni uno solo de los problemas que tenia mi negocio. Ni uno. Y te lo digo apoyado en el.", "segundos": 8, "nota_direccion": "Tono exagerado a proposito en «ni uno», con pausa antes. Lanza y recoge la llave mientras habla. En «apoyado en el» da un golpecito con la mano en la carroceria: ese golpe es el que hace que se entienda el hook sin sonido."}, {"bloque": "PROBLEMA", "texto": "El problema es que tu ves esto y copias esto. Copias la foto, copias el video, copias la tienda que se ve bonita. Y por dentro haces lo mismo que hacias: no sabes que te queda de cada venta, no sabes que producto te esta costando dinero, y tapas el agujero metiendo mas dinero en anuncios. Eso no es un negocio. Es un escaparate con luces.", "segundos": 23, "nota_direccion": "Aqui baja el ritmo y se pone serio. Las tres «copias» seguidas se dicen rapidas y pegadas, y luego frena en seco en «y por dentro». «Es un escaparate con luces» va lento, separando las palabras."}, {"bloque": "SOLUCION", "texto": "Deja de copiar lo que se ve y copia lo que no se ve. Lo que hay debajo de una tienda que aguanta son tres numeros que el dueño se sabe de memoria: que le cuesta traer un cliente, que le queda limpio de cada venta y cuantas veces le vuelve a comprar. Cuando te sabes esos tres, el escaparate da igual. Y el coche, tambien.", "segundos": 23, "nota_direccion": "Se dice QUE hay que mirar, nunca COMO se calcula (gate S2: la solucion se dice, no se explica). Los tres numeros se enumeran con la mano, sin rotulos en pantalla. «Y el coche, tambien» se dice mirando el coche y volviendo a camara: es el remate."}, {"bloque": "PRUEBA SOCIAL", "texto": "Nil venia de nueve años de universidad. No empezo comprandose nada. Empezo mirando esos numeros todos los dias. Esta es su pantalla dos meses y medio despues.", "segundos": 10, "nota_direccion": "Al decir «esta es su pantalla» entra el pantallazo real a pantalla completa, entero y sin marco ni recorte. La cifra vive solo ahi dentro: ni se dice en voz alta ni se escribe en el caption."}, {"bloque": "CTA", "texto": "Si no sabes que te queda limpio de cada venta, tengo la calculadora de margen real hecha. Comenta MARGEN y la tienes en mi perfil.", "segundos": 9, "nota_direccion": "Vuelve al plano del coche. Una sola accion, cero fricción. Sin prometer envio por privado: el recurso se nombra y esta en bio. Pildora con la palabra MARGEN al decirla."}], "musica": "Dos pistas. HOOK 0-8 s: pista viral trending USA/España con pegada, 105-120 BPM, entra en el frame 0 y corta con el golpe en la carroceria. CUERPO 8-73 s: instrumental seca y sin voz (verificada instrumental=true en MUSICA_CATALOGO.json, nunca METAMORPHOSIS) a -20 LUFS, por debajo de la voz. Nada lento ni funebre. Pista distinta a la del guion 01 de esta misma tanda.", "duracion_s": 73, "texto_en_pantalla": "ESTO NO ARREGLA UNA TIENDA", "caption": "El coche no arregla una tienda. Lo de dentro, si. Comenta MARGEN. La calculadora de margen real esta en mi perfil."}, {"id": "JORDI-BOFU-03", "cuenta": "JORDI", "etapa": "BOFU", "titulo": "El que espera a estar listo", "formula": "F21 · CONTRAINTUITIVO PURO (banco 16-ago): «[EL QUE MAS X] es el que menos [Y]». Es la formula de Ramiro que rompe la objecion BOFU numero uno («todavia no es mi momento, me falta prepararme mas») dandole la vuelta en la primera frase, y no necesita ninguna cifra propia. PROBLEMA con F23 (verdad incomoda), SOLUCION con F24 (paradigma) y cierre con F28 (prueba social obligatoria).", "escena": {"donde": "Interior de casa de noche, sentado en el sofa, luz calida de una lampara de pie. Sitio intimo, cero oficina, cero coche: esta pieza es la del contraste, lo que cuesta y no se ve.", "plano": "Plano medio, camara ligeramente por debajo de la altura de los ojos, apoyada y quieta. 9:16 a sangre.", "que_se_ve": "Jordi sentado, sudadera clara, hablando bajo. Sobre la mesa un cuaderno cerrado con una goma y papeles asomando por los lados. 9:16 a sangre sin bandas ni encaje de cuadricula. Rotulo del hook CENTRADO y solo en los 7 primeros segundos, sin banda fija arriba. Subtitulos abajo, cuerpo >=80 px, baseline y1250-y1450. En PRUEBA SOCIAL entra a pantalla completa la foto de la entrega de placa a Luis en el evento (unica cifra visible, dentro de la imagen).", "atrezzo": "El cuaderno lleno de apuntes. Lo levanta con una mano en el hook, lo enseña a camara y lo deja caer de plano sobre la mesa al terminar la frase. El golpe del cuaderno es el elemento visual del hook y funciona en mute."}, "bloques": [{"bloque": "ATENCION", "texto": "El que mas tiempo lleva preparandose es el que menos ha vendido. Siempre. Y este cuaderno lleno es la prueba.", "segundos": 7, "nota_direccion": "Levanta el cuaderno en la primera palabra. «Siempre» se dice solo, con pausa antes y despues. El cuaderno cae sobre la mesa justo en «prueba»: ese golpe cierra el hook."}, {"bloque": "PROBLEMA", "texto": "Llevas ocho meses. Tienes el nombre, el logo, los colores, dos proveedores apuntados y ninguna venta. Y cada vez que te sientas a lanzar, aparece otra cosa que hay que aprender antes. Eso no es prudencia. Es miedo bien vestido. Porque mientras estudias no fallas, y en el momento en que lo abres puede no funcionar. Y eso es lo que no quieres ver.", "segundos": 22, "nota_direccion": "La lista se dice rapida y sin respirar, para que suene a acumulacion. Freno seco en «ninguna venta». «Es miedo bien vestido» se dice bajo, casi susurrado, mirando a camara. Pausa larga antes de la ultima frase."}, {"bloque": "SOLUCION", "texto": "Deja de intentar estar listo. Nadie lo esta. Lo que cambia el resultado no es saber mas: es tener a alguien delante que te diga hoy que esta mal, para no descubrirlo dentro de seis meses. Yo tampoco monte lo que tengo encerrado estudiando. Lo monte equivocandome delante de gente que ya habia pasado por ahi. Esa es la diferencia entera.", "segundos": 21, "nota_direccion": "Tono CEO, reflexivo, sin subir la voz en ningun momento. «Nadie lo esta» va aparte, como una concesion. La ultima frase se dice mirando fijo y se corta el plano justo al acabarla, sin aire de mas."}, {"bloque": "PRUEBA SOCIAL", "texto": "Luis ya vendia cuando entro. No le faltaba informacion, le faltaba alguien que le dijera donde estaba el freno. Esta es la placa que le entregue en el evento.", "segundos": 10, "nota_direccion": "Al decir «esta es la placa» entra a pantalla completa la foto real de la entrega en el evento, con sala y gente real detras. La cifra solo existe dentro de la placa."}, {"bloque": "CTA", "texto": "Si no sabes por donde empezar a arreglar la tuya, hay una auditoria express de tienda que te lo dice en diez minutos. Comenta AUDITORIA y esta en mi perfil.", "segundos": 11, "nota_direccion": "Vuelve al plano del sofa. Una sola accion. Nada de mandar por privado: se nombra el recurso y esta en bio. Pildora con la palabra AUDITORIA en pantalla al decirla."}], "musica": "Dos pistas. HOOK 0-7 s: pista viral trending, 95-110 BPM, entra en el frame 0 y para en seco con el golpe del cuaderno (el silencio despues del golpe es parte del hook). CUERPO 7-71 s: instrumental calida muy baja, verificada instrumental=true en MUSICA_CATALOGO.json, a -22 LUFS porque es la pieza mas intima de la tanda; aun asi nunca por debajo de 90 BPM (nada de piano lento ni de cementerio). Tercera pista distinta de las de los guiones 01 y 02.", "duracion_s": 71, "texto_en_pantalla": "EL QUE MÁS SE PREPARA ES EL QUE MENOS VENDE", "caption": "Prepararte mas no es avanzar. Es la forma mas comoda de no empezar. Comenta AUDITORIA. La auditoria express de tienda esta en mi perfil."}];
const GUIONES=[{"id": "QA03", "hook": "Tenemos alumnos que han facturado más del millón al mes con sus tiendas online", "dur": 20.1, "t1": 1662.9, "t2": 1683.0, "etapa": "BOFU", "estructura": "pregunta (\"hablemos de números: vuestros casos de éxito ¿cuánto facturan?\" 1662.9-1665.8) → Javi (1666.6-1683.0: +1M/mes, gente entre 300 y 500 mil €/mes)", "porque": ""}, {"id": "QA04", "hook": "Los dos alumnos que están facturando más de un millón al mes tenían un margen de beneficio de un 18%", "dur": 32.6, "t1": 1684.3, "t2": 1716.9, "etapa": "BOFU", "estructura": "pregunta (\"¿es realmente facturación o hay beneficio?\" 1684.3-1689.7) → respuesta (1690.4-1712.5: cuanto más facturas, el margen baja; 1M al 18% \"no está mal\")", "porque": ""}, {"id": "QA08", "hook": "Si quieres realmente conocimiento… el que estás viendo va a tener menos de 1.000 suscriptores\" / cierre: \"posiblemente el contenido va a ser una mierda", "dur": 37.9, "t1": 3411.8, "t2": 3449.7, "etapa": "BOFU", "estructura": "respuesta (YouTube premia visualizaciones, no conocimiento; retos estúpidos de facturación; filtra a quién ves)", "porque": ""}, {"id": "QA14", "hook": "Nuestra vida puede ser bastante aburrida… pasa que eso no vende, ese es el problema", "dur": 40.2, "t1": 3547.5, "t2": 3587.7, "etapa": "BOFU", "estructura": "diálogo (trabajar sábado o domingo no es problema, es vocacional → la gente quiere viajar, lifestyle… lo que se vende no es la realidad)", "porque": ""}, {"id": "QA16", "hook": "Para mí el verdadero millonario es la persona que puede ocupar su tiempo en lo que él quiera", "dur": 36.1, "t1": 3750.6, "t2": 3786.7, "etapa": "BOFU", "estructura": "Javi solo (si mañana quiero tomarme el día libre para estar con mi hijo, me lo tomo… no depender de una oficina para ganar dinero)", "porque": ""}, {"id": "QA17", "hook": "Al poder comprarme el Lamborghini me abrió muchísimas puertas", "dur": 42.6, "t1": 715.3, "t2": 757.9, "etapa": "BOFU", "estructura": "pregunta lujo/Lambo (708-714, overlay) → Jordi (el conocimiento no se puede materializar, lo material sí; la gente materializa el éxito)", "porque": ""}, {"id": "QA18", "hook": "Un compañero del equipo de fútbol me decía: aparte de saber hay que aparentar. Hay mucha gente que aparenta en vez de saber", "dur": 38.8, "t1": 809.4, "t2": 848.2, "etapa": "TOFU", "estructura": "Javi (comprarte un objeto de lujo para transmitir que sabes = no; Jordi lleva años emprendiendo y era SU objetivo — eso es distinto)", "porque": ""}, {"id": "QA19", "hook": "Yo soy Javier Sánchez, tengo 45 años, soy padre de familia, exfutbolista, entrenador personal…", "dur": 31.7, "t1": 109.8, "t2": 141.5, "etapa": "BOFU", "estructura": "pregunta (\"si alguien no os conociera de nada ¿cómo os presentaríais?\" 109.8-114.1) → Javi (9 años en tiendas online, Mentorium, \"referentes en habla hispana… muchos mentores que venden formaciones se han formado con nosotros\")", "porque": ""}, {"id": "QA20", "hook": "Cuando fui padre dije: voy a hacer algo como hobby para generar un ingreso extra… y a los pocos meses ya estaba generando más que mi propio trabajo de 8 horas", "dur": 34.3, "t1": 142.3, "t2": 176.6, "etapa": "MOFU", "estructura": "Jordi solo (soy Jordi García, 8 años en tiendas online, trabajo de 8 horas, boom 2017-2018 en España)", "porque": ""}, {"id": "QA21", "hook": "No venimos de ser programadores ni de haber sido informáticos… yo soy entrenador personal, Jordi tenía su trabajo", "dur": 35.8, "t1": 207.2, "t2": 243.0, "etapa": "TOFU", "estructura": "Javi (venimos totalmente de cero, aprendiendo como cualquier persona normal, trabajando 8 horas)", "porque": ""}, {"id": "QA22", "hook": "Si yo os digo que soy un paleta o soy pintor, que sé cuatro cosas de ordenadores… ¿podría llegar al punto donde estáis vosotros?\" — \"Por supuesto", "dur": 39.8, "t1": 243.5, "t2": 283.3, "etapa": "BOFU", "estructura": "pregunta entrevistador (243.5-253.4) → Javi (253.4-283.3: \"yo iba con mi mochilita a casa de clientes y a gimnasios… hay que tomar acción, formarse… la experiencia te da resultados a largo plazo\")", "porque": ""}, {"id": "QA23", "hook": "Mucha gente quiere ganar dinero online de forma rápida, y el dinero rápido no existe", "dur": 38.4, "t1": 990.6, "t2": 1029.0, "etapa": "TOFU", "estructura": "pregunta (\"¿qué tengo que hacer para tener éxito en e-commerce?\" 990.6-994.8) → Javi (995.6-1029.0: tomar acción + paciencia; \"cuando monté mi primera tienda perdí dinero… hasta que me empecé a formar\")", "porque": ""}, {"id": "QA24", "hook": "Yo te doy el conocimiento, pero yo no puedo abrir el ordenador por ti, no puedo crear la tienda por ti", "dur": 39.1, "t1": 1029.0, "t2": 1068.1, "etapa": "MOFU", "estructura": "Javi solo (mínimo 6 meses le digo a todos los que entran en Mentorium… el que a la segunda semana pone excusas se está engañando a sí mismo… \"vamos de la mano al éxito\")", "porque": ""}, {"id": "QA25", "hook": "Esa gente no nos interesa… es que prefiero que no entre", "dur": 51.3, "t1": 1604.2, "t2": 1655.5, "etapa": "TOFU", "estructura": "Javi (le he dicho a gente por redes: \"tú con esa actitud no vas a entrar aquí\"… \"yo no quiero un alumno que me haga perder tiempo y dinero a mí, a Jordi y a mi equipo\"; queremos gente con actitud que quiera escalar)", "porque": ""}, {"id": "JUNTOS01", "hook": "¿Por qué vender una formación si tenéis tanto éxito con las tiendas?\" — \"Es una vertical dentro de nuestro negocio… no somos tontos", "dur": 49.6, "t1": 1312.7, "t2": 1362.3, "etapa": "MOFU", "estructura": "Zyro pregunta LA pregunta incómoda (1312.7-1316.6) → Javi (1317.1-1362.3: igual que hacemos contra reembolso, dropshipping y marca, hacemos formación; yo cogí mentores cuando empecé; nos ayuda a ganar dinero, \"no somos tontos\"; remate: ayudar a alguien que empieza de cero \"me gratifica mucho porque yo he estado en ese lugar también\")", "porque": ""}, {"id": "JUNTOS02", "hook": "Un día le dije: no vas a entrar en Mentorium… no te quiero aquí con esa actitud", "dur": 51.0, "t1": 3231.3, "t2": 3282.3, "etapa": "BOFU", "estructura": "un solo speaker (3231.3-3282.3: tuve una discusión con uno → le negué la entrada por actitud → al cabo de los meses volvió en frío y dijo \"mira, lo siento\" → le di la entrada → por su actitud ha tenido resultados y hoy me lo agradece; remate: \"esas pequeñas cosas que pasan en la vida te marcan la diferencia\")", "porque": ""}, {"id": "JUNTOS03", "hook": "Cualquier persona que te diga 'deja algo, creo que no es para ti'… posiblemente es una persona que no te quiere", "dur": 40.8, "t1": 2606.8, "t2": 2647.6, "etapa": "BOFU", "estructura": "speaker A (2606.8-2624.7: el que te dice que lo dejes no te quiere o le viene mal tu resultado; si confías en ti, la gente verá que lo puedes lograr) → speaker B (2624.7-2647.6: \"¿y si empiezas de cero? empezamos de cero\"; ¿qué es lo peor que puede pasar? \"nada, me quedaré igual… pues vamos a intentarlo\")", "porque": ""}, {"id": "JUNTOS04", "hook": "Cuando vas ganando no vas aprendiendo nada… todo va bien", "dur": 43.8, "t1": 2465.6, "t2": 2509.4, "etapa": "BOFU", "estructura": "speaker A (2465.6-2482.9: el éxito real llega cuando surgen los problemas — una separación, un amigo, un problema del negocio = aprendizaje brutal) → speaker B (2483.8-2509.4: \"es parte del juego\"; ojalá todos los días fueran verdes, la vida no es así; remate: si aprendes cuando estás abajo, cuando estés arriba vas a disfrutar y tendrás mejor resultado, \"100%\")", "porque": ""}, {"id": "JUNTOS05", "hook": "No cierras por la noche… puedes estar vendiendo productos a las 4 de la mañana", "dur": 36.0, "t1": 2125.9, "t2": 2161.9, "etapa": "MOFU", "estructura": "turnos rápidos Javi-Jordi (2125.9-2146.7: abierto sábado, domingo, no cierras de noche; el bar en pandemia cerró; si te vas de vacaciones el bar necesita personal) → (2151.6-2161.9: vendes a cualquier hora; el bar siempre abierto + personal + 80.000 € de inversión; remate: \"¿qué negocio es más rentable? que alguien me lo diga\")", "porque": ""}, {"id": "JUNTOS06", "hook": "¿Qué riesgo tienes? Perder dinero… ¿qué miedo tienes? ¿3.000, 2.000, 5.000? Ponte a trabajar y lo vas a recuperar", "dur": 37.4, "t1": 2162.5, "t2": 2199.9, "etapa": "TOFU", "estructura": "speaker A (2162.5-2192.7: yo se lo pongo delante a los alumnos, sobre todo jóvenes: el único riesgo es perder dinero; yo monté mi tienda con mis ahorros y dije \"si los pierdo no pasa nada, sigo trabajando y sigo generando\") → remate (2193.6-2199.9: lo que iba a ganar tomando acción era mucho más grande; \"mi tiempo lo que voy a hacer es aprender una habilidad, voy a aprender algo nuevo\")", "porque": ""}, {"id": "JUNTOS07", "hook": "No soy un bicho raro por tenerlo… la gente puede tenerlo; la verdad es que la gente materializa el éxito", "dur": 50.6, "t1": 757.9, "t2": 808.5, "etapa": "TOFU", "estructura": "Jordi (757.9-797.6: la gente puede tenerlo y no lo tiene porque tendrá otras inversiones; el Lambo no era mi objetivo nº1, \"si me canso lo vendo y me compro otro\"; para la gente es lo que da el cambio de chip) → réplica del otro (798.4-808.5: remate \"una cosa es que te compres un Lamborghini porque era tu ilusión desde que empezaste… y otra cosa es que te lo compres para vender a las personas\")", "porque": ""}, {"id": "JUNTOS08", "hook": "¿De qué sirve tener dinero, éxito, lo que quieras… si tu hijo no va a estar a tu lado?", "dur": 46.2, "t1": 3701.2, "t2": 3747.4, "etapa": "TOFU", "estructura": "un speaker (3701.2-3747.4: conozco mucha gente con éxito y mucho dinero que a los hijos apenas los ve; el tiempo pasa y eso no se recupera con dinero; sentir lo que necesita el niño y estar presente, poder acudir al colegio, acompañarlo si está enfermo; remate: compaginar el negocio online con la vida familiar \"es lo más bonito y lo que más te llena\")", "porque": ""}, {"id": "JUNTOS09", "hook": "¿Cómo sería vuestro día a día?\" — \"Yo estoy todo el día en la piscina dando vueltas", "dur": 44.4, "t1": 3450.5, "t2": 3494.9, "etapa": "BOFU", "estructura": "Zyro pregunta el día a día (3450.5-3458.8) → broma (3459.4-3461.3, risa multicam) → respuesta real (3462.4-3494.9: \"somos trabajadores\"; hijo pequeño de dos años, reuniones, la formación, pensar el siguiente paso del negocio; remate: tiempo para entrenar \"y sobre todo estar con la familia\")", "porque": ""}, {"id": "JUNTOS10", "hook": "¿Cómo se hace? ¿Magia? Son 8 horas, 10 horas al día enganchado", "dur": 50.9, "t1": 3496.1, "t2": 3547.0, "etapa": "BOFU", "estructura": "un speaker (3496.1-3523.2: muchas horas en oficina, el tiempo libre a la familia; en redes parece otra vida; cuanto más facturas, más problemas y más horas) → (3523.7-3547.0: desengancharse del trabajo es imposible si quieres facturar; puedes viajar, sí, \"pero algún domingo tendrás que trabajar — esa es la verdadera libertad\")", "porque": ""}, {"id": "JUNTOS11", "hook": "No importa lo que hayas hecho antes ni la experiencia que tengas: yo tenía cero experiencia", "dur": 54.2, "t1": 283.9, "t2": 338.1, "etapa": "BOFU", "estructura": "Jordi solo (283.9-338.1: lo que marca es la actitud; con actitud positiva de aprender y disfrutar el proceso \"te acaba yendo bien, 100%\"; mucha gente me conoce de la ciudad y dice \"me gustaría\"… pero no da el paso — esa gente no va a llegar a dedicarse a esto; remate: la actitud y las ganas marcan si vas a tener éxito)", "porque": ""}, {"id": "JUNTOS12", "hook": "¿Una palabra que haya marcado vuestro éxito?\" — \"Perseverancia… ya puede haber un muro enfrente, que hasta que no lo derribo no paro", "dur": 47.2, "t1": 1087.3, "t2": 1134.5, "etapa": "BOFU", "estructura": "Zyro pide UNA palabra (1087.3-1094.0) → \"Perseverancia\" en seco (1098.7-1099.1, pausa dramática natural) → desarrollo (1101.8-1134.5: mi mujer lo dice, cuando se me mete algo en la cabeza no paro; el deporte me enseñó que el trabajo y el esfuerzo tienen recompensa; remate: \"si tienes perseverancia y objetivos claros, el éxito llega\")", "porque": ""}, {"id": "JUNTOS13", "hook": "Como hobby vine sin nada… y si mañana lo pierdo, vuelvo a trabajar. No tengo miedo", "dur": 32.2, "t1": 1137.1, "t2": 1169.3, "etapa": "MOFU", "estructura": "Jordi solo (1137.1-1169.3: mi palabra es la actitud — en la vida, en los problemas, cuando tienes éxito y cuando no; he tenido problemas y los he sabido resolver; remate: \"si tengo buena actitud seguiré subiendo, y si no, empezamos de cero, no hay problema\")", "porque": ""}, {"id": "JUNTOS14", "hook": "Si no tienes el dinero, tienes tiempo… cuando no tienes tiempo es porque tienes dinero", "dur": 48.2, "t1": 1889.5, "t2": 1937.7, "etapa": "TOFU", "estructura": "Jordi solo, rebote sobre el turno de Javi (1889.5-1913.2: empecé con menos de 3.000 €, un curso de un estadounidense de 300 € en 2018, dedicándole muchas horas; el dilema tiempo/dinero; fórmate gratis en YouTube preguntando) → (1913.2-1937.7: yo aprendí gratis y el conocimiento era muy disperso, tú haces el filtro; remate: \"cuando pagas un ticket por entrar te acortan muchísimo tiempo porque tiene", "porque": ""}, {"id": "JUNTOS17", "hook": "Trabajaba de lunes a sábado, más de 8 horas, buscando clientes de casa en casa, de gimnasio en gimnasio", "dur": 51.5, "t1": 3892.4, "t2": 3943.9, "etapa": "BOFU", "estructura": "pregunta Zyro como overlay (\"¿cómo era vuestra vida antes del e-commerce?\" 3880.0-3882.6) → Javi solo (3892.4-3943.9: llegaba el sábado a comer y me iba a acostarme, sin vida social; si dejaba de entrenar gente, dejaba de ganar; ahora: negocio digital, tiempo, vivo en un chalet al lado de la playa, mi hijo tiene una calidad de vida brutal; remate: \"gracias a que tomé acción en su momento, mi vida ", "porque": ""}, {"id": "JUNTOS18", "hook": "Mi vida antes del e-commerce era lo más plana que hay: 8 horas de trabajo y las horas muertas a hobbies que no aportaban nada", "dur": 30.0, "t1": 3949.3, "t2": 3979.3, "etapa": "TOFU", "estructura": "un speaker (3949.3-3979.3: cambié los hobbies vacíos por hobbies que construyen; remate: \"cuando online… pero nunca se ha decidido a dar el paso", "dur": 49.2, "t1": 2878.4, "t2": 2927.6, "etapa": "MOFU", "estructura": "Zyro pregunta el perfil de alumno (2878.4-2881.1) → Javi corto (2882.2-2890.5: \"gente que tenga acción y actitud… con ganas\") → Zyro pica al otro (\"así que vas a responder tú también\", 2897.1-2903.5 — pausa 2890.5→2897.1, recortar en edición) → Jordi (2904.6-2927.6: gente de cero con ilusión que nunca dio el paso, que quiera un cambio de vida, sin presión de resultados al mes; remate: \"que aprenda", "porque": ""}, {"id": "JUNTOS23", "hook": "¿Tú qué prefieres: formarte con gente que ha tocado todos los palos… o con alguien que solamente hace dropshipping?", "dur": 46.3, "t1": 2957.8, "t2": 3004.1, "etapa": "TOFU", "estructura": "un speaker (2957.8-3004.1: imagínate que tienes una tienda y quieres entrar en Mentorium — nosotros hemos hecho contra reembolso, dropshipping de China, marcas, y tenemos una escuela de formación; remate = pregunta retórica autoconclusiva \"tú qué preferirías\", la respuesta es evidente)", "porque": ""}, {"id": "JUNTOS24", "hook": "Mucha gente nos escribía por internet: ¿por qué no sacáis una formación un poquito más profesional?", "dur": 45.2, "t1": 23.9, "t2": 69.1, "etapa": "TOFU", "estructura": "Zyro (23.9-25.6: \"¿por qué Mentorium y cómo surgió la idea?\") → speaker A (26.1-44.9: éramos formadores individuales, la gente nos lo pedía, lo montamos para profesionalizarlo y tener comunidad) → Jordi (45.8-69.1: el contenido de otras formaciones estaba desactualizado a los pocos meses; remate: \"construir algo para enseñar el paso de cero a cien dentro del e-commerce\")", "porque": ""}, {"id": "JUNTOS25", "hook": "Te compras un Lamborghini, y cuando lo consigues dices: ya lo tengo. ¿Ahora qué?", "dur": 41.9, "t1": 870.5, "t2": 912.4, "etapa": "BOFU", "estructura": "Zyro pregunta qué es una persona de éxito (870.5-875.4) → respuesta (877.4-912.4: la que tiene un objetivo y trabaja cada día para conseguirlo; los empre /* ---------- persistencia: merge, nunca pisar lo del otro ---------- */
async function leerBlob(){
  /* lee el legado + los 4 bins personales y FUSIONA. La decisión efectiva de una pieza es la
     más reciente de cualquiera; las de los demás se conservan como notas visibles. */
  const r=await fetch(BLOB,{cache:"no-store"});
  if(!r.ok)throw new Error("GET "+r.status);
  const j=await r.json();
  const base=Object.assign({}, j, {decisiones:j.decisiones||{}, referentes:j.referentes||[],
                                    calendario:j.calendario||{}, f1:j.f1||{}, notas:{}, hooks:j.hooks||[],
                                    ordenes_todas:[]});
  const bins=await Promise.all(Object.entries(BINS).map(async([quien,url])=>{
    try{ const rr=await fetch(url,{cache:"no-store"}); return [quien, rr.ok? await rr.json():null]; }
    catch(e){ return [quien,null]; }
  }));
  for(const [quien,b] of bins){
    if(!b) continue;
    if(quien===YO) MIO=Object.assign({decisiones:{},hooks:{},ordenes:[],publicados:[]}, b);
    for(const o of (b.ordenes||[])) base.ordenes_todas.push(Object.assign({},o,{por:o.por||quien}));
    for(const [pid,d] of Object.entries(b.decisiones||{})){
      (base.notas[pid]=base.notas[pid]||[]).push(Object.assign({por:quien},d));
      const prev=base.decisiones[pid];
      if(!prev || (d.cuando||"")>(prev.cuando||"")) base.decisiones[pid]=Object.assign({por:quien},d);
    }
    for(const [hid,h] of Object.entries(b.hooks||{})){
      const k=base.hooks.find(x=>x.id===hid); if(!k) continue;
      if(!k.cuando || (h.cuando||"")>(k.cuando||"")) Object.assign(k,h,{por:quien});
    }
  }
  return base;
}

async function guardarMio(aplicar){
  /* escribe SOLO en mi bin, con reintento. Nadie puede pisar lo de nadie. */
  const url=BINS[YO]; if(!url){aviso("Tu usuario no tiene almacén",true);return false;}
  for(let i=0;i<3;i++){
    try{
      const rr=await fetch(url,{cache:"no-store"});
      const mio=rr.ok? await rr.json() : {decisiones:{},hooks:{},ordenes:[],publicados:[]};
      mio.decisiones=mio.decisiones||{}; mio.hooks=mio.hooks||{};
      mio.ordenes=mio.ordenes||[]; mio.publicados=mio.publicados||[];
      aplicar(mio);
      const w=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
                               body:JSON.stringify(mio)});
      if(!w.ok)throw new Error("POST "+w.status);
      MIO=mio; E=await leerBlob(); aviso("Guardado"); return true;
    }catch(e){ if(i===2){aviso("No se pudo guardar (reintenta en unos segundos)",true);return false;}
      await new Promise(r=>setTimeout(r,500*(i+1))); }
  }
}
async function guardar(aplicar){
  /* ⛔ 20-ago · `pendiente` era UN hueco (pendiente=aplicar) y "Aprobar toda esta sección"
     dispara N clicks seguidos: el primero entraba, y los N-1 siguientes se PISABAN entre sí,
     así que de 20 aprobaciones se guardaban 2 (la primera y la última). Medido en la auditoría.
     Ahora es una COLA de verdad: cada decisión se encola y se aplican TODAS, en orden, sobre
     el mismo blob (leer -> aplicar todas las pendientes -> un solo POST). */
  pendiente.push(aplicar);
  if(guardando)return;
  guardando=true;
  while(pendiente.length){
    const lote=pendiente.splice(0,pendiente.length);   /* todas las que haya, de golpe */
    let ok=false;
    for(let i=0;i<3;i++){
      try{
        const srv=await leerBlob();
        for(const fn of lote)fn(srv);
        const r=await fetch(BLOB,{method:"POST",headers:{"Content-Type":"application/json"},
                                  body:JSON.stringify(srv)});
        if(!r.ok)throw new Error("POST "+r.status);
        E=srv; aviso("Guardado ("+lote.length+")"); ok=true; break;
      }catch(e){ await new Promise(r=>setTimeout(r,600*(i+1))); }
    }
    if(!ok){guardando=false;pendiente=[];
      aviso("No se pudo guardar (almacén caído). El panel sigue en solo-lectura.",true);
      render();return;}
  }
  guardando=false; render();
}

const f1de=p=>{const v=(E.f1||{})[p.id];return v?v.estado:(p.f1||"pendiente");};
const f1motivo=p=>{const v=(E.f1||{})[p.id];return v?(v.motivo||""):(p.f1_motivo||"");};

function pendientes(){
  /* 13-ago, orden de Gerard: SIN filtro previo. Todos (Gerard incluido) ven la MISMA
     cola y votan de golpe; una pieza sale de la cola en cuanto alguien decide. */
  return DATOS.piezas.filter(p=>{
    if(FCUENTA!=="todo"&&p.cuenta!==FCUENTA)return false;
    const d=dec(p.id);
    /* ⛔ 17-ago · CORREGIDO. Antes era `(!d||d.estado==="corregir")`, o sea que una pieza marcada
       para CORREGIR se quedaba en la cola. Gerard, viendo el panel: «cuando le doy corregir con lo
       escrito, aprobado o denegado, deberia desaparecer u ocultarse, ¿no?». Y tiene razon: cuando
       el ya ha escrito la correccion, su trabajo con esa pieza esta hecho y la pelota pasa a
       nuestro lado. Dejarla ahi le ensucia la lista de lo que le falta por mirar.
       Ahora CUALQUIER decision (aprobado, denegado o corregir) la saca de la cola.
       Las que estan en `corregir` no se pierden: siguen en DATOS y en el contrato, y se ven en la
       pestaña de calendario y en el JSON — lo que cambia es que ya no cuentan como pendientes. */
    /* ⛔ 19-ago · QUITADO `paso_f1(p)`. Era: `!HAY_F1() || f1de(p)==="aprobado"`, o sea que en
       cuanto UNA sola pieza quedaba aprobada, la puerta se cerraba y solo pasaban las aprobadas.
       Medido en el panel en vivo: f1 = {pendiente: 22, aprobado: 2} -> la cola daba 0 de 24, y
       «Ver todo» imprimia «Has decidido las 24 piezas de esta vista» siendo mentira: faltaban 22,
       entre ellas las 8 de JAVI de ese mismo dia. Una fase que se activa sola porque alguien
       aprobo algo no es una fase: es una trampa. Si algun dia hace falta, que sea una bandera
       explicita en DATOS, no deducida. */
    return f1de(p)!=="denegado" && !d;});
}

    <b style="color:var(--${c.toLowerCase()})">${c}</b> ·
    ${porC[c].TOFU} TOFU · ${porC[c].MOFU} MOFU · ${porC[c].BOFU} BOFU</div>`;
  const HUECOS=[
    ["Faltan 4-6 TOFU-dolor de Javi","el reparto S1 le exige 50% TOFU y su banco de talking-head del podcast esta quemado"],

/* galeria: TODAS las slides/archivos de la pieza, con flechas (pedido Gerard 13-ago:
   "si hay un carrusel no puedo ver todas las slides") */
function mediaHTML(p,i){
  const arr=p.archivos||[], n=arr.length, a=arr[i]||{};
  const inner=a.video?`<video src="${esc(a.video)}" poster="${esc(a.poster||"")}" controls preload="none"></video>`
       :(a.poster?`<img src="${esc(a.poster)}" loading="lazy">`:'<div style="aspect-ratio:9/16;background:#000"></div>');
  const nav=n>1?`<button class="nav izq" data-n="-1">‹</button><button class="nav der" data-n="1">›</button>`
               +`<span class="cnt">${i+1}/${n}</span>`
               +`<button class="verver" data-ver="1">Ver las ${n} con música</button>`:"";
  return `<div class="med" data-i="${i}">${inner}${nav}</div>`;
}


/* REFS_PAREJA — referente declarado de cada pieza, para poder comparar al lado.
   Lo genera _SCRIPTS/panel_referente_al_lado.py resolviendo el _REFERENTE.txt de la pieza con la
   MISMA funcion que usa el gate, para que no haya dos criterios de "cual es el referente". */
let REFS_PAREJA={};
fetch("referentes.json").then(r=>r.ok?r.json():null).then(d=>{
  if(!d)return;
  (d.pares||[]).forEach(x=>{REFS_PAREJA[x.pieza]=x;});
  if(typeof render==="function")render();
}).catch(()=>{});

function refHTML(p){
  const r=REFS_PAREJA[p.id]; if(!r) return "";
  /* archivos[0] es un OBJETO {archivo,poster,video}, no un string. Meterlo crudo en el src
     pinta [object Object] y el lado "Lo nuestro" sale vacio (mismo fallo que ya se arreglo
     en vistaRepasar). Se saca .video/.archivo igual que mediaHTML. */
  const a0=(p.archivos&&p.archivos[0])||null;
  const mio=a0?(typeof a0==="string"?a0:(a0.video||a0.archivo||"")):"";
  const post=(a0&&typeof a0==="object"&&a0.poster)?a0.poster:"";
  const esVid=/\.(mp4|mov|webm)$/i.test(mio);
  const izq=r.es_video
    ? `<video src="${esc(r.ref)}" controls preload="metadata" playsinline></video>`
    : `<img src="${esc(r.ref)}" loading="lazy" alt="referente">`;
  const der=mio? (esVid
    ? `<video src="${esc(mio)}" poster="${esc(post)}" controls preload="metadata" playsinline></video>`
    : `<img src="${esc(mio)}" loading="lazy" alt="nuestra pieza">`) : "";
  return `<details class="cmp"><summary>Comparar con el referente</summary>
    <div class="cmpgrid">
      <figure><figcaption>Referente</figcaption>${izq}</figure>
      <figure><figcaption>Lo nuestro</figcaption>${der}</figure>
    </div>
    <div class="cmpnota">Mira lo mismo en los dos: tipografia, tamano de letra, donde cae el corte y cuando entra la musica. Si algo no cuadra, escribelo en Corregir.</div>
  </details>`;
}


/* FIX_RAPIDO — las 4 quejas que Javi y Jordi repiten, medidas en su WhatsApp.
   No son genericas: cada una es una queja literal suya, y las 4 son cosas que se arreglan sin
   rehacer la pieza. Escribir a mano es lo que hace que la revision se deje para manana. */
const FIX_RAPIDO=[
  ["Letra pequeña","La letra es muy pequeña, súbela"],
  ["Hook flojo","El hook no engancha, hay que cambiarlo"],
  ["Esa foto no","Esa foto no vale, usa otra"],
  ["Música aburrida","La música es aburrida, pon una viral"]
];
function fixrHTML(){
  return '<div class="fixr"><b>corrección rápida</b>'+FIX_RAPIDO.map((f,i)=>
    `<button data-fx="${i}">${f[0]}</button>`).join("")+'</div>';
}


/* ETAPA EN CRISTIANO. El equipo no piensa en TOFU/MOFU/BOFU, y nosotros mismos tenemos una regla
   que prohibe la jerga en el contenido (regla 11: la pidieron Javi y Jordi). La sigla se queda
   pequenita al lado para quien la quiera. */
const ETAPA_HUMANO={TOFU:"Para que te descubran",MOFU:"Para que te consideren",BOFU:"Para que compren"};
let RP_I=0;

function rpLista(){
  return (DATOS.piezas||[]).filter(p=>{
    if(FCUENTA!=="todo" && p.cuenta!==FCUENTA) return false;
    if(FETAPA!=="todo" && etapa(p)!==FETAPA) return false;
    /* dec() indexa por ID (`E.decisiones[id]`). Pasarle el objeto devolvia siempre
       undefined, asi que una pieza YA decidida no salia nunca de la cola de «Repasar»,
       que ademas es la pestaña por defecto. (19-ago) */
    const d=dec(p.id); return !(d&&d.estado);       /* solo lo que falta por decidir */
  });
}

function vistaRepasar(){
  const ps=rpLista();
  if(!ps.length) return filtrosHTML()+'<div class="rpfin"><div class="big">👌</div>'
    +'<h2>Nada pendiente</h2><div class="rpsub">Ya has decidido todo lo que hay con estos filtros.</div></div>';
  if(RP_I>=ps.length) RP_I=ps.length-1;
  if(RP_I<0) RP_I=0;
  const p=ps[RP_I], d=dec(p.id), et=etapa(p);   /* dec() indexa por ID, no por objeto (19-ago) */
  /* archivos[0] es un OBJETO {archivo,poster,video} (no un string): hay que sacar .video,
     igual que hace cardHTML. Antes se metia el objeto crudo -> [object Object] -> nada se veia. */
  const a0=(p.archivos&&p.archivos[0])||null;
  const src=a0?(typeof a0==="string"?a0:(a0.video||a0.archivo||"")):"";
  const post=(a0&&typeof a0==="object"&&a0.poster)?a0.poster:"";
  const esVid=/\.(mp4|mov|webm)$/i.test(src);
  const media = src
    ? (esVid?`<video src="${src}" poster="${esc(post)}" controls preload="metadata" playsinline></video>`
            :`<img src="${src}" alt="">`)
    : '<div style="padding:60px;color:#666">sin vista previa</div>';
  const pct=Math.round((RP_I)/ps.length*100);

  return filtrosHTML()+`<div class="rp">
    <div class="rphead">
      <span class="rpprog">${RP_I+1} de ${ps.length}</span>
      <span class="rpbar"><i style="width:${pct}%"></i></span>
    </div>
    <div class="rpmed">${media}</div>
    <div class="rptit">${esc(p.id)}</div>
    <div class="rpsub">${esc(p.cuenta||"")} · ${esc(p.tipo||"")} · ${ETAPA_HUMANO[et]||et}
      <span class="sig">(${et})</span>${p.dur_s?" · "+p.dur_s+"s":""}</div>

    <div class="rpacc">
      <button class="ok ${d&&d.estado==="aprobado"?"sel":""}" data-rp="aprobado">Aprobar</button>
      <button class="fix ${d&&d.estado==="corregir"?"sel":""}" data-rp="corregir">Corregir</button>
      <button class="no ${d&&d.estado==="denegado"?"sel":""}" data-rp="denegado">Denegar</button>
    </div>

    ${(REFS_PAREJA&&REFS_PAREJA[p.id])?`<details><summary>Comparar con el referente</summary>
      <div class="cont">${refHTML(p).replace(/^<details[^>]*>.*?<\/summary>/,'').replace(/<\/details>$/,'')}</div></details>`:""}

    <details><summary>Qué se publica con esto</summary>
      <div class="cont">${esc(p.caption||"(sin caption)")}</div></details>

    ${p.porque?`<details><summary>Por qué esta pieza</summary>
      <div class="cont">${esc(p.porque)}</div></details>`:""}

    <details ${d&&d.estado==="corregir"?"open":""}><summary>Escribir una corrección</summary>
      <div class="cont">${fixrHTML()}
        <textarea class="motivo" style="width:100%;margin-top:8px" placeholder="¿Qué está mal? Escríbelo tal cual — esto es lo que leo yo para no repetirlo.">${esc(d&&d.motivo||"")}</textarea>
      </div></details>

    <div class="rpnav">
      <button data-rpnav="-1">← Anterior</button>
      <button data-rpnav="1">Saltar →</button>
    </div>
    <div class="rptecla">← → para moverte · 1 aprobar · 2 corregir · 3 denegar</div>
  </div>`;
}

function cardHTML(p){
  const d=dec(p.id);
  return `<div class="card" data-id="${esc(p.id)}">${mediaHTML(p,0)}<div class="b">
      <div class="tit">${esc(p.id)}</div>
      <div class="meta"><span class="tag cuenta">${esc(p.cuenta||"")}</span>
        <span class="tag tipo">${esc(p.tipo||"")}</span>
        <span class="tag ${etapa(p)}">${etapa(p)}</span>
        ${p.dur_s?`<span class="tag tipo">${p.dur_s}s</span>`:""}
        ${(p.archivos||[]).length>1?`<span class="tag tipo">${p.archivos.length} slides</span>`:""}
        ${(()=>{const n=Object.keys((d&&d.motivo_slides)||{}).length;
                return n?`<span class="nslides">${n} slide${n>1?"s":""} con corrección</span>`:"";})()}</div>
      ${p.porque?`<div class="porque">${esc(p.porque).replace(/«([^»]*)»/,'<span class="q">«$1»</span>')}</div>`:""}
      <div class="cap">${esc(p.caption||"")}</div>
      ${refHTML(p)}
      <div class="acc">
        <button class="ok ${d&&d.estado==="aprobado"?"sel":""}" data-a="aprobado">Aprobar</button>
        <button class="fix ${d&&d.estado==="corregir"?"sel":""}" data-a="corregir">Corregir</button>
        <button class="no ${d&&d.estado==="denegado"?"sel":""}" data-a="denegado">Denegar</button>
      </div>
      ${fixrHTML()}
      <textarea class="motivo" placeholder="¿Qué está mal? Escríbelo tal cual — esto es lo que leo yo para no repetirlo. Ej: «el hook es muy corto», «la letra pequeña», «esa foto no»">${esc(d&&d.motivo||"")}</textarea>
    </div></div>`;
}

/* agrupado por etapa (pedido Gerard 13-ago: "organizado por el contenido, que es tofu, mofu…") */
const SECCIONES=[["TOFU","TOFU · problema / dolor"],["MOFU","MOFU · solución"],
                 ["BOFU","BOFU · mentalidad / casos"],["SIN","Sin etapa asignada"]];
function vistaRevisar(){
  const ps=pendientes().filter(p=>FETAPA==="todo"||etapa(p)===FETAPA);
  const total=(DATOS.piezas||[]).filter(p=>FCUENTA==="todo"||p.cuenta===FCUENTA).length;
  const hechas=Math.max(0,total-ps.length);
  const explica='<div class="comovva">'
    +'<div><b>Aprobar</b> — vale, y se coloca sola en el calendario.</div>'
    +'<div><b>Corregir</b> — escribe qué está mal. Lo arreglo yo, tú no tocas nada.</div>'
    +'<div><b>Denegar</b> — no sirve: se retira y se limpia del ordenador.</div>'
    +'<div style="color:#8b8b9c;margin-top:8px">Decide el primero que entre. Una pieza, un voto.</div>'
    +'</div>';
  if(!ps.length) return filtrosHTML()+'<div class="terminado"><div class="big">👌</div>'
    +'<h2>No queda nada por revisar</h2><p>Has decidido las '+total+' piezas de esta vista.</p></div>';

  if(MODO==="cuadricula"){
    let h=explica+filtrosHTML()
      +'<button class="vermodo" data-modo="foco">Revisar de una en una (más rápido en el móvil)</button>';
    for(const [clave,titulo] of SECCIONES){
      const grupo=ps.filter(p=>etapa(p)===clave);
      if(!grupo.length)continue;
      h+=`<div class="sec"><span class="tag ${clave}">${clave}</span><h2>${titulo}</h2><button class="secacc" data-sec="${clave}">Aprobar toda esta sección</button>`
        +`<span class="n">${grupo.length}</span><span class="lin"></span></div>`;
      h+='<div class="grid">'+grupo.map(cardHTML).join("")+'</div>';
    }
    return h;
  }

  if(IDX>=ps.length)IDX=ps.length-1;
  if(IDX<0)IDX=0;
  const p=ps[IDX];
  const pct=total?Math.round(hechas*100/total):0;
  return explica+filtrosHTML()
    +'<div class="foco">'
    +`<div class="avance"><b>${hechas}</b> de ${total} decididas`
    +`<span class="resto">quedan ${ps.length}</span></div>`
    +`<div class="barra"><i style="width:${pct}%"></i></div>`
    +cardHTML(p)
    +`<div class="pasos">`
    +`<button data-paso="-1" ${IDX===0?"disabled":""}>‹ Anterior</button>`
    +`<button data-paso="1" ${IDX>=ps.length-1?"disabled":""}>Saltar ›</button></div>`
    +'<button class="vermodo" data-modo="cuadricula">Ver todas en cuadrícula</button>'
    +'</div>';
}

/* ---------- HOY: la unica pantalla que hace falta para publicar ----------
   POR QUE EXISTE. El cuello de botella medido NO es producir: es PUBLICAR. Hay decenas de piezas
   en PASS sin subir, y el 5-ago se prometieron 3 posts y se publico 1. El panel enseñaba "todo lo
   de la semana", que para el momento de subir es demasiado: hay que buscar cual toca, abrir la
   ficha, copiar el caption. Esta vista deja UNA lista: lo de hoy, en su hora, con el caption a un
   toque. Regla 25 de Jordi: se sube entre 19:00 y 20:00 (sabado libre). */
function hoyEtiqueta(){
  const d=new Date(), ab=["dom","lun","mar","mié","jue","vie","sáb"];
  return ab[d.getDay()]+" "+d.getDate();
}
function deHoy(){
  /* p.dia llega en DOS formatos a la vez (medido 20-ago): etiqueta «mié 19» en las piezas del
     plan viejo e ISO «2026-08-20» en las que coloca calendario_auto.py. Compararlo solo contra
     la etiqueta dejaba la pestaña Hoy VACIA teniendo pieza programada, y encima el vacio
     acusaba al equipo («la semana no esta preparada»). Se aceptan los dos. */
  const et=hoyEtiqueta();
  const d=new Date();
  const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return (DATOS.piezas||[]).filter(p=>{const v=(p.dia||"");return v===et||v===iso;});
}
function vistaHoy(){
  const et=hoyEtiqueta(), lista=deHoy();
  let h='<div class="nota">Lo que toca subir <b>hoy ('+esc(et)+')</b>. La hora sale de la regla de '
       +'Jordi: <b>entre 19:00 y 20:00</b>, el sábado da igual. Copia el caption y súbelo.</div>';
  if(!lista.length){
    return h+'<div class="vacio">Hoy no hay nada programado.<br>'
      +'<span style="font-size:12px;color:#8b8b9c">Si esto sale vacío un día entre semana, '
      +'la semana no está preparada — es la regla 32.</span></div>';
  }
  const cuentas=FCUENTA==="todo"?["JAVI","JORDI"]:[FCUENTA];
  h+=filtrosHTML();
  for(const c of cuentas){
    const ps=lista.filter(p=>(p.cuenta||"")===c);
    if(!ps.length){
      h+='<h2 style="font-size:15px;margin:18px 0 7px">'+c
        +'<span style="font-weight:400;color:#c98b8b;font-size:12px"> · sin pieza para hoy</span></h2>';
      continue;
    }
    h+='<h2 style="font-size:15px;margin:18px 0 7px">'+c
      +'<span style="font-weight:400;color:#8b8b9c;font-size:12px"> · '+ps.length+' pieza(s)</span></h2>';
    ps.forEach((p,i)=>{
      const po=(p.archivos&&p.archivos[0]&&p.archivos[0].poster)||"";
      const est=f1de(p);
      const col=est==="aprobado"?"#3ECF8E":(est==="denegado"?"#c96b6b":"#8b8b9c");
      h+='<div style="display:flex;gap:11px;align-items:flex-start;padding:11px;margin-bottom:9px;'
        +'background:#141420;border:1px solid #23233a;border-radius:11px">'
        +(po?'<img src="'+esc(po)+'" style="width:66px;height:88px;object-fit:cover;'
             +'border-radius:7px;flex:0 0 auto">':'')
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:12px;color:#8b8b9c;margin-bottom:3px">'
        +'<b style="color:#e7e7f0">'+esc(p.hora||"19:30")+'</b> · '+esc(p.tipo||"")+' · '
        +'<span style="color:'+col+'">'+esc(est||"pendiente")+'</span> · '+esc(p.etiqueta||"SIN")+'</div>'
        +'<div style="font-size:13.5px;margin-bottom:6px">'+esc(p.id)+'</div>'
        +'<textarea readonly id="cap_'+esc(c)+'_'+i+'" style="width:100%;height:76px;font-size:12px;'
        +'background:#0e0e18;color:#c9c9d8;border:1px solid #23233a;border-radius:7px;padding:7px">'
        +esc(p.caption||"")+'</textarea>'
        +'<button class="copiacap" data-cap="cap_'+esc(c)+'_'+i+'" '
        +'style="margin-top:6px;font-size:12px">Copiar caption</button>'
        +'</div></div>';
    });
  }
  return h;
}

/* ---------- GUIONES PARA GRABAR (v2, 17-ago) ----------
   Sustituye a la lista de extractos del podcast, que era un mapa para CORTAR y no servia para
   grabar. Gerard: "mas detallado, por colores, separado escena de guion musica".
   Los 5 bloques y sus colores son la estructura de Ramiro Cubria, que es de donde sale la
   estrategia de Santi: ATENCION / PROBLEMA / SOLUCION / PRUEBA SOCIAL / CTA. */
const COLOR_BLOQUE = {
  "ATENCION":      {c:"#ff6b6b", f:"rgba(255,107,107,.10)", n:"1 · ATENCIÓN", d:"rompe el scroll"},
  "PROBLEMA":      {c:"#ffb020", f:"rgba(255,176,32,.10)",  n:"2 · PROBLEMA", d:"baja al barro, comportamientos concretos"},
  "SOLUCION":      {c:"#3ECF8E", f:"rgba(62,207,142,.10)",  n:"3 · SOLUCIÓN", d:"un paradigma, NO el paso a paso"},
  "PRUEBA SOCIAL": {c:"#5B9DFF", f:"rgba(91,157,255,.10)",  n:"4 · PRUEBA SOCIAL", d:"resultado real y medible"},
  "CTA":           {c:"#c58bff", f:"rgba(197,139,255,.10)", n:"5 · CTA", d:"recurso nombrado, sin prometer privado"},
};

function guionesParaGrabar(){
  return (typeof GUIONES_GRABAR !== "undefined" && GUIONES_GRABAR.length) ? GUIONES_GRABAR : [];
}

function fichaGuion(g){
  const e = g.escena || {};
  const acento = (g.cuenta === "JORDI") ? "#5B9DFF" : "#3ECF8E";
  let h = '<div style="border:1px solid #23233a;border-left:3px solid '+acento+';border-radius:12px;'
        + 'background:#12121c;padding:14px;margin-bottom:14px">';
  h += '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px">'
     + '<b style="font-size:15px">'+esc(g.titulo||g.id)+'</b>'
     + '<span style="font-size:11px;color:'+acento+';border:1px solid '+acento+'44;'
     + 'padding:2px 7px;border-radius:20px">'+esc(g.cuenta||"")+'</span>'
     + '<span style="font-size:11px;color:#8b8b9c;border:1px solid #23233a;padding:2px 7px;'
     + 'border-radius:20px">'+esc(g.etapa||"")+'</span>'
     + '<span style="font-size:11px;color:#8b8b9c">'+(g.duracion_s||0)+' s</span>'
     + '</div>';
  if(g.formula) h += '<div style="font-size:11.5px;color:#8b8b9c;margin-bottom:10px">fórmula: '
                   + esc(g.formula)+'</div>';

  /* ESCENA */
  h += '<div style="background:#0e0e18;border:1px solid #23233a;border-radius:9px;padding:10px;'
     + 'margin-bottom:10px">'
     + '<div style="font-size:10.5px;letter-spacing:.9px;color:#8b8b9c;margin-bottom:6px">ESCENA — '
     + 'qué se graba</div><div style="font-size:13px;line-height:1.6">'
     + (e.donde ? '<b>Dónde:</b> '+esc(e.donde)+'<br>' : '')
     + (e.plano ? '<b>Plano:</b> '+esc(e.plano)+'<br>' : '')
     + (e.que_se_ve ? '<b>Se ve:</b> '+esc(e.que_se_ve)+'<br>' : '')
     + (e.atrezzo ? '<b>Objeto en mano:</b> '+esc(e.atrezzo) : '')
     + '</div></div>';

  /* GUION por bloques */
  h += '<div style="font-size:10.5px;letter-spacing:.9px;color:#8b8b9c;margin:12px 0 7px">'
     + 'GUIÓN — lo que dice, en orden</div>';
  (g.bloques||[]).forEach(b=>{
    const k = COLOR_BLOQUE[b.bloque] || {c:"#8b8b9c",f:"transparent",n:b.bloque,d:""};
    h += '<div style="border-left:3px solid '+k.c+';background:'+k.f+';padding:9px 11px;'
       + 'border-radius:0 8px 8px 0;margin-bottom:7px">'
       + '<div style="font-size:10.5px;color:'+k.c+';letter-spacing:.6px;margin-bottom:4px">'
       + k.n+' <span style="color:#8b8b9c;letter-spacing:0">· '+k.d+'</span>'
       + '<span style="float:right;color:#8b8b9c">'+(b.segundos||0)+' s</span></div>'
       + '<div style="font-size:13.5px;line-height:1.62">'+esc(b.texto||"")+'</div>'
       + (b.nota_direccion ? '<div style="font-size:11.5px;color:#8b8b9c;margin-top:5px;'
          + 'font-style:italic">'+esc(b.nota_direccion)+'</div>' : '')
       + '</div>';
  });

  /* MUSICA + rotulo + caption */
  h += '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:11px">';
  h += '<div style="flex:1;min-width:190px;background:#0e0e18;border:1px solid #23233a;'
     + 'border-radius:9px;padding:9px"><div style="font-size:10.5px;letter-spacing:.9px;'
     + 'color:#8b8b9c;margin-bottom:5px">MÚSICA</div>'
     + '<div style="font-size:12.5px">'+esc(g.musica||"sin música")+'</div></div>';
  if(g.texto_en_pantalla)
    h += '<div style="flex:1;min-width:190px;background:#0e0e18;border:1px solid #23233a;'
       + 'border-radius:9px;padding:9px"><div style="font-size:10.5px;letter-spacing:.9px;'
       + 'color:#8b8b9c;margin-bottom:5px">RÓTULO EN PANTALLA</div>'
       + '<div style="font-size:12.5px">'+esc(g.texto_en_pantalla)+'</div></div>';
  h += '</div>';
  if(g.caption)
    h += '<details style="margin-top:9px"><summary style="font-size:11.5px;color:#8b8b9c;'
       + 'cursor:pointer">Caption</summary><div style="font-size:12.5px;white-space:pre-wrap;'
       + 'margin-top:6px;color:#c9c9d8">'+esc(g.caption)+'</div></details>';
  return h + '</div>';
}

function vistaGuionesGrabar(){
  const gs = guionesParaGrabar();
  let h = '<div class="nota">Lo que <b>Javi y Jordi tienen que grabar</b>. Cada ficha trae la '
        + '<b>escena</b> (qué se graba), el <b>guión</b> por bloques de color con el texto literal '
        + 'y sus segundos, y la <b>música</b>. Se lee y se graba, sin preguntar nada.</div>';
  if(!gs.length){
    return h + '<div class="vacio">Todavía no hay guiones cargados.<br>'
      + '<span style="font-size:12px;color:#8b8b9c">En el PC: '
      + '<code>python _SCRIPTS/guiones_grabar_publica.py</code></span></div>';
  }
  h += filtrosHTML();
  const cuentas = FCUENTA === "todo" ? ["JAVI","JORDI"] : [FCUENTA];
  for(const c of cuentas){
    const míos = gs.filter(g => (g.cuenta||"") === c);
    if(!míos.length) continue;
    const seg = míos.reduce((a,g)=>a+(g.duracion_s||0),0);
    h += '<h2 style="font-size:15px;margin:18px 0 9px">'+c
       + '<span style="font-weight:400;color:#8b8b9c;font-size:12px"> · '+míos.length
       + ' guiones · '+Math.round(seg/60)+' min de grabación</span></h2>';
    ["TOFU","MOFU","BOFU"].forEach(et=>{
      const ge = míos.filter(g=>g.etapa===et);
      if(!ge.length) return;
      h += '<div style="font-size:11px;color:#8b8b9c;letter-spacing:.9px;margin:12px 0 7px">'
         + et+' · '+ge.length+'</div>';
      ge.forEach(g=> h += fichaGuion(g));
    });
  }
  return h;
}

function vistaCalendario(){
  const cs=(CAL_AUTO&&CAL_AUTO.cuentas)||null;
  let h='<div class="nota">Solo entra aquí lo que <b>Gerard aprobó</b>. Se coloca solo: 3 al día '
       +'con el formato que toca según Santi, reparto 50/30/20 y <b>nunca 3 piezas de la misma '
       +'etapa el mismo día ni 2 Lead Magnets seguidos</b>. Lo que votéis aquí no mueve el '
       +'calendario: confirma o tumba el hueco.</div>'+filtrosHTML();
  if(!cs)return h+'<div class="vacio">Calendario sin generar. En el PC: '
                 +'<code>python _SCRIPTS/calendario_auto.py</code></div>';
  h+=`<div class="nota" style="font-size:11.5px">plan del ${esc(CAL_AUTO.generado||"")} · desde `
    +`${esc(CAL_AUTO.desde||"")} · ${CAL_AUTO.dias||7} días</div>`;
  if(CAL_AUTO.modo_f1==="todas")h+='<div class="alerta">⚠ SIMULACIÓN: este reparto usa el '
    +'catálogo entero porque Gerard todavía no ha pasado su filtro. Cuando lo pase, el plan se '
    +'rehace solo con lo aprobado.</div>';
  const cuentas=FCUENTA==="todo"?["JAVI","JORDI"]:[FCUENTA];
  for(const c of cuentas){
    const d=cs[c]; if(!d)continue;
    const r=d.reparto||{}, n=(r.TOFU||0)+(r.MOFU||0)+(r.BOFU||0)+(r.SIN||0)||1;
    const pc=e=>Math.round(100*(r[e]||0)/n);
    h+=`<h2 style="font-size:15px;margin:18px 0 7px">${c}`
      +`<span style="font-weight:400;color:#8b8b9c;font-size:12px"> · ${n} colocadas · `
      +`TOFU ${pc("TOFU")}% / MOFU ${pc("MOFU")}% / BOFU ${pc("BOFU")}%</span></h2>`;
    (d.violaciones||[]).forEach(v=>h+=`<div class="alerta">⛔ ${esc(v)}</div>`);
    if(d.lm>d.techo_lm)h+=`<div class="alerta">⚠ ${d.lm} de ${d.feed} piezas piden un recurso por `
      +`DM. Sin 2 seguidos caben ${d.techo_lm}: el resto sobra siempre.</div>`;
    const fechas=[...new Set([...(d.colocadas||[]),...(d.vacios||[])].map(x=>x.fecha))].sort();
    for(const f of fechas){
      const dia=((d.colocadas||[]).concat(d.vacios||[]).find(x=>x.fecha===f)||{}).dia||"";
      h+=`<div class="dia"><h3>${esc(dia)} ${esc(f)}</h3><div class="slots">`;
      for(let s=0;s<3;s++){
        const c1=(d.colocadas||[]).find(x=>x.fecha===f&&x.slot===s);
        const v1=(d.vacios||[]).find(x=>x.fecha===f&&x.slot===s);
        const fmt=(c1||v1||{}).formato_santi||(v1||{}).formato||"";
        const sm=(c1||v1||{}).sin_motor?' <span style="color:#e8a500">⚠sin motor</span>':"";
        if(c1){
          const dd=dec(c1.id);
          const est=dd?({aprobado:"✅ visto bueno",denegado:"⛔ tumbada",
                          corregir:"✏️ a corregir"}[dd.estado]||""):"";
          h+=`<div class="slot lleno"><div class="fmt">${esc(fmt)}${sm}</div>`
            +`<b>${esc(c1.id)}</b><br><span class="tag ${esc(c1.etapa)}">${esc(c1.etapa)}</span>`
            +(c1.lead_magnet?' <span class="tag tipo">LM</span>':"")
            +(c1.encaje==="exacto"?"":` <span class="tag tipo">${esc(c1.formato)}</span>`)
            +(est?`<div style="font-size:11px;color:#8b8b9c;margin-top:4px">${est}</div>`:"")
            +`</div>`;
        }else{
          h+=`<div class="slot"><div class="fmt">${esc(fmt)}${sm}</div>`
            +`<span style="color:#5f5f70">— libre —</span>`
            +`<div style="font-size:10.5px;color:#8b8b9c;margin-top:3px">`
            +`${esc((v1||{}).motivo||"")}</div></div>`;
        }
      }
      h+='</div></div>';
    }
    if((d.sin_colocar||[]).length)
      h+=`<div class="nota" style="font-size:11.5px">Sin hueco esta semana (${d.sin_colocar.length}): `
        +`${esc(d.sin_colocar.join(", "))}</div>`;
  }
  return h;
}
