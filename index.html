<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mentorium · Panel del equipo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0d0c;--card:#141816;--card2:#1b211e;--bd:#2a322e;--tx:#f2f5f3;--dim:#93a29b;
      --javi:#3ECF8E;--jordi:#5B9DFF;--am:#FFE400;--ok:#2fbf71;--no:#e0504f;--duda:#e8a33d}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);
     color:var(--tx);font-size:15px;line-height:1.45;padding-bottom:86px}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;
       justify-content:center;padding:22px}
#login .box{max-width:400px;width:100%;text-align:center}
#login h1{font-size:23px;font-weight:800;margin-bottom:6px}
#login p{color:var(--dim);font-size:14px;margin-bottom:22px}
#login input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);
             background:var(--card);color:var(--tx);text-align:center;font-size:16px;margin-bottom:16px}
.quien{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.quien button{padding:15px 10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);
              font-weight:700;font-size:15px}
.quien button:active{background:var(--card2)}
.err{color:var(--no);font-size:13.5px;min-height:19px;margin-top:10px}
/* ---------- BARRA SUPERIOR ---------- */
header{position:sticky;top:0;z-index:20;background:#0b0d0cf2;backdrop-filter:blur(9px);
       border-bottom:1px solid var(--bd)}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 14px;max-width:900px;margin:0 auto}
.hrow .tit{font-weight:800;font-size:15.5px;flex:1;min-width:0;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
.yo{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);
    border-radius:99px;padding:5px 7px 5px 12px;font-size:13px;font-weight:700;flex:none}
.yo small{color:var(--dim);font-weight:500}
.yo .out{background:var(--card2);border-radius:99px;width:25px;height:25px;font-size:14px;
         display:grid;place-items:center;color:var(--dim)}
/* ---------- PESTAÑAS ---------- */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b0d0cf7;
         backdrop-filter:blur(9px);border-top:1px solid var(--bd);
         padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;max-width:900px;margin:0 auto;gap:2px}
nav.tabs button{flex:1;padding:8px 2px;border-radius:11px;color:var(--dim);font-size:10.5px;
                font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button b{font-size:17px;font-weight:400;line-height:1}
nav.tabs button.on{color:var(--tx);background:var(--card2)}
nav.tabs .badge{position:absolute;transform:translate(15px,-4px);background:var(--no);
                border-radius:99px;font-size:9px;padding:1px 5px;font-weight:800;color:#fff}
/* ---------- FILTROS ---------- */
.filtros{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros button{padding:7px 15px;border-radius:99px;background:var(--card);
                border:1px solid var(--bd);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.filtros button.on{background:var(--tx);color:#0b0d0c;border-color:var(--tx)}
/* ---------- DIA / PIEZA ---------- */
.dia{margin:16px 0 0;border:1px solid var(--bd);border-radius:15px;overflow:hidden;background:var(--card)}
.dia>summary{padding:14px 16px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;
             align-items:center;cursor:pointer;list-style:none}
.dia>summary::-webkit-details-marker{display:none}
.dia>summary i{font-style:normal;color:var(--dim);font-size:12.5px;font-weight:600}
.dia .cuerpo{padding:0 12px 12px}
.pieza{background:var(--card2);border:1px solid var(--bd);border-radius:13px;padding:13px;margin-bottom:11px}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.4px}
.tag.JAVI{background:var(--javi);color:#04150d}.tag.JORDI{background:var(--jordi);color:#03142c}
.tag.tipo{background:#2b332f;color:var(--dim)}
.pieza .nom{font-weight:700;font-size:13.5px;flex:1;min-width:120px}
.tira{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.slot{flex:none;width:132px}
.slot video,.slot img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:9px;
                      background:#000;display:block}
.slot .sv{display:flex;gap:4px;margin-top:4px}
.slot .sv button{flex:1;padding:4px;border-radius:7px;background:#242c28;font-size:12px;
                 border:1px solid transparent}
.slot .sv button.on.ok{background:var(--ok);color:#04150d;font-weight:800}
.slot .sv button.on.no{background:var(--no);color:#fff;font-weight:800}
.cap{color:var(--dim);font-size:12.5px;margin:9px 0;white-space:pre-wrap;max-height:78px;overflow:hidden}
.cap.abierto{max-height:none}
.mas{color:var(--javi);font-size:12px;font-weight:700}
.votos{display:flex;gap:7px;margin-top:10px}
.votos button{flex:1;padding:11px;border-radius:10px;background:#242c28;font-weight:800;font-size:13.5px}
.votos button.on.si{background:var(--ok);color:#04150d}
.votos button.on.duda{background:var(--duda);color:#231703}
.votos button.on.no{background:var(--no);color:#fff}
.quienes{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.quienes span{font-size:10.5px;padding:2px 7px;border-radius:99px;background:#242c28;color:var(--dim)}
.quienes span.si{background:#123d29;color:#7ee2ab}.quienes span.no{background:#42191b;color:#ffb1b0}
.quienes span.duda{background:#3d2f11;color:#f2cf8a}
.nota{width:100%;margin-top:9px;padding:9px 11px;border-radius:9px;background:#0f1412;
      border:1px solid var(--bd);color:var(--tx);font-size:13px;resize:vertical;min-height:38px}
/* ---------- CALENDARIO ---------- */
.calgrid{display:grid;gap:9px;margin-top:14px}
.calfila{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px}
.calfila h4{font-size:13px;margin-bottom:9px;display:flex;gap:8px;align-items:center}
.calslot{font-size:12.5px;color:var(--dim);padding:6px 0;border-top:1px solid var(--bd);
         display:flex;gap:8px}
.calslot b{color:var(--tx);font-weight:700;flex:none;width:58px;font-size:11px}
.estado{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;flex:none;height:16px}
.estado.P{background:#123d29;color:#7ee2ab}.estado.A{background:#42311b;color:#ffcf8a}
.estado.S{background:#2b2b42;color:#b9b9ff}.estado.G{background:#3d2f11;color:#f2cf8a}
.estado.B{background:#42191b;color:#ffb1b0}
/* ---------- TAREAS ---------- */
.nuevo{display:flex;gap:8px;margin:14px 0}
.nuevo input{flex:1;padding:12px;border-radius:11px;background:var(--card);
             border:1px solid var(--bd);color:var(--tx);font-size:14px}
.nuevo button{padding:12px 18px;border-radius:11px;background:var(--javi);color:#04150d;font-weight:800}
.tarea{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;
       margin-bottom:9px;display:flex;gap:11px;align-items:flex-start}
.tarea .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--bd);flex:none;
            display:grid;place-items:center;font-size:14px;color:transparent}
.tarea.hecha .chk{background:var(--ok);border-color:var(--ok);color:#04150d}
.tarea.hecha .txt{text-decoration:line-through;color:var(--dim)}
.tarea .txt{flex:1;font-size:14px}
.tarea .quien2{font-size:11px;color:var(--dim);margin-top:3px}
.tarea .del{color:var(--dim);font-size:18px;padding:0 4px}
/* ---------- ARCHIVOS / CRITERIO ---------- */
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:9px}
.item a{color:var(--javi);text-decoration:none;font-weight:700;font-size:14px;word-break:break-all}
.item .sub{color:var(--dim);font-size:12px;margin-top:4px}
.crit{border-left:3px solid var(--am)}
.crit b{display:block;font-size:14px;margin-bottom:4px}
.crit .de{font-size:11px;color:var(--am);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.buscador{width:100%;padding:12px;border-radius:11px;background:var(--card);border:1px solid var(--bd);
          color:var(--tx);font-size:14px;margin:14px 0}
/* ---------- COMUNES ---------- */
h2.sec{font-size:19px;font-weight:800;margin:18px 0 2px}
p.secsub{color:var(--dim);font-size:13px;margin-bottom:4px}
.vacio{color:var(--dim);font-size:13.5px;text-align:center;padding:34px 18px;line-height:1.6}
.sync{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;background:#1b211e;
      border:1px solid var(--bd);border-radius:99px;padding:7px 16px;font-size:12px;color:var(--dim);
      opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.sync.ver{opacity:1}.sync.mal{border-color:var(--no);color:#ffb1b0}
.oculto{display:none!important}
</style></head><body>

<div id="login"><div class="box">
  <h1>Panel del equipo</h1>
  <p>Semana <span id="lsem"></span> · di quién eres para que tus votos vayan a tu nombre</p>
  <input id="lclave" type="password" placeholder="clave" autocomplete="off" inputmode="text">
  <div class="quien" id="lquien"></div>
  <div class="err" id="lerr"></div>
</div></div>

<header><div class="hrow">
  <span class="tit" id="htit">Contenido</span>
  <div class="yo"><span id="hyo"></span><small id="hcnt"></small>
    <button class="out" id="hout" title="Cambiar de usuario">⎋</button></div>
</div></header>

<main class="wrap">
  <section id="t-contenido"></section>
  <section id="t-calendario" class="oculto"></section>
  <section id="t-tareas" class="oculto"></section>
  <section id="t-archivos" class="oculto"></section>
  <section id="t-criterio" class="oculto"></section>
  <section id="t-aportes" class="oculto"></section>
</main>

<div class="sync" id="sync"></div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
const DATOS={"generado": "2026-08-10", "semana": "11-17 agosto", "dias": ["lun 11", "mar 12", "mié 13", "jue 14", "vie 15", "sáb 16", "dom 17"], "piezas": [{"id": "W_JAVI_FRACASO_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "lun 11", "caption": "Mi primera tienda: 3.000 invertidos, cero ventas. Ahí empezó todo.\n\n#ecommerce #mentalidad #negocios\n", "archivos": [{"archivo": "W_JAVI_FRACASO.mp4", "poster": "media/W_JAVI_FRACASO_8AGO__00.jpg", "video": "media/W_JAVI_FRACASO_8AGO__00.mp4", "peso_mb": 14.9}]}, {"id": "V_JAVI_HOOKAD_SINMATI_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "lun 11", "caption": "Facturar no es ganar. Los que salen en este video ya lo aprendieron — y por eso sus tiendas aguantan.\n\nDel último evento: alumnos reales contando lo que cambió.\n\nComenta CASH y te paso la auditoría que usamos.\n\n#ecommerce #negocios #emprender\n", "archivos": [{"archivo": "V_JAVI_HOOKAD_SINMATI.mp4", "poster": "media/V_JAVI_HOOKAD_SINMATI_8AGO__00.jpg", "video": "media/V_JAVI_HOOKAD_SINMATI_8AGO__00.mp4", "peso_mb": 21.18}]}, {"id": "CARR_JAVI_PANEL_8AGO", "cuenta": "JAVI", "tipo": "carrusel", "dia": "lun 11", "caption": "El panel de un alumno, tal cual. Sin recortes raros y sin maquillar.\n\nLlegó con tráfico y pocas ventas. Lo de siempre: la tienda no convertía.\n\nEl cambio: ✅ números claros cada día ✅ arreglar la tienda ANTES de meter más dinero en ads ✅ alguien delante que ya pasó por ahí\n\nEl mérito es suyo: ejecutó sin excusas.\n\nLa captura es de su panel real — la cifra la ves en la imagen, no te la escribo yo.\n\nComenta PANEL y te enseño por dónde se empieza. #ecommerce #negocios #casoreal\n", "archivos": [{"archivo": "s01.png", "poster": "media/CARR_JAVI_PANEL_8AGO__i00.png"}, {"archivo": "s02.png", "poster": "media/CARR_JAVI_PANEL_8AGO__i01.png"}, {"archivo": "s03.png", "poster": "media/CARR_JAVI_PANEL_8AGO__i02.png"}]}, {"id": "STORIES_JAVI_FREESTYLE_2AGO", "cuenta": "JAVI", "tipo": "story", "dia": "lun 11", "caption": "(stories — sin caption; el CTA va en J4: «Responde ORDEN» → Auditor de Tienda y Checkout, gratis)\nOrden de publicación: J1 (sábado 8:33) → J2 (la flecha) → J3 (el grupo) → J4 (recurso).\nMisma palabra ORDEN que el carrusel de hoy: un solo embudo.\n", "archivos": [{"archivo": "J1_sabado_833.jpg", "poster": "media/STORIES_JAVI_FREESTYLE_2AGO__i00.jpg"}, {"archivo": "J2_flecha.jpg", "poster": "media/STORIES_JAVI_FREESTYLE_2AGO__i01.jpg"}, {"archivo": "J3_grupo.jpg", "poster": "media/STORIES_JAVI_FREESTYLE_2AGO__i02.jpg"}, {"archivo": "J4_recurso.jpg", "poster": "media/STORIES_JAVI_FREESTYLE_2AGO__i03.jpg"}]}, {"id": "W_JAVI_CRITICAS_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "mar 12", "caption": "Opinar desde fuera es gratis. Emprender, no.\n\n#ecommerce #mentalidad #negocios\n", "archivos": [{"archivo": "W_JAVI_CRITICAS.mp4", "poster": "media/W_JAVI_CRITICAS_8AGO__00.jpg", "video": "media/W_JAVI_CRITICAS_8AGO__00.mp4", "peso_mb": 8.91}]}, {"id": "REEL_JAVI_QA21_V2", "cuenta": "JAVI", "tipo": "reel", "dia": "mar 12", "caption": "\"No venimos de ser programadores\"\n\n#ecommerce #mentoria #emprender\n", "archivos": [{"archivo": "REEL_JAVI_QA21_V2.mp4", "poster": "media/REEL_JAVI_QA21_V2__00.jpg", "video": "media/REEL_JAVI_QA21_V2__00.mp4", "peso_mb": 48.22}]}, {"id": "CARRUSEL_CLON_JAVI_OFERTA_2AGO", "cuenta": "JAVI", "tipo": "carrusel", "dia": "mar 12", "caption": "Te entran visitas y no te compran. Y lo primero que hace todo el mundo es cambiar de producto.\n\nCasi nunca es el producto. Es la oferta. Y la oferta son tres cosas.\n\n1. Precio. No se copia del de al lado. Se pone sabiendo qué te deja cada venta y qué aguanta tu\nmercado.\n\n2. Envío. El envío gratis no es gratis: sale de tu margen. O lo aguanta el pedido medio, o te lo\nestás pagando tú.\n\n3. Ticket. Con el mismo tráfico puedes cobrar más por pedido. Un complemento que encaje, no un\ndescuento: el descuento sale del mismo sitio.\n\nLas herramientas que salen en el carrusel son las que uso yo para mirar esto.\n\nComenta OFERTA y te digo cuál de los tres tocaría primero en tu tienda.\n\n#ecommerce #shopify #ventas\n", "archivos": [{"archivo": "slide_01.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__00.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__00.mp4", "peso_mb": 2.2}, {"archivo": "slide_02.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__01.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__01.mp4", "peso_mb": 0.25}, {"archivo": "slide_03.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__02.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__02.mp4", "peso_mb": 0.25}, {"archivo": "slide_04.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__03.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__03.mp4", "peso_mb": 0.26}, {"archivo": "slide_05.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__04.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__04.mp4", "peso_mb": 0.26}, {"archivo": "slide_06.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__05.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__05.mp4", "peso_mb": 0.27}, {"archivo": "slide_07.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__06.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__06.mp4", "peso_mb": 0.3}, {"archivo": "zz_PREVIEW_CARRUSEL_COMPLETO.mp4", "poster": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__07.jpg", "video": "media/CARRUSEL_CLON_JAVI_OFERTA_2AGO__07.mp4", "peso_mb": 3.84}]}, {"id": "STORIES_JAVI_MIERCOLES_A5_V3", "cuenta": "JAVI", "tipo": "story", "dia": "mar 12", "caption": "Secuencia de stories · palabra clave: RECURSOS. Miercoles 5-ago, cuenta de JAVI.\nOrden: s01 dolor -> s02 win 8.446 MXN -> s03 CTA con el recurso Video Ads.\nV3 con las correcciones de Santi del 4-ago.\n", "archivos": [{"archivo": "s01_dolor.jpg", "poster": "media/STORIES_JAVI_MIERCOLES_A5_V3__i00.jpg"}, {"archivo": "s02_win_mxn.jpg", "poster": "media/STORIES_JAVI_MIERCOLES_A5_V3__i01.jpg"}, {"archivo": "s03_cta_recursos.jpg", "poster": "media/STORIES_JAVI_MIERCOLES_A5_V3__i02.jpg"}]}, {"id": "W_JAVI_LIBERTAD_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "mié 13", "caption": "El verdadero millonario no es el que tú crees.\n\n#ecommerce #mentalidad #negocios\n", "archivos": [{"archivo": "W_JAVI_LIBERTAD.mp4", "poster": "media/W_JAVI_LIBERTAD_8AGO__00.jpg", "video": "media/W_JAVI_LIBERTAD_8AGO__00.mp4", "peso_mb": 14.44}]}, {"id": "V_JAVI_2_QUEDA0_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "mié 13", "caption": "Facturar mucho no es ganar mucho. Ellos lo aprendieron a tiempo — y por eso sus tiendas aguantan.\n\nDel último evento: alumnos reales.\n\nComenta CASH y te paso la auditoría que usamos.\n\n#ecommerce #negocios #emprender\n", "archivos": [{"archivo": "V_JAVI_2_QUEDA0.mp4", "poster": "media/V_JAVI_2_QUEDA0_8AGO__00.jpg", "video": "media/V_JAVI_2_QUEDA0_8AGO__00.mp4", "peso_mb": 20.45}]}, {"id": "CARRUSEL_CLON_JAVI_ORDEN_2AGO", "cuenta": "JAVI", "tipo": "carrusel", "dia": "mié 13", "caption": "Antes de tocar el presupuesto de anuncios miro tres cosas. Y las miro en este orden.\n\n1. Caja. La facturación es el escaparate. La caja es lo que queda después de producto, envío,\npasarela y devoluciones. Si eso está en rojo, escalar multiplica el rojo.\n\n2. Fugas. Antes de traer más gente, mira por dónde se escapa la que ya entra. El checkout es donde\nmás se pierde, y se tapa en una tarde.\n\n3. Escala. Solo cuando el margen aguanta y el checkout no gotea se sube el presupuesto. Y se sube\ncontra un número de referencia, no contra una corazonada.\n\nNo hace falta que me creas: las tres herramientas del carrusel están abiertas y son las mismas que\nuso yo. Arregla antes de escalar.\n\nComenta ORDEN y te digo por cuál de los tres empezaría en tu caso.\n\n#ecommerce #ecom #negocio\n", "archivos": [{"archivo": "slide_01.mp4", "poster": "media/CARRUSEL_CLON_JAVI_ORDEN_2AGO__00.jpg", "video": "media/CARRUSEL_CLON_JAVI_ORDEN_2AGO__00.mp4", "peso_mb": 1.62}, {"archivo": "slide_02.mp4", "poster": "media/CARRUSEL_CLON_JAVI_ORDEN_2AGO__01  ✅ un producto que sí deja margen ✅ estructura antes de escalar ✅ alguien delante que ya recorrió el camino\n\nEl mérito es suyo: vino a todas las sesiones y ejecutó sin excusas.\n\nEl resultado lo ves en las fotos — la placa se entregó delante de toda la comunidad en el último evento.\n\nNo fue suerte. Fue método, acompañamiento y ejecución.\n\nComenta PLACA y te cuento cómo empezó. #ecommerce #negocios #casoreal\n", "archivos": [{"archivo": "s01.png", "poster": "media/CARR_JAVI_PLACA_CLON_7AGO__i00.png"}, {"archivo": "s02.png", "poster": "media/CARR_JAVI_PLACA_CLON_7AGO__i01.png"}, {"archivo": "s03.png", "poster": "media/CARR_JAVI_PLACA_CLON_7AGO__i02.png"}]}, {"id": "W_JAVI_REALIDAD_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "vie 15", "caption": "Facturar no es ganar. Los números de verdad.\n\n#ecommerce #mentalidad #negocios\n", "archivos": [{"archivo": "W_JAVI_REALIDAD.mp4", "poster": "media/W_JAVI_REALIDAD_8AGO__00.jpg", "video": "media/W_JAVI_REALIDAD_8AGO__00.mp4", "peso_mb": 9.66}]}, {"id": "V_JAVI_3_ALUMNOSREALES_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "vie 15", "caption": "Sin guion y sin filtro: lo que dicen los que ya están dentro.\n\nDel último evento de Mentorium.\n\nComenta CASH y te paso la auditoría que usamos con ellos.\n\n#ecommerce #negocios #emprender\n", "archivos": [{"archivo": "V_JAVI_3_ALUMNOSREALES.mp4", "poster": "media/V_JAVI_3_ALUMNOSREALES_8AGO__00.jpg", "video": "media/V_JAVI_3_ALUMNOSREALES_8AGO__00.mp4", "peso_mb": 28.63}]}, {"id": "JAVI_SELFIE_EXITO_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "vie 15", "caption": "¿El éxito te cambia o revela quién eras? Mi respuesta sin filtro.\n\n#mentalidad #emprender #éxito\n", "archivos": [{"archivo": "JAVI_SELFIE_EXITO_8AGO.mp4", "poster": "media/JAVI_SELFIE_EXITO_8AGO__00.jpg", "video": "media/JAVI_SELFIE_EXITO_8AGO__00.mp4", "peso_mb": 52.07}]}, {"id": "W_JAVI_EMPEZAR_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "sáb 16", "caption": "Yo iba con mi mochilita a entrenar gente. Así empecé.\n\n#ecommerce #mentalidad #negocios\n", "archivos": [{"archivo": "W_JAVI_EMPEZAR.mp4", "poster": "media/W_JAVI_EMPEZAR_8AGO__00.jpg", "video": "media/W_JAVI_EMPEZAR_8AGO__00.mp4", "peso_mb": 11.38}]}, {"id": "RANKING_JAVI_ANTES_DE_ESCALAR_2AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "sáb 16", "caption": "Antes de tocar el presupuesto de anuncios miro cinco cosas. Y las miro en este orden.\n\n5. Margen real por pedido. Lo que queda después de producto, envío, pasarela y devolución. Si eso\nestá en rojo, escalar solo multiplica el rojo.\n\n4. Coste de traer un cliente. No el del panel bonito: el que sale de dividir lo que gastas entre\nlos clientes que entran de verdad.\n\n3. Devoluciones y recompra. Un cliente que vuelve te arregla un coste de adquisición malo. Uno que\ndevuelve te lo rompe dos veces.\n\n2. Datos, no corazonadas. Si la decisión depende de lo que \"notas\", no es una decisión: es una\napuesta.\n\n1. Caja real, no facturación. La facturación es el escaparate. La caja es lo que queda en el banco\ndespués de pagar a todos.\n\nArregla antes de escalar. Escalar un negocio roto es romperlo más rápido.\n\nComenta ORDEN y te digo por cuál de las cinco empezaría en tu caso.\n\n#ecommerce #ecom #negocio\n", "archivos": [{"archivo": "RANKING_JAVI_ANTES_DE_ESCALAR.mp4", "poster": "media/RANKING_JAVI_ANTES_DE_ESCALAR_2AGO__00.jpg", "video": "media/RANKING_JAVI_ANTES_DE_ESCALAR_2AGO__00.mp4", "peso_mb": 34.25}]}, {"id": "CARR_JAVI_RECURSOS", "cuenta": "JAVI", "tipo": "carrusel", "dia": "sáb 16", "caption": "Lo que usan mis alumnos para no quemar dinero.\n\nDentro va lo mismo que usamos en las auditorías: calculadoras de cash real, margen y qué mirar en qué orden. Sin humo, herramientas reales.\n\nComenta RECURSOS y te llega. Gratis, hoy.\n\n#ecommerce #negocios #emprendedores\n", "archivos": [{"archivo": "_PREVIEW_CARR_JAVI_RECURSOS.mp4", "poster": "media/CARR_JAVI_RECURSOS__00.jpg", "video": "media/CARR_JAVI_RECURSOS__00.mp4", "peso_mb": 1.36}]}, {"id": "W_JAVI_CREENCIAS_8AGO", "cuenta": "JAVI", "tipo": "reel", "dia": "dom 17", "caption": "¿Montar un negocio con 3.000? Piénsalo otra vez.\n\n#ecommerce #mentalidad #negocios\n", "archivos": [{"archivo": "W_JAVI_CREENCIAS.mp4", "poster": "media/W_JAVI_CREENCIAS_8AGO__00.jpg", "video": "media/W_JAVI_CREENCIAS_8AGO__00.mp4", "peso_mb": 13.26}]}, {"id": "MEME_JAVI_M1_EMPLEO_VS_NEGOCIO_1AGO", "cuenta": "JAVI", "tipo": "meme", "dia": "dom 17", "caption": "Trabajo desde casa y negocio propio no son lo mismo.\n\nEn uno alguien decide por ti y cobras igual. En el otro decides tú, y también asumes tú.\n\nSi lo que buscas es lo primero, esto no es tu sitio y te ahorro el tiempo.\n\nComenta RECURSOS y te llega el módulo de montar la tienda.\n\n#ecommerce #shopify\n", "archivos": [{"archivo": "M1_empleo_vs_negocio.mp4", "poster": "media/MEME_JAVI_M1_EMPLEO_VS_NEGOCIO_1AGO__00.jpg", "video": "media/MEME_JAVI_M1_EMPLEO_VS_NEGOCIO_1AGO__00.mp4", "peso_mb": 1.03}]}, {"id": "REEL_JAVI_QA12_V2", "cuenta": "JAVI", "tipo": "reel", "dia": "dom 17", "caption": "\"Vende humos\" — la respuesta de Javi\n\n#ecommerce #mentoria #emprender\n", "archivos": [{"archivo": "REEL_JAVI_QA12_V2.mp4", "poster": "media/REEL_JAVI_QA12_V2__00.jpg", "video": "media/REEL_JAVI_QA12_V2__00.mp4", "peso_mb": 62.24}]}, {"id": "REEL_JORDI_CC_V5_CENTRO_8AGO", "cuenta": "JORDI", "tipo": "reel", "dia": "lun 11", "caption": "La eterna pelea. 🧠❤\n\n#mentalidad #emprender #negocios\n", "archivos": [{"archivo": "REEL_JORDI_CC_V5_CENTRO.mp4", "poster": "media/REEL_JORDI_CC_V5_CENTRO_8AGO__00.jpg", "video": "media/REEL_JORDI_CC_V5_CENTRO_8AGO__00.mp4", "peso_mb": 11.12}]}, {"id": "CARRUSEL_JORDI_FILTRO_2AGO", "cuenta": "JORDI", "tipo": "carrusel", "dia": "lun 11", "caption": "CUENTA: @jordigarcia89\nFORMATO: carrusel de 6 slides 4:5. Slide 1 = CLIP DE VÍDEO (1080x1350, 7 s, con música);\nslides 2-6 = PNG 2160x2700.\nSPEC: la MISMA clonada de @gala_lc que usa CARRUSEL_CLON_GALA_JORDI_31JUL (foto real a sangre,\ntitular serif Playfair + cuerpo Montserrat, UN solo acento, arco objeción -> remate -> antes\ncrudo -> verdad -> prueba real -> reencuadre + CTA). Cambia el QUÉ, nunca el CÓMO.\nESTADO: SIN PUBLICAR. Pendiente de OK de Gerard, pieza a pieza.\n\nCAPTION (pegar tal cual):\n\"He probado cinco productos y ninguno ha tirado.\"\n\nMe lo dicen cada semana. Y casi siempre el fallo no está en el producto: está en que se lanza el\nsexto sin haber mirado qué pasó con los cinco anteriores.\n\nPara. Y mira hacia atrás. ¿Cuál creó más interés? ¿Cuál te dejaba menos margen? ¿Cuál se vendió\nde verdad, sin tener que regalarlo?\n\nDe ahí sale un patrón: producto pequeño, con margen, que funciona en ese mercado concreto. Y de\nese patrón sale tu filtro. El tuyo, no el que te vendan.\n\nEs lo más complicado del negocio. Y a la vez lo más bonito.\n\nComenta RECURSOS y te paso el panel entero. Gratis.\n\n#ecommerce #dropshipping #producto\n\nNOTAS PARA GERARD:\n- Cero cifras de facturación de Jor", "archivos": [{"archivo": "s01_portada.mp4", "poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__00.jpg", "video": "media/CARRUSEL_JORDI_FILTRO_2AGO__00.mp4", "peso_mb": 4.24}, {"archivo": "s02_texto.mp4", "poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__01.jpg", "video": "media/CARRUSEL_JORDI_FILTRO_2AGO__01.mp4", "peso_mb": 0.34}, {"archivo": "s03_texto.mp4", "poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__02.jpg", "video": "media/CARRUSEL_JORDI_FILTRO_2AGO__02.mp4", "peso_mb": 0.44}, {"archivo": "s04_pruebas.mp4", "poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__03.jpg", "video": "media/CARRUSEL_JORDI_FILTRO_2AGO__03.mp4", "peso_mb": 0.26}, {"archivo": "s05_pruebas.mp4", "poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__04.jpg", "video": "media/CARRUSEL_JORDI_FILTRO_2AGO__04.mp4", "peso_mb": 0.25}, {"archivo": "s06_testimonio.mp4", "poster": "media/CARRUSEL_JORDI_FILTRO_2AGO__05.jpg", "video": "media/CARRUSEL_JORDI_FILTRO_2AGO__05.mp4", "peso_mb": 0.22}, {"archivo": "s07_cierre.mp4", "poster": "media/CARRUSEL_JORDI_ poster": "media/MEMES_JORDI_TANDA_1AGO__05.jpg", "video": "media/MEMES_JORDI_TANDA_1AGO__05.mp4", "peso_mb": 0.91}, {"archivo": "M7_empezar_de_cero.mp4", "poster": "media/MEMES_JORDI_TANDA_1AGO__06.jpg", "video": "media/MEMES_JORDI_TANDA_1AGO__06.mp4", "peso_mb": 1.17}]}, {"id": "REEL_JORDI_MIEDO_QUEDIRAN", "cuenta": "JORDI", "tipo": "reel", "dia": "mar 12", "caption": "Tardé en comprarme el coche por miedo al qué dirán.\n\nCuando por fin lo hice, no me crucé con una sola persona que me hiciera un comentario. Ni uno.\n\nEl miedo casi nunca es a la consecuencia. Es a la reacción de gente que ni se acuerda de ti al día siguiente. Y te bloquea igual para comprarte algo que para abrir una tienda, o para cambiar de casa.\n\nEsa es la primera barrera, y nos la ponemos nosotros.\n\n#ecommerce #mentalidad\n", "archivos": [{"archivo": "REEL_JORDI_MIEDO_QUEDIRAN.mp4", "poster": "media/REEL_JORDI_MIEDO_QUEDIRAN__00.jpg", "video": "media/REEL_JORDI_MIEDO_QUEDIRAN__00.mp4", "peso_mb": 12.02}]}, {"id": "CARRUSEL_JORDI_7BARES_4AGO", "cuenta": "JORDI", "tipo": "carrusel", "dia": "mar 12", "caption": "Yo salía a la calle y contaba: hay 7 bares en una misma calle.\n\nTodos hacen lo mismo. Ponen una cerveza, una tapa, un bocadillo. Uno la hace mejor y otro la hace peor, pero todos tienen una inversión altísima y todos dependen de un personal.\n\nYo estaba en mi casa trabajando con una inversión muy baja y sin personal. Si un mes me iba mal, no tenía que preocuparme.\n\nEllos no: un mes de lluvias, el covid, lo que sea, y ya tienen un problema serio. Porque los gastos fijos hay que pagarlos igual.\n\nCualquier negocio en el que no dependas de un gasto fijo cada mes, para mí es el negocio perfecto.\n\nComenta «RECURSOS» y te paso las 64 herramientas que uso.\n\n#ecommerce #dropshipping #negocios\n", "archivos": [{"archivo": "slide_01.png", "poster": "media/CARRUSEL_JORDI_7BARES_4AGO__i00.png"}, {"archivo": "slide_02.png", "poster": "media/CARRUSEL_JORDI_7BARES_4AGO__i01.png"}, {"archivo": "slide_03.png", "poster": "media/CARRUSEL_JORDI_7BARES_4AGO__i02.png"}, {"archivo": "slide_04.png", "poster": "media/CARRUSEL_JORDI_7BARES_4AGO__i03.png"}, {"archivo": "slide_05.png", "poster": "media/CARRUSEL_JORDI_7BARES_4AGO__i04.png"}, {"archivo": "slide_06.png", "poster": "media/CARRUSEL_JORDI_7BARES_4AGO__i05.png"}, {"archivo": "slide_07.png", "poster": "media/CARRUSEL_JORDI_7BARES_4AGO__i06.png"}]}, {"id": "STORIES_JORDI_TESTIMONIOS_1AGO", "cuenta": "JORDI", "tipo": "story", "dia": "mar 12", "caption": "", "archivos": [{"archivo": "T1_primera_venta.jpg", "poster": "media/STORIES_JORDI_TESTIMONIOS_1AGO__i00.jpg"}, {"archivo": "T1_primera_venta.png", "poster": "media/STORIES_JORDI_TESTIMONIOS_1AGO__i01.png"}, {"archivo": "T2_dsers_cayo.jpg", "poster": "media/STORIES_JORDI_TESTIMONIOS_1AGO__i02.jpg"}, {"archivo": "T2_dsers_cayo.png", "poster": "media/STORIES_JORDI_TESTIMONIOS_1AGO__i03.png"}, {"archivo": "T3_clase.jpg", "poster": "media/STORIES_JORDI_TESTIMONIOS_1AGO__i04.jpg"}, {"archivo": "T3_clase.png", "poster": "media/STORIES_JORDI_TESTIMONIOS_1AGO__i05.png"}]}, {"id": "REEL_JORDI_NO_CAMBIO_NADA", "cuenta": "JORDI", "tipo": "reel", "dia": "mié 13", "caption": "Me preguntaron qué me ha cambiado la vida esto. Y la respuesta decepciona: nada.\n\nMe levanto a la misma hora, llevo a mi hijo al colegio y trabajo las mismas horas. Antes esas horas las pasaba en el coche viajando y vendiendo. Ahora las paso en la oficina.\n\nEso es literalmente lo único que ha cambiado.\n\nSi esperas que el negocio te cambie la rutina, vas a esperar sentado. Lo que cambia es a quién le rindes cuentas.\n\n#ecommerce #mentalidad\n", "archivos": [{"archivo": "REEL_JORDI_NO_CAMBIO_NADA.mp4", "poster": "media/REEL_JORDI_NO_CAMBIO_NADA__00.jpg", "video": "media/REEL_JORDI_NO_CAMBIO_NADA__00.mp4", "peso_mb": 13.13}]}, {"id": "CARRUSEL_JORDI_ALQUILADO_4AGO", "cuenta": "JORDI", "tipo": "carrusel", "dia": "mié 13", "caption": "«¿Es alquilado?» Me lo preguntan todas las semanas.\n\nNo: lo compré con una de mis empresas. Y sí, es verdad que lo podría alquilar — sería más barato y nadie lo notaría.\n\nPero yo no quiero hacer un personaje. Si el coche es el negocio, no hay negocio.\n\nLo compré por la experiencia que me da. Y porque a veces creo que necesitamos todos un caramelo: cualquier negocio son muchas horas, y un día malo pesa igual con coche o sin él.\n\nEl coche no monta la tienda. El sistema sí.\n\nComenta «RECURSOS» y te paso las 64 herramientas que uso.\n\n#ecommerce #dropshipping #mentalidad\n", "archivos": [{"archivo": "slide_01.png", "poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__i00.png"}, {"archivo": "slide_02.png", "poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__i01.png"}, {"archivo": "slide_03.png", "poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__i02.png"}, {"archivo": "slide_04.png", "poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__i03.png"}, {"archivo": "slide_05.png", "poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__i04.png"}, {"archivo": "slide_06.png", "poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__i05.png"}, {"archivo": "slide_07.png", "poster": "media/CARRUSEL_JORDI_ALQUILADO_4AGO__i06.png"}]}, {"id": "FACTO_VIDEO_JORDI_V2", "cuenta": "JORDI", "tipo": "reel", "dia": "mié 13", "caption": "FACTO_VIDEO_JORDI_V2 · @jordigarcia89 · 7 slides video (anti-humo: cada slide con prueba real en pantalla)\n\nCAPTION:\nEl \"todo lo hago yo\" es la razón por la que tu tienda no crece.\n\nTu tienda no necesita más horas tuyas. Necesita sistemas. El que lo hace todo, tapa. El que delega, crece.\n\nLo que ves en las slides no es decoración: pantallazos reales del grupo y del panel de recursos. Sin retocar.\n\nComenta RECURSO y te mando el panel con las calculadoras que sacan el número real de tu tienda, gratis.\nGuárdalo para cuando toque.\n\n#ecommerce #mentalidad #delegar #sistemas #tiendaonline #españa\n\n---\nMÚSICA: Hans Zimmer - Cornfield Chase (emocional/motivacional · distinta a la de Javi V2 que lleva Cochise - Tell Em · beat-sync librosa · LUFS -13.6)\n", "archivos": [{"archivo": "00_PREVIEW.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__00.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__00.mp4", "peso_mb": 10.43}, {"archivo": "slide_01.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__01.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__01.mp4", "peso_mb": 2.58}, {"archivo": "slide_02.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__02.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__02.mp4", "peso_mb": 0.91}, {"archivo": "slide_03.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__03.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__03.mp4", "peso_mb": 0.83}, {"archivo": "slide_04.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__04.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__04.mp4", "peso_mb": 2.24}, {"archivo": "slide_05.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__05.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__05.mp4", "peso_mb": 0.81}, {"archivo": "slide_06.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__06.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__06.mp4", "peso_mb": 0.78}, {"archivo": "slide_07.mp4", "poster": "media/FACTO_VIDEO_JORDI_V2__07.jpg", "video": "media/FACTO_VIDEO_JORDI_V2__07.mp4", "peso_mb": 1.25}]}, {"id": "REEL_JORDI_EMPEZAR_4AGO", "cuenta": "JORDI", "tipo": "reel", "dia": "jue 14", "caption": "¿Cuánto necesitas de verdad para empezar? La respuesta sin humo.\n\n#ecommerce #emprender #mentoria\n", "archivos": [{"archivo": "REEL_JORDI_EMPEZAR.mp4", "poster": "media/REEL_JORDI_EMPEZAR_4AGO__00.jpg", "video": "media/REEL_JORDI_EMPEZAR_4AGO__00.mp4", "peso_mb": 54.26}]}, {"id": "CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO", "cuenta": "JORDI", "tipo": "carrusel", "dia": "jue 14", "caption": "Hay casas donde todo son problemas.\n\nUn niño de 10, 12, 15 años llega a casa y sus padres: problemas con el dinero, problemas con la familia, problemas con las amistades. Se quejan de la televisión y se quejan.\n\nEso crea un círculo de queja, una energía negativa dentro de casa que puede que te influya en tu futuro. Y eso es lo importante: romperlo.\n\nEn mi casa montaron negocios y se quebraron. Gracias a esos errores soy conservador en todos los negocios que monto.\n\nHoy cada día soy más estricto con mi círculo: cuando a la gente de mi entorno le pasa un problema, busca solución. No se queja.\n\n¿Te suena esa casa? Cuéntamelo en comentarios.\n\n#ecommerce #mentalidad #entorno\n", "archivos": [{"archivo": "slide_01.png", "poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__i00.png"}, {"archivo": "slide_02.png", "poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__i01.png"}, {"archivo": "slide_03.png", "poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__i02.png"}, {"archivo": "slide_04.png", "poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__i03.png"}, {"archivo": "slide_05.png", "poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__i04.png"}, {"archivo": "slide_06.png", "poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__i05.png"}, {"archivo": "slide_07.png", "poster": "media/CARRUSEL_JORDI_CIRCULO_QUEJA_4AGO__i06.png"}]}, {"id": "V_JORDI_HOOKAD12_7AGO", "cuenta": "JORDI", "tipo": "reel", "dia": "jue 14", "caption": "Esto no es otro curso de ecommerce. Es lo que pasa cuando alguien que ya recorrió el camino te dice qué NO hacer.\n\nLo de este video es del último evento: alumnos reales, resultados reales.\n\nComenta ATAJO y te lo paso.\n\n#ecommerce #negocios #mentoria\n", "archivos": [{"archivo": "V_JORDI_HOOKAD12.mp4", "poster": "media/V_JORDI_HOOKAD12_7AGO__00.jpg", "video": "media/V_JORDI_HOOKAD12_7AGO__00.mp4", "peso_mb": 23.26}]}, {"id": "REEL_JORDI_FILTRO_2AGO", "cuenta": "JORDI", "tipo": "reel", "dia": "vie 15", "caption": "La mayoría prueba productos. Muy poca gente construye un filtro.\n\nCoges cuatro o cinco, los lanzas… y ahí es donde casi todo el mundo se equivoca: sigue\nlanzando sin pararse a mirar qué pasó con los anteriores.\n\nPara. Analiza. ¿Cuál creó más interés? ¿Cuál te dejaba menos margen? ¿Cuál se vendió de verdad?\n\nDe ahí sale un patrón: producto pequeño, con margen, que funciona en ese mercado concreto.\nY de ese patrón sale tu filtro, el tuyo, no el que te vendan.\n\nEs lo más complicado del negocio. Y a la vez lo más bonito.\n\n#ecommerce #dropshipping #producto\n", "archivos": [{"archivo": "REEL_JORDI_FILTRO.mp4", "poster": "media/REEL_JORDI_FILTRO_2AGO__00.jpg", "video": "media/REEL_JORDI_FILTRO_2AGO__00.mp4", "peso_mb": 40.7}]}, {"id": "CARR_JORDI_ATAJO", "cuenta": "JORDI", "tipo": "carrusel", "dia": "vie 15", "caption": "Empezó de cero en marzo. Mira cómo va.\n\nSin historia bonita: un sistema en orden y alguien diciéndole qué NO hacer. Las wins llegan así, cada semana. Enteras, sin retocar.\n\nComenta ATAJO y te lo paso. Sin humo, hoy.\n\n#ecommerce #negocios #dropshipping\n", "archivos": [{"archivo": "_PREVIEW_CARR_JORDI_ATAJO.mp4", "poster": "media/CARR_JORDI_ATAJO__00.jpg", "video": "media/CARR_JORDI_ATAJO__00.mp4", "peso_mb": 1.56}]}, {"id": "MEME_REPLICA_JORDI_RESENAS", "cuenta": "JORDI", "tipo": "meme", "dia": "vie 15", "caption": "CUENTA: @jordigarcia89\nFORMATO: meme letterbox @co1e0 · banda BLANCA + texto NEGRO · 1 plano fijo · 0 cortes · 7,80 s\nESTADO: SIN PUBLICAR. Pendiente de OK de Gerard.\n\nQUÉ VIRAL REPLICA (esto es lo que faltaba en la versión anterior)\n Réplica del post real `DZAoun_iojJ` de @co1e0 — 49.780 plays medidos (scrape Apify, 04-jun).\n Original literal:\n   \"POV you realize that most dropshippers are technically doing BH because saying 6000+ happy\n    users and fake testimonials after launching a new store is 100% BH\"\n Nuestra versión, traducida al nicho español manteniendo la estructura:\n   \"POV: te das cuenta de que media competencia va en negro, porque poner «+6.000 clientes\n    felices» en una tienda que abriste ayer es exactamente eso\"\n   (y el vendehumos siempre es el otro)\n 4 líneas, igual que el original. El remate entre paréntesis es el diferencial del formato:\n los dos únicos memes del corpus que lo llevan son el nº1 (407K) y el nº8.\n\nPOR QUÉ ESTA IMAGEN Y NO LA DEL PODCAST (cr let TAB="contenido", filtro="todo", buscaCrit="";
let guardando=false, pendiente=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoyISO=()=>new Date().toISOString().slice(0,16).replace("T"," ");

function aviso(t,mal){const s=$("#sync");s.textContent=t;s.className="sync ver"+(mal?" mal":"");
  clearTimeout(s._t);s._t=setTimeout(()=>s.className="sync",mal?4200:1700);}

/* ===== LOGIN (con salida real) ===== */
function pintaLogin(){
  $("#lsem").textContent=DATOS.semana||"";
  const c=$("#lquien");c.innerHTML="";
  PERSONAS.forEach(p=>{const b=document.createElement("button");b.textContent=p;
    b.onclick=()=>entrar(p);c.appendChild(b);});
  // la clave se recuerda, la IDENTIDAD no: cada sesion dice quien es (bug del v2)
  const ck=localStorage.getItem("mx_clave");if(ck)$("#lclave").value=ck;
}
function entrar(p){
  const v=$("#lclave").value.trim();
  if(v!==CLAVE){$("#lerr").textContent="Clave incorrecta";return;}
  localStorage.setItem("mx_clave",v);
  sessionStorage.setItem("mx_yo",p);          // sessionStorage: al cerrar pestaña se olvida
  YO=p;$("#login").style.display="none";arranca();
}
function salir(){
  sessionStorage.removeItem("mx_yo");YO=null;
  $("#login").style.display="flex";$("#lerr").textContent="";
}

/* ===== PERSISTENCIA con merge (no se pisan entre personas) ===== */
async function leerBlob(){
  const r=await fetch(BLOB,{cache:"no-store"});
  if(!r.ok)throw new Error("GET "+r.status);
  const j=await r.json();
  return {votos:j.votos||{},slides:j.slides||{},tareas:j.tareas||[],
          archivos:j.archivos||[],criterio:j.criterio||[]};
}
/* aplica MIS cambios sobre lo ultimo que hay en el servidor, en vez de sobrescribirlo todo */
async function guardar(aplicarMisCambios){
  if(guardando){pendiente=aplicarMisCambios;return;}
  guardando=true;
  for(let intento=0;intento<3;intento++){
    try{
      const srv=await leerBlob();
      aplicarMisCambios(srv);
      const r=await fetch(BLOB,{method:"PUT",headers:{"Content-Type":"application/json"},
                               body:JSON.stringify(srv)});
      if(!r.ok)throw new Error("PUT "+r.status);
      E=srv;aviso("Guardado online");guardando=false;
      const p=pendiente;pendiente=false;if(p)guardar(p);else render();
      return;
    }catch(err){
      if(intento===2){guardando=false;aviso("No se pudo guardar: "+err.message,true);return;}
      await new Promise(r=>setTimeout(r,600*(intento+1)));
    }
  }
}

/* ===== VOTOS ===== */
function votar(id,v){
  if(!YO)return;
  const prev=(E.votos[id]||{})[YO];
  const nuevo=(prev&&prev.v===v)?null:v;                 // volver a pulsar = quitar el voto
  guardar(srv=>{srv.votos[id]=srv.votos[id]||{};
    if(nuevo)srv.votos[id][YO]={v:nuevo,nota:(prev&&prev.nota)||"",cuando:hoyISO()};
    else delete srv.votos[id][YO];});
}
function nota(id,txt){
  if(!YO)return;
  guardar(srv=>{srv.votos[id]=srv.votos[id]||{};
    const a=srv.votos[id][YO]||{v:"",cuando:hoyISO()};a.nota=txt;srv.votos[id][YO]=a;});
}
function votarSlide(id,n,v){
  if(!YO)return;
  const k=id+"#"+n, prev=(E.slides[k]||{})[YO];
  const nuevo=(prev===v)?null:v;
  guardar(srv=>{srv.slides[k]=srv.slides[k]||{};
    if(nuevo)srv.slides[k][YO]=nuevo;else delete srv.slides[k][YO];});
}

/* ===== TAREAS ===== */
function nuevaTarea(){
  const i=$("#tinput");const t=i.value.trim();if(!t||!YO)return;
  const item={id:"t"+Date.now(),texto:t,por:YO,para:"",hecha:false,cuando:hoyISO()};
  i.value="";
  guardar(srv=>{srv.tareas.unshift(item);});
}
function toggleTarea(id){
  guardar(srv=>{const t=srv.tareas.find(x=>x.id===id);if(t){t.hecha=!t.hecha;
    t.porQuien=t.hecha?YO:"";}});
}
function borraTarea(id){
  guardar(srv=>{srv.tareas=srv.tareas.filter(x=>x.id!==id);});
}

/* ===== ARCHIVOS (enlaces: el panel no aloja ficheros, los apunta) ===== */
function nuevoArchivo(){
  const u=$("#ainput").value.trim();if(!u||!YO)return;
  const tit=$("#atit").value.trim()||u.replace(/^https?:\/\//,"").slice(0,60);
  $("#ainput").value="";$("#atit").value="";
  guardar(srv=>{srv.archivos.unshift({id:"a"+Date.now(),titulo:tit,url:u,por:YO,cuando:hoyISO()});});
}
function borraArchivo(id){guardar(srv=>{srv.archivos=srv.archivos.filter(x=>x.id!==id);});}

/* ===== RENDER ===== */
function mias(p){return p.cuenta==="JAVI"||p.cuenta==="JORDI";}
function pizVis(){
  return (DATOS.piezas||[]).filter(p=>{
    if(filtro==="todo")return true;
    if(filtro==="faltan")return !((E.votos[p.id]||{})[YO]);
    if(filtro==="javi")return p.cuenta==="JAVI";
    if(filtro==="jordi")return p.cuenta==="JORDI";
    if(filtro==="story")return p.tipo==="story";
    if(filtro==="feed")return p.tipo!=="story";
    return true;});
}
function render(){
  // cabecera
  $("#hyo").textContent=YO||"";
  const tot=(DATOS.piezas||[]).length;
  const rev=(DATOS.piezas||[]).filter(p=>(E.votos[p.id]||{})[YO]).length;
  $("#hcnt").textContent=rev+"/"+tot;
  $("#htit").textContent={contenido:"Contenido",calendario:"Calendario",tareas:"Tareas",
                          archivos:"Archivos",criterio:"Criterio del equipo",
                          aportes:"Aportes del equipo"}[TAB];
  ["contenido","calendario","tareas","archivos","criterio","aportes"].forEach(t=>
    $("#t-"+t).classList.toggle("oculto",t!==TAB));
  pintaTabs();
  if(TAB==="contenido")renderContenido();
  if(TAB==="calendario")renderCalendario();
  if(TAB==="tareas")renderTareas();
  if(TAB==="archivos")renderArchivos();
  if(TAB==="criterio")renderCriterio();
  if(TAB==="aportes")renderAportes();
}
function pintaTabs(){
  const abiertas=(E.tareas||[]).filter(t=>!t.hecha).length;
  const defs=[["contenido","▤","Contenido"],["calendario","▦","Semana"],
              ["tareas","✓","Tareas"],["archivos","⇪","Archivos"],["criterio","★","Criterio"],
              ["aportes","✉","Aportes"]];
  const recientes=((APORTES&&APORTES.aportes)||[]).filter(a=>{
    const d=new Date(a.fecha.replace(" ","T"));return (Date.now()-d)/864e5<=3;}).length;
  $("#tabs").innerHTML=defs.map(([k,ic,tx])=>
    `<button data-tab="${k}" class="${TAB===k?"on":""}"><b>${ic}</b>${tx}`+
    (k==="tareas"&&abiertas?`<span class="badge">${abiertas}</span>`:"")+
    (k==="aportes"&&recientes?`<span class="badge">${recientes}</span>`:"")+`</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();
    window.scrollTo({top:0});});
}
function renderContenido(){
  const c=$("#t-contenido");
  const fs=[["todo","Todo"],["faltan","Me faltan"],["javi","Javi"],["jordi","Jordi"],
            ["story","Historias"],["feed","Feed"]];
  let h=`<div class="filtros">`+fs.map(([k,t])=>
    `<button data-f="${k}" class="${filtro===k?"on":""}">${t}</button>`).join("")+`</div>`;
  const vis=pizVis();
  (DATOS.dias||[]).forEach(dia=>{
    const dp=vis.filter(p=>p.dia===dia);if(!dp.length)return;
    const rev=dp.filter(p=>(E.votos[p.id]||{})[YO]).length;
    h+=`<details class="dia"${dia===(DATOS.dias||[])[1]?" open":""}>
      <summary><span>${esc(dia.toUpperCase())}</span><i>${rev}/${dp.length} tuyas</i></summary>
      <div class="cuerpo">`+dp.map(pieza).join("")+`</div></details>`;
  });
  if(!vis.length)h+=`<p class="vacio">No hay piezas con este filtro.</p>`;
  c.innerHTML=h;
  c.querySelectorAll(".filtros button").forEach(b=>b.onclick=()=>{filtro=b.dataset.f;render();});
  engancha(c);
}
function pieza(p){
  const mv=(E.votos[p.id]||{})[YO]||{};
  const arch=(p.archivos||[]).slice(0,10).map((a,i)=>{
    const k=p.id+"#"+i, sv=(E.slides[k]||{})[YO];
    const m=a.video?`<video src="${esc(a.video)}" poster="${esc(a.poster||"")}" muted playsinline
              preload="none" controls></video>`
            :`<img src="${esc(a.poster||a.archivo)}" alt="" loading="lazy">`;
    return `<div class="slot">${m}<div class="sv">
      <button class="ok ${sv==="ok"?"on":""}" data-sl="${esc(p.id)}" data-n="${i}" data-v="ok">✓</button>
      <button class="no ${sv==="no"?"on":""}" data-sl="${esc(p.id)}" data-n="${i}" data-v="no">✗</button>
    </div></div>`;}).join("");
  const chips=PERSONAS.filter(x=>x!==YO).map(per=>{const x=(E.votos[p.id]||{})[per];
    return `<span class="${x?x.v:""}">${per}${x?" "+({si:"✓",no:"✗",duda:"?"}[x.v]||""):""}</span>`;}).join("");
  return `<div class="pieza">
    <div class="meta"><span class="tag ${esc(p.cuenta)}">${esc(p.cuenta)}</span>
      <span class="tag tipo">${esc(p.tipo)}</span>
      <span class="nom">${esc((p.id||"").replace(/_/g," "))}</span></div>
    ${arch?`<div class="tira">${arch}</div>`:""}
    <div class="cap" data-cap>${esc(p.caption||"")}</div>
    <button class="mas" data-mas>ver todo el texto</button>
    <div class="votos">
      <button class="si ${mv.v==="si"?"on":""}"   data-vt="${esc(p.id)}" data-v="si">Sí ✓</button>
      <button class="duda ${mv.v==="duda"?"on":""}" data-vt="${esc(p.id)}" data-v="duda">Duda</button>
      <button class="no ${mv.v==="no"?"on":""}"   data-vt="${esc(p.id)}" data-v="no">No ✗</button>
    </div>
    <div class="quienes">${chips}</div>
    <textarea class="nota" data-nt="${esc(p.id)}"
      placeholder="Qué cambiarías (lo lee todo el equipo)">${esc(mv.nota||"")}</textarea>
  </div>`;
}
function engancha(c){
  c.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>votar(b.dataset.vt,b.dataset.v));
  c.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>votarSlide(b.dataset.sl,+b.dataset.n,b.dataset.v));
  c.querySelectorAll("[data-nt]").forEach(t=>{let x=null;
    t.oninput=()=>{clearTimeout(x);x=setTimeout(()=>nota(t.dataset.nt,t.value),900);};});
  c.querySelectorAll("[data-mas]").forEach(b=>b.onclick=()=>{
    const cap=b.previousElementSibling;cap.classList.toggle("abierto");
    b.textContent=cap.classList.contains("abierto")?"ocultar":"ver todo el texto";});
}
function renderCalendario(){
  const f=(CAL.filas||[]);
  let h=`<h2 class="sec">Parrilla de la semana</h2>
    <p class="secsub">3 publicaciones al día por cuenta. Verde = lista y con gate PASS · naranja = falta producirla · morado = espera a Santi.</p>`;
  if(CAL.aviso)h+=`<p class="vacio">${esc(CAL.aviso)}</p>`;
  ["JAVI","JORDI"].forEach(cta=>{
    const fs=f.filter(x=>x.cuenta===cta);if(!fs.length)return;
    h+=`<h2 class="sec">${cta}</h2><div class="calgrid">`+fs.map(x=>
      `<div class="calfila"><h4><span class="tag ${cta}">${cta}</span>${esc(x.dia)}</h4>`+
      [["1º",x.p1],["2º",x.p2],["3º",x.p3],["Hist.",x.stories]].map(([et,v])=>{
        const m=/^\[([A-Z]\d*|B→arreglar)\]/.exec(v.trim());
        const cl=m?m[1][0]:"";
        return `<div class="calslot"><b>${et}</b>`+
          (cl?`<span class="estado ${cl}">${esc(m[1])}</span>`:"")+
          `<span>${esc(v.replace(/^\[[^\]]+\]\s*/,"")||"—")}</span></div>`;}).join("")+
      `</div>`).join("")+`</div>`;
  });
  $("#t-calendario").innerHTML=h;
}
function renderTareas(){
  const ts=E.tareas||[];
  let h=`<h2 class="sec">Tareas del equipo</h2>
    <p class="secsub">Lo que apuntes aquí lo ve todo el equipo al instante.</p>
    <div class="nuevo"><input id="tinput" placeholder="Nueva tarea…" autocomplete="off">
      <button id="tadd">Añadir</button></div>`;
  if(!ts.length)h+=`<p class="vacio">Ninguna tarea todavía.<br>Escribe arriba lo primero que haya que hacer.</p>`;
  h+=ts.map(t=>`<div class="tarea ${t.hecha?"hecha":""}">
      <button class="chk" data-tg="${esc(t.id)}">✓</button>
      <div class="txt">${esc(t.texto)}
        <div class="quien2">${esc(t.por||"")} · ${esc(t.cuando||"")}${t.hecha&&t.porQuien?" · hecha por "+esc(t.porQuien):""}</div>
      </div><button class="del" data-dl="${esc(t.id)}">×</button></div>`).join("");
  const c=$("#t-tareas");c.innerHTML=h;
  $("#tadd").onclick=nuevaTarea;
  $("#tinput").onkeydown=e=>{if(e.key==="Enter")nuevaTarea();};
  c.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>toggleTarea(b.dataset.tg));
  c.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>borraTarea(b.dataset.dl));
}
function renderArchivos(){
  const as=E.archivos||[];
  let h=`<h2 class="sec">Archivos y enlaces</h2>
    <p class="secsub">Pega aquí el enlace de Drive, del vídeo o del documento. El panel guarda el
      enlace y quién lo puso — los ficheros siguen viviendo en su sitio (Drive/WhatsApp).</p>
    <div class="nuevo"><input id="atit" placeholder="Nombre (opcional)" autocomplete="off"></div>
    <div class="nuevo"><input id="ainput" placeholder="https://…" autocomplete="off" inputmode="url">
      <button id="aadd">Guardar</button></div>`;
  if(!as.length)h+=`<p class="vacio">Todavía no hay enlaces guardados.</p>`;
  h+=as.map(a=>`<div class="item"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.titulo)}</a>
      <div class="sub">${esc(a.por||"")} · ${esc(a.cuando||"")}
      <button class="del" data-da="${esc(a.id)}" style="float:right">×</button></div></div>`).join("");
  const c=$("#t-archivos");c.innerHTML=h;
  $("#aadd").onclick=nuevoArchivo;
  c.querySelectorAll("[data-da]").forEach(b=>b.onclick=()=>borraArchivo(b.dataset.da));
}
function renderCriterio(){
  const base=(CRITERIO||[]).concat(E.criterio||[]);
  const q=buscaCrit.toLowerCase();
  const fs=q?base.filter(x=>(x.regla+" "+x.de+" "+(x.porque||"")).toLowerCase().includes(q)):base;
  let h=`<h2 class="sec">Criterio del equipo</h2>
    <p class="secsub">Lo que cada uno ha pedido, con su frase. Antes de corregir una pieza: buscar aquí.</p>
    <input class="buscador" id="cbusca" placeholder="Buscar: música, texto, placa, hook…" value="${esc(buscaCrit)}">`;
  if(!fs.length)h+=`<p class="vacio">Nada que coincida con «${esc(buscaCrit)}».</p>`;
  h+=fs.map(x=>`<div class="item crit"><span class="de">${esc(x.de)}</span>
      <b>${esc(x.regla)}</b>${x.porque?`<div class="sub">${esc(x.porque)}</div>`:""}</div>`).join("");
  const c=$("#t-criterio");c.innerHTML=h;
  const i=$("#cbusca");i.oninput=()=>{buscaCrit=i.value;const p=i.selectionStart;render();
    const j=$("#cbusca");if(j){j.focus();j.setSelectionRange(p,p);}};
}

function renderAportes(){
  const ap=(APORTES&&APORTES.aportes)||[];
  let h=`<h2 class="sec">Aportes del equipo</h2>
    <p class="secsub">Referentes y directrices que habéis pasado por WhatsApp (últimos ${(APORTES&&APORTES.dias)||14} días, actualizado ${esc((APORTES&&APORTES.generado)||"")}). Lo que está aquí no se pierde.</p>`;
  if(!ap.length)h+=`<p class="vacio">Sin aportes en el periodo.</p>`;
  h+=ap.map(a=>`<div class="item crit">
      <span class="de">${esc(a.quien)} · ${esc(a.fecha)}${a.chat!==a.quien?` · ${esc(a.chat)}`:""}</span>
      ${a.tipo==="directriz"?`<b>${esc(a.texto)}</b>`:
        `<b>${esc(a.texto.replace(/https?:\/\/[^\s]+/g,"").trim()||"Referente")}</b>`+
        (a.urls||[]).map(u=>`<div class="sub"><a href="${esc(u)}" target="_blank" rel="noopener" style="color:#8f7bd8;word-break:break-all">${esc(u)}</a></div>`).join("")}
    </div>`).join("");
  $("#t-aportes").innerHTML=h;
}

/* ===== ARRANQUE ===== */
async function arranca(){
  render();
  try{E=await leerBlob();aviso("Sincronizado");}
  catch(err){aviso("Sin conexión con el guardado online",true);}
  render();
  clearInterval(window._sy);
  window._sy=setInterval(async()=>{                     // refresco suave: ver votos de los demas
    if(guardando||document.hidden)return;
    try{E=await leerBlob();render();}catch(_){}
  },25000);
}
$("#hout").onclick=salir;
$("#lclave").onkeydown=e=>{if(e.key==="Enter")$("#lquien").firstChild&&$("#lquien").firstChild.click();};
pintaLogin();
const ses=sessionStorage.getItem("mx_yo");
if(ses&&PERSONAS.includes(ses)&&localStorage.getItem("mx_clave")===CLAVE){
  YO=ses;$("#login").style.display="none";arranca();
}
</script>
