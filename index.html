const GUIONES_GRABAR=/*__GUIONES_GRABAR__*/[{"id": "JAVI-TOFU-01", "cuenta": "JAVI", "etapa": "TOFU", "titulo": "Facturas 30.000 y te queda 0", "formula": "F16 (facturación vs beneficio, «el más Javi») + F27 (hook breve, tono exagerado, un elemento visual). Elegida porque es la frase-modelo literal que pidió Javi el 13-ago («tenemos que tocar más los dolores»: facturas 30.000 y te queda 0) y porque F16 es la única fórmula del banco que ataca el síntoma exacto del ICP A: factura bien y no se queda nada.", "escena": {"donde": "Terraza de casa en Mallorca, exterior, mediodía. Mesa de madera, portátil CERRADO encima (a propósito: hoy no se mira el panel de ventas).", "plano": "Plano medio, cámara a la altura de los ojos, Javi sentado. Un solo plano, sin cortes en el hook. Camisa oscura.", "que_se_ve": "Javi sentado con la calculadora de mesa delante. Al decir la cifra del hook golpea la tecla del igual con el dedo y la deja sonar. El folio impreso se ve pero NO se lee (queda desenfocado, boca abajo). En pantalla solo hay una cifra: la del rótulo.", "atrezzo": "Calculadora de mesa grande (de las de tienda de barrio) + un folio impreso boca abajo. El elemento visual del hook es la calculadora: la golpea al decir «y te queda 0»."}, "bloques": [{"bloque": "ATENCION", "texto": "Facturas 30.000 euros al mes y a final de mes no te queda nada.", "segundos": 3, "nota_direccion": "Seco, sin saludo, empezando a mitad de idea. Subir el tono en «30.000» y bajarlo de golpe en «nada». Golpe en la calculadora justo en la palabra «nada». Cerrar antes del segundo 3."}, {"bloque": "PROBLEMA", "texto": "Y no te queda nada porque tú no miras el dinero. Miras las ventas. Abres el móvil por la mañana, ves las ventas de ayer y ya tienes el día resuelto. Lo que no abres es el banco. Y cuando lo abres, a mitad de mes, ves que hay menos que el mes pasado facturando más. No entiendes por qué. Y entonces haces lo único que sabes hacer: meterle más dinero a los anuncios. Porque vender es divertido y contar lo que te queda da miedo.", "segundos": 18, "nota_direccion": "Ritmo de conversación, no de discurso. Pausa de medio segundo antes de «Lo que no abres es el banco». La frase «da miedo» se dice mirando a cámara, sin parpadear, y se para."}, {"bloque": "SOLUCION", "texto": "Deja de medir tu negocio por lo que entra y empieza a medirlo por lo que se queda. El número que manda no es la facturación del mes. Es lo que hay en tu cuenta cuando ya has pagado todo, incluido tú. Y el día que miras ese número, dejas de querer vender más y empiezas a querer vender mejor. Una tienda que factura la mitad y se queda con el triple no es una tienda pequeña. Es la única que funciona.", "segundos": 17, "nota_direccion": "Aquí se dice QUÉ hay que mirar, nunca CÓMO se calcula (gate S2: la solución es un punto de vista, no un tutorial). Bajar el volumen y acelerar un poco: es la parte en la que se le da la vuelta a la cabeza al que mira."}, {"bloque": "PRUEBA SOCIAL", "texto": "Carlo cerró su primer mes con nosotros con un treinta por ciento de beneficio neto. No de facturación. Beneficio. Y suena raro precisamente por esto: casi nadie que tiene una tienda sabe cuál es ese número.", "segundos": 11, "nota_direccion": "Nombre y cifra dichos despacio y sin énfasis, como quien lee un dato. Cero celebración. La cifra se DICE, no se rotula (en pantalla solo va la del hook)."}, {"bloque": "CTA", "texto": "Todo esto lo miro en una hoja que hice para mí: metes lo que facturas y lo que te cuesta, y te dice lo que te queda de verdad, línea por línea. Se llama Calculadora de Margen Real y la tienes en mi perfil. Comenta MARGEN.", "segundos": 13, "nota_direccion": "Cero fricción: se nombra el recurso, se dice dónde está y se pide una sola palabra. Nada de «te lo mando». «Comenta MARGEN» se dice mirando fijo y se corta el vídeo en seco, sin despedida."}], "musica": "Sin música. Es talking puro a cámara y la pieza vive de los silencios (el golpe de calculadora y la pausa antes de «da miedo»). Meter pista aquí tapa exactamente lo que hace que la cifra caiga.", "duracion_s": 62, "texto_en_pantalla": "FACTURAS 30.000 Y TE QUEDA 0", "caption": "El número que importa no es el que sale en el panel de ventas. Es el que queda en tu cuenta cuando ya has pagado todo, incluido tú. Si nunca has visto ese número, no tienes un negocio: tienes un trabajo caro. Comenta MARGEN. #ecommerce #tiendaonline #negocio"}, {"id": "JAVI-TOFU-02", "cuenta": "JAVI", "etapa": "TOFU", "titulo": "Más anuncios no arregla tu tienda", "formula": "F7 (mata el falso culpable: «[compra que todos creen necesaria] no te va a hacer [resultado], solo te asegura que [coste] se va de tu cuenta»). Elegida porque el falso culpable número uno del ICP A es el presupuesto de anuncios, y F7 es la fórmula del banco diseñada para desmontar exactamente eso sin sonar a consejo.", "escena": {"donde": "Mesa de trabajo en interior, luz de ventana lateral. Fondo limpio (pared y una estantería), nada de lujo ni coches.", "plano": "Plano medio corto, Javi de pie apoyado en la mesa. El móvil entra en cuadro en el hook y se queda en la mano todo el bloque de problema.", "que_se_ve": "Javi con el móvil en la mano, la pantalla hacia cámara enseñando la ficha de producto de UNA TIENDA PROPIA (nunca la de un alumno). Al hablar de la foto del proveedor, hace scroll con el pulgar en directo.", "atrezzo": "El móvil con la ficha de producto abierta. El elemento visual del hook: gira el móvil hacia cámara justo al decir «no es el anuncio»."}, "bloques": [{"bloque": "ATENCION", "texto": "Le has metido 3.000 euros más a los anuncios este mes y vendes lo mismo. No es el anuncio.", "segundos": 3, "nota_direccion": "Tono exagerado en «3.000», casi de reproche, y «No es el anuncio» dicho bajo, girando el móvil a cámara. Cierra antes del segundo 3."}, {"bloque": "PROBLEMA", "texto": "Miras el panel de los anuncios veinte veces al día y la ficha de tu producto no la abres desde hace tres meses. Ábrela ahora desde el móvil, como la abre tu cliente. La foto es la del proveedor. La descripción es la que venía traducida, con esa frase rara que nadie ha leído nunca. Y el precio del envío aparece al final, cuando la persona ya ha sacado la tarjeta. Esa persona no se va porque tu anuncio sea malo. Se va porque llega a tu tienda y no se fía. Y tú, en vez de mirar eso, subes el presupuesto. Porque tocar el presupuesto se hace en diez segundos y arreglar la tienda te cuesta una semana.", "segundos": 19, "nota_direccion": "Aquí se baja al barro de verdad: se hace el gesto de abrir la ficha y se señala con el dedo cada cosa en la pantalla. Frases cortas, punto final duro. La última frase se dice con media sonrisa, sin ser simpático."}, {"bloque": "SOLUCION", "texto": "El anuncio no vende. El anuncio solo trae gente. Quien vende es tu tienda. Así que deja de pagar por traer más gente a un sitio que no convence a nadie. El dinero en anuncios multiplica lo que ya tienes: si lo que tienes es una tienda de la que nadie se fía, lo que multiplicas es eso. Arregla y luego escala. Siempre en ese orden, nunca al revés.", "segundos": 16, "nota_direccion": "Deja el móvil sobre la mesa antes de esta frase: el gesto marca el cambio de bloque. Se dice QUÉ hacer (arreglar antes), nunca el paso a paso de cómo arreglarlo."}, {"bloque": "PRUEBA SOCIAL", "texto": "Sara llevaba cuatro meses clavada en 8.000 al mes. No lanzamos ni un anuncio nuevo. Dos tardes tocando la tienda, y a los quince días estaba en 26.000.", "segundos": 11, "nota_direccion": "Plano, factual, como quien da un parte. Sin subrayar «26.000» con la voz: la cifra ya pega sola. No rotular estas cifras en pantalla."}, {"bloque": "CTA", "texto": "Si no sabes por dónde empezar a mirar tu tienda, hice una auditoría express: son las preguntas que le hago yo a una tienda antes de tocarle un euro a los anuncios. Está en mi perfil. Comenta TIENDA.", "segundos": 12, "nota_direccion": "Nombrar el recurso entero y señalar arriba con el pulgar (perfil). Cero promesa de mandar nada. Corte seco al acabar «TIENDA»."}], "musica": "Pista de percusión seca sin melodía (tipo trend, sin voz cantada), entrando en el segundo del hook y saliendo al empezar el CTA, siempre por debajo de la voz (unos -22 LUFS contra la voz a -14). Aquí sí ayuda: el bloque de problema es largo y el pulso evita que se lea como lento. Nada lento ni de piano.", "duracion_s": 61, "texto_en_pantalla": "3.000 MÁS EN ANUNCIOS Y VENDES LO MISMO", "caption": "El anuncio no vende. El anuncio solo trae gente. Si la tienda a la que llega esa gente no convence, meterle más dinero a los anuncios solo te hace perder más rápido. Arregla y luego escala, en ese orden. Comenta TIENDA. #ecommerce #tiendaonline #dropshipping"}, {"id": "JAVI-TOFU-03", "cuenta": "JAVI", "etapa": "TOFU", "titulo": "Lo pierdes en el último clic", "formula": "F10 (juicio instantáneo / analogía: «¿a qué [X] contratarías?… en menos de un segundo tu cerebro ya tiene la respuesta»), rellenada con la caja del supermercado. Elegida porque el dolor del carrito es invisible para el dueño (él nunca ha comprado en su tienda) y F10 es la fórmula que lo hace visible en una imagen, sin explicar nada técnico.", "escena": {"donde": "De pie, en la sala donde da las formaciones, con la pantalla de MENTORIUM apagada al fondo y desenfocada. Interior, luz limpia.", "plano": "Plano medio, Javi de pie. En el bloque de problema, inserto de 3 segundos grabado con el móvil: la pantalla de pago de su propia tienda, con el dedo pidiendo datos uno detrás de otro.", "que_se_ve": "Javi con el móvil en una mano y una tarjeta en la otra. En el hook levanta la tarjeta y la deja caer sobre la mesa al decir «el último clic».", "atrezzo": "Móvil + tarjeta bancaria (con los números tapados con el pulgar). El elemento visual del hook es la tarjeta cayendo."}, "bloques": [{"bloque": "ATENCION", "texto": "Te cuesta 20 euros traer a una persona a tu tienda. Y la pierdes en el último clic, el de pagar.", "segundos": 3, "nota_direccion": "Tono exagerado, casi de incredulidad. La tarjeta cae sobre la mesa exactamente en «pagar». Cerrar antes del segundo 3."}, {"bloque": "PROBLEMA", "texto": "Y no la pierdes porque tu producto sea caro. La pierdes porque le pides que se cree una cuenta. Porque le pides el documento de identidad para comprar una camiseta. Porque el precio del envío aparece al final y son nueve euros que no esperaba. Porque tu tienda solo cobra con tarjeta y esa persona paga con el móvil, como paga ya todo el mundo. Y tú esto no lo ves porque tú nunca has comprado en tu propia tienda. Has hecho un pedido de prueba, con tu tarjeta, en tu ordenador, sabiéndote los pasos de memoria. Eso no es comprar. Eso es rellenar un formulario que escribiste tú.", "segundos": 20, "nota_direccion": "Enumerar los «porque» con el dedo, uno a uno, subiendo el ritmo. El inserto del móvil entra en «le pides el documento de identidad». Las dos últimas frases, muy despacio y mirando fijo."}, {"bloque": "SOLUCION", "texto": "Deja de pensar en tu tienda como una web y piénsala como la caja de un supermercado. En una caja, cada pregunta de más es una persona que suelta el carro y se va por la puerta. Tu trabajo no es que la pantalla de pagar quede bonita. Es que sobre todo lo que se pueda quitar. Menos pasos, menos datos, menos dedos. Y esto no cuesta dinero. Cuesta una tarde.", "segundos": 16, "nota_direccion": "La analogía de la caja es el corazón de la pieza: decirla despacio y dejarla respirar medio segundo antes de seguir. Nunca listar los pasos concretos (gate S2)."}, {"bloque": "PRUEBA SOCIAL", "texto": "Cristian llevaba seis meses clavado en 18.000 al mes. Entre otras cosas le tocamos cómo se paga en su tienda. Cerró en 47.000.", "segundos": 10, "nota_direccion": "Honesto con el «entre otras cosas»: no se le cuelga todo el resultado a un solo cambio. Dicho sin épica, tres frases secas."}, {"bloque": "CTA", "texto": "Los sitios por los que se te va la gente entre que le da a comprar y paga son siempre los mismos siete. Los tengo listados uno a uno, con lo que hay que quitar en cada uno. Se llama Las 7 fugas del carrito y está en mi perfil. Comenta CARRITO.", "segundos": 12, "nota_direccion": "Recurso nombrado y ubicación clara. Ni una palabra sobre mandar nada por privado. Corte en seco después de «CARRITO»."}], "musica": "Sin música. Es la pieza más incómoda de las cuatro y funciona por acumulación de «porque»: una pista debajo suaviza justo lo que tiene que doler. Además el inserto del móvil lleva su propio sonido de interfaz, que aquí es contenido, no ruido.", "duracion_s": 61, "texto_en_pantalla": "20 EUROS PARA PERDERLO EN EL ÚLTIMO CLIC", "caption": "Nunca has comprado en tu propia tienda. Has hecho un pedido de prueba sabiéndote los pasos de memoria, y eso no es comprar. Cada dato de más que pides en la pantalla de pagar es una persona que se va. Comenta CARRITO. #ecommerce #tiendaonline #ventas"}, {"id": "JAVI-TOFU-04", "cuenta": "JAVI", "etapa": "TOFU", "titulo": "Una devolución de cada diez y trabajas gratis", "formula": "F15 (si haces menos de X estás quebrado + «hagamos los cálculos» en voz alta). Elegida porque la devolución es el agujero que el ICP A no cuenta nunca en su cabeza, y F15 es la única fórmula del banco que autoriza hacer la cuenta delante de la cámara sin que suene a clase.", "escena": {"donde": "Mesa de trabajo con una caja de cartón abierta encima, etiqueta de devolución pegada. Interior, fondo neutro.", "plano": "Plano medio picado suave para que se vea la caja en la mesa. Javi de pie, apoyado, hablando hacia abajo a la caja y luego a cámara.", "que_se_ve": "Javi abre la solapa de la caja en el hook y la vuelve a cerrar. Durante el cálculo va apoyando la mano en la caja en cada número, como si contara sobre ella.", "atrezzo": "Caja de cartón de una devolución real con la etiqueta de vuelta pegada (dirección tapada). El elemento visual del hook es abrir la caja."}, "bloques": [{"bloque": "ATENCION", "texto": "Si te devuelven un pedido de cada diez, estás trabajando gratis. Y no lo digo por decir, hagamos la cuenta.", "segundos": 3, "nota_direccion": "Abrir la caja en «devuelven» y cerrarla de golpe en «gratis». Tono exagerado en «gratis», y «hagamos la cuenta» dicho ya bajando, en tono de quien se sienta a hacerlo."}, {"bloque": "PROBLEMA", "texto": "Tú crees que una devolución te cuesta el producto. Un pedido de 60 euros. El producto te cuesta 22. Traer a esa persona te ha costado 18. El envío de ida, 5. La vuelta la pagas tú, otros 5. La comisión del cobro no te la devuelven entera. Y el producto vuelve abierto, usado, sin la caja, así que ya no lo vendes a precio completo. Ese pedido no te ha costado 22 euros. Te ha comido el beneficio de otros tres pedidos buenos. Por eso cierras el mes con más ventas que nunca y con menos dinero que nunca en la cuenta.", "segundos": 21, "nota_direccion": "Ir tocando la caja en cada cifra, ritmo de cuenta, sin prisa. Es el único guion de la tanda donde se encadenan cifras habladas: se dicen a mano, ninguna se rotula en pantalla. Parada larga antes de la última frase."}, {"bloque": "SOLUCION", "texto": "Deja de tratar la devolución como algo que pasa después de vender. La devolución se decide antes: en la foto que le enseñaste, en la medida que no pusiste, en el plazo que prometiste y no cumpliste. Una devolución no es un cliente arrepentido. Es un cliente al que le vendiste otra cosa. Y el día que empiezas a contar lo que te cuesta cada una, dejas de perseguir más pedidos y empiezas a perseguir pedidos que se quedan.", "segundos": 17, "nota_direccion": "Apartar la caja de un empujón antes de esta frase. Aquí no se explica cómo se arregla la ficha: solo se le cambia el sitio al problema. Cierre del bloque con punto final duro."}, {"bloque": "PRUEBA SOCIAL", "texto": "Carlos tenía una tienda de moda comida por las devoluciones. Le cambiamos cómo enseñaba el producto y se le quedaron en menos de la mitad. Mismo producto, misma tienda.", "segundos": 10, "nota_direccion": "Sin porcentajes en negativo ni en pantalla (se dice «menos de la mitad», que es lo mismo dicho en positivo). Tono de parte, cero celebración."}, {"bloque": "CTA", "texto": "Hice una calculadora que te dice lo que te cuesta de verdad cada devolución, con todo dentro, no solo el producto. Es la misma que uso con las tiendas que llevo. Está en mi perfil. Comenta DEVOLUCIÓN.", "segundos": 12, "nota_direccion": "Recurso nombrado + dónde está + una palabra. Nada de privado, nada de enlaces. Corte seco tras la palabra clave."}], "musica": "Pista de tensión mínima (bajo y pulso, sin melodía ni voz), solo durante el bloque de la cuenta y cortada de golpe en «menos dinero que nunca en la cuenta». Justificación: la enumeración de cifras necesita un pulso que la empuje, y el corte de la música al final del cálculo es lo que remata el golpe. Fuera en el resto de la pieza.", "duracion_s": 63, "texto_en_pantalla": "UNA DEVOLUCIÓN DE CADA DIEZ Y TRABAJAS GRATIS", "caption": "Una devolución no te cuesta el producto. Te cuesta el producto, lo que pagaste por traer a esa persona, los dos envíos, la comisión y lo que ya no puedes cobrar por algo abierto. Por eso cierras meses con más ventas y menos dinero. Comenta DEVOLUCIÓN. #ecommerce #tiendaonline #logistica"}, {"id": "JM-01", "cuenta": "JAVI", "etapa": "MOFU", "titulo": "Margen contra facturacion: el numero grande no paga el alquiler", "formula": "F16 · FACTURACION vs BENEFICIO («el mas Javi», g.48 del T02) rellenada con el modelo que el mismo pidio el 13-ago («facturas 30.000 y te queda 0»), disparada con el tono exagerado de F27 (hook de 2 s, un elemento visual). Se elige F16 porque es MOFU de solucion: el paradigma es «defiende el numero de abajo», no un procedimiento.", "escena": {"donde": "Terraza exterior de Mallorca, mesa de trabajo con el mar detras y luz de dia (nada de coches, nada de lujo: eso es de Jordi). Grabar entre las 10 y las 12 para tener luz plana en la cara.", "plano": "Plano medio sentado, camara a la altura de los ojos, Javi ligeramente girado hacia la mesa. Un unico plano fijo de principio a fin, sin cortes; los insertos se meten en edicion.", "que_se_ve": "Javi de camisa oscura, sentado, con una libreta abierta sobre la mesa y un boligrafo en la mano. En el segundo 1 levanta la libreta hacia camara: se ve una columna de numeros escritos a mano y el ultimo tachado con una raya. Fondo limpio, sin gente detras.", "atrezzo": "La libreta con los numeros a mano y la ultima cifra tachada — es el visual recurrente de Javi (diagnostico de tienda a boligrafo) y se entiende en mute: entra mucho, se tacha, no queda nada."}, "bloques": [{"bloque": "ATENCION", "texto": "No me importa lo que factures. Dime lo que te queda a final de mes y ahi hablamos. Porque puedes vender treinta mil al mes y llegar al dia veintiocho mirando el banco con el culo apretado.", "segundos": 9, "nota_direccion": "Seco y subido de volumen desde la primera silaba, sin saludo y sin sonrisa. Mirada fija a camara. Levanta la libreta justo en «treinta mil» y la deja caer sobre la mesa en «no me importa». Cero pausa antes de arrancar: el segundo 0 ya es contenido."}, {"bloque": "PROBLEMA", "texto": "Y no entiendes por que. Pagas el producto. Pagas el envio, que no era gratis, lo pagabas tu. Pagas los anuncios. Pagas la comision de la pasarela. Pagas la devolucion del tio que se arrepintio a los dos dias. Pagas al chaval que contesta los mensajes. Y cuando terminas de pagar, lo que queda no te da ni para el alquiler. Pero el numero grande de la pantalla es bonito. Asi que se lo enseñas a tus colegas, dices que va bien, y sigues. Eso no es un negocio. Es un trabajo caro que ademas te pagas tu.", "segundos": 22, "nota_direccion": "Ritmo de lista, un golpe por linea, sin subir el tono: monotono a proposito, como quien lee una factura. Va tocando la mesa con el dedo en cada «pagas». Pausa seca de un segundo entero antes de «Eso no es un negocio»."}, {"bloque": "SOLUCION", "texto": "Deja de perseguir el numero de arriba y empieza a defender el de abajo. Lo que facturas es lo que entra. El margen es lo que te dejas robar por el camino. El dia que sepas exactamente lo que te cuesta cada venta, dejas de necesitar vender mas para vivir mejor. La mayoria coge una tienda que pierde en cada pedido, le mete mas anuncios encima y a eso le llama crecer. Eso no es crecer. Es perder mas rapido y con mas volumen.", "segundos": 18, "nota_direccion": "Baja el volumen, sube la autoridad: aqui habla despacio y mira sin parpadear. Es el bloque que NO se explica — no se dice como se calcula nada, solo que hay que mirar ahi. Si te dan ganas de dar el paso a paso, callate: eso es lo que se vende."}, {"bloque": "PRUEBA SOCIAL", "texto": "Mi alumno Carlo no hizo su primer mes bueno facturando mas. Lo hizo quedandose el treinta por ciento limpio. Treinta por ciento de beneficio, no de ventas. Que es exactamente lo que el ochenta por ciento del sector no sabe decirte de su propia tienda.", "segundos": 10, "nota_direccion": "Aqui no sonrias, es un dato. La cifra se DICE, no se rotula: el unico numero que aparece escrito en toda la pieza es el del hook. Ojo al nombre: es CARLO, sin ese — es otro alumno distinto de CARLOS, el del guion JM-03. Ficha: _casos_exito/caso_Carlo_30_beneficio.md."}, {"bloque": "CTA", "texto": "Tengo montada una calculadora de margen real. Metes lo que te cuesta el producto, el envio, la pasarela y los anuncios, y te dice lo que te queda de cada venta. Nada mas. Es lo primero que le hago mirar a cualquiera que entra diciendo que factura mucho y no le llega. Comenta MARGEN y la tienes en mi bio.", "segundos": 12, "nota_direccion": "Cero friccion: una sola palabra que comentar, dicha despacio y separada. NO se promete mandar nada por privado (sancion de links viva hasta el 19-ago): el recurso se nombra y se deja en bio, punto. Cierre seco, corta ahi, sin despedida."}], "musica": "Sin musica. Es talking puro a camara y el argumento es una lista de costes: cualquier pista de fondo se come la cadencia de los «pagas» y le quita el tono de factura. Medido en los referentes del nicho (ads y talking de Pau/Ramiro): el talking a camara de este tipo va seco.", "duracion_s": 71, "texto_en_pantalla": "FACTURAS 30.000 Y NO TE QUEDA NADA", "caption": "Vender mucho y quedarte con poco no es un negocio: es un trabajo caro que te pagas tu. El numero grande de la pantalla no paga el alquiler a final de mes. Comenta MARGEN y tienes la calculadora en la bio. #ecommerce #tiendaonline #dropshipping"}, {"id": "JM-02", "cuenta": "JAVI", "etapa": "MOFU", "titulo": "Tu ficha de producto decide si eres una tienda o un montaje", "formula": "F10 · JUICIO INSTANTANEO con analogia (g.14 del T02: «¿a que profesional contratarias?… en menos de un segundo tu cerebro ya tiene la respuesta»). Se elige porque el tema es percepcion, y F10 mete al espectador dentro de la decision antes de hablarle de su tienda. La solucion se queda en paradigma (que responde la ficha), nunca en como se escribe.", "escena": {"donde": "Interior, mesa de trabajo con pared lisa detras y una ventana lateral como luz. Sin la pantalla del evento detras: esta pieza es de tu a tu, no de autoridad.", "plano": "Plano medio corto (pecho y cabeza). El movil entra en cuadro a la altura de la cara. Inserto en edicion: grabacion de pantalla del movil recorriendo una ficha de producto de una tienda propia — nunca de un alumno ni de un competidor identificable.", "que_se_ve": "Javi con el movil en la mano, girandolo hacia camara en el hook. En pantalla del movil, una ficha de producto con foto de proveedor, fondo blanco quemado y titulo con palabras en ingles. Cuando pasa al inserto, se ve el dedo bajando por la ficha y parandose donde no hay nada.", "atrezzo": "El movil con la ficha de producto mala abierta. Es el elemento visual del hook: se entiende en mute — se ve una ficha cutre antes de que diga una palabra."}, "bloques": [{"bloque": "ATENCION", "texto": "¿A que fontanero llamarias? ¿Al de la furgoneta abollada y sin nombre, o al de la furgoneta rotulada? Ya lo has decidido. Has tardado menos de un segundo. Con tu ficha de producto pasa exactamente lo mismo, y a ti nadie te llama.", "segundos": 10, "nota_direccion": "Tono de pregunta real, no retorica: para medio segundo despues de cada opcion como si esperase respuesta. En «ya lo has decidido» gira el movil a camara. Exagera el gesto, no la voz."}, {"bloque": "PROBLEMA", "texto": "Tu ficha lleva la foto que te paso el proveedor, con el fondo quemado y la marca de agua en la esquina. El titulo es el que venia en el archivo, con dos palabras en ingles que no busca nadie. La descripcion son cuatro lineas copiadas de otra tienda que tampoco vende. No hay ni una foto del producto puesto en una casa de verdad. No dice cuanto tarda en llegar. No dice que pasa si no le gusta. Y luego te preguntas por que la gente mete el producto en el carrito y desaparece. No desaparece por el precio. Desaparece porque no se fia. Y tu no le has dado ni un motivo para fiarse.", "segundos": 23, "nota_direccion": "Aqui va el inserto de pantalla, la voz sigue por encima. Ritmo rapido y acumulativo, sin respirar entre frases, hasta «desaparece». Ahi para en seco un segundo y vuelve la cara a camara para las dos ultimas frases."}, {"bloque": "SOLUCION", "texto": "Deja de pensar en la ficha como el sitio donde pones informacion del producto. Es el unico sitio donde alguien que no te conoce de nada decide si eres una tienda o un montaje. No va de escribir mas. Va de que todo lo que ve responda a la unica pregunta que tiene en la cabeza: si te doy mi tarjeta, ¿me la juegas o no? Cuando la ficha contesta eso, dejas de tener que bajar el precio para vender.", "segundos": 17, "nota_direccion": "Bajar el ritmo entero, casi susurro en «si te doy mi tarjeta». Cero pasos, cero checklist, cero «lo primero que tienes que hacer es». Se dice QUE tiene que resolver la ficha, no COMO se monta."}, {"bloque": "PRUEBA SOCIAL", "texto": "Mi alumna Sara llevaba cuatro meses clavada en la misma cifra. No cambio de producto. No busco otro nicho. No toco ni un anuncio. Se puso a arreglar lo que ve el cliente antes de pagar, y en quince dias multiplico por tres lo que le quedaba limpio cada mes.", "segundos": 11, "nota_direccion": "Frases cortas y afirmativas, contando los «no» con los dedos. La cifra se dice y no se rotula. Ficha validada: _casos_exito/caso_Sara_8K_a_26K_hogar_3x_cash.md (documentado 3,2x cash en 15 dias; decimos «por tres» para quedarnos cortos, nunca de mas)."}, {"bloque": "CTA", "texto": "Tengo un auditor de fichas de producto. Le pasas tu ficha y te dice que le falta para que el que entra se fie: que foto no esta, que no estas contando y donde se cae. Es gratis y esta en mi bio. Comenta FICHA.", "segundos": 10, "nota_direccion": "El «comenta FICHA» va al final, solo, separado del resto y mirando a camara. Nada de mandar links por privado. Ni un emoji en el rotulo ni en la pantalla. Corte seco al terminar la palabra."}], "musica": "Pista instrumental de fondo, baja, solo por debajo del inserto de pantalla (del bloque PROBLEMA), y fuera en cuanto vuelve la cara. Del pack D:\\PACK_EDICION\\PACKS\\MÚSICA DE FONDO, usando una verificada SIN voz cantada — la unica confirmada instrumental es AFTER HOURS INSTRUMENTAL. Nada lento ni funebre: por encima de 90 BPM y siempre por debajo del nivel de la voz.", "duracion_s": 71, "texto_en_pantalla": "TU FICHA SE VE BARATA Y POR ESO NO SE FIAN", "caption": "El que entra en tu tienda decide si se fia antes de mirar el precio. Si tu ficha es la que te dio el proveedor, ya se ha ido y no vuelve. Comenta FICHA y tienes el auditor en la bio. #ecommerce #tiendaonline #shopify"}, {"id": "JM-03", "cuenta": "JAVI", "etapa": "MOFU", "titulo": "El pedido que mas ilusion te hace es el que mas caro te sale", "formula": "F21 · CONTRAINTUITIVO PURO de Ramiro («el que mas X es el que menos Y»), aplicado al pedido que vuelve. Se elige porque el envio y la devolucion son un coste invisible: la formula obliga a colocar el dolor donde el dueño no lo esta mirando. La solucion es reencuadre (coste fijo previsto), no procedimiento de logistica.", "escena": {"donde": "Zona de almacen o rincon de casa con una mesa y cajas apiladas detras. Luz normal, nada de estudio. Si no hay almacen, vale la misma mesa de trabajo con dos cajas encima.", "plano": "Plano medio de pie, camara fija a la altura del pecho. Inserto en edicion: primer plano cenital de la caja abierta con la etiqueta de devolucion y el producto dentro, mal recolocado.", "que_se_ve": "Javi de pie con una caja de carton abierta en las manos. La empuja hacia camara en el hook y la deja caer sobre la mesa. Dentro se ve el producto devuelto con el plastico ya roto. La etiqueta de devolucion pegada encima, bien legible.", "atrezzo": "La caja de devolucion abierta con la etiqueta pegada. Es el elemento visual del hook y se lee en mute: caja que vuelve, producto ya no vendible."}, "bloques": [{"bloque": "ATENCION", "texto": "En tu tienda, el pedido que mas ilusion te hace es el que mas dinero te quita. Y no te enteras hasta que abres el buzon y ves esto.", "segundos": 8, "nota_direccion": "Empieza ya con la caja en las manos. Sube el tono en «mas dinero te quita» y empuja la caja hacia el objetivo justo en «esto». Sin saludo, sin presentacion, sin sonrisa."}, {"bloque": "PROBLEMA", "texto": "Vendes un producto de cuarenta euros. Te alegras. Pagas el envio, que no era gratis, lo pagas tu. El cliente lo recibe, no le convence, lo devuelve. Pagas la vuelta. Llega con la caja reventada y el plastico roto, o sea que ya no lo puedes vender como nuevo. Le devuelves el importe y la pasarela se queda su comision igual, esa no vuelve. Ese pedido no te ha dado cero. Te ha dado menos que cero. Y encima has perdido una hora contestando mensajes. Y esto no te pasa una vez al mes. Te pasa en uno de cada tantos pedidos y no lo tienes apuntado en ningun sitio. Por eso las cuentas no te cuadran nunca.", "segundos": 24, "nota_direccion": "Va sacando el producto de la caja mientras habla y lo deja en la mesa, roto, a la vista. Ritmo de lista otra vez pero mas rapido que en JM-01. Pausa seca antes de «Te ha dado menos que cero». Que se le note el hartazgo, no el drama."}, {"bloque": "SOLUCION", "texto": "El envio y la devolucion no son papeleo. Son parte del precio de tu producto. Y si no estan dentro del precio, los estas pagando tu de tu bolsillo cada vez que vendes. Deja de tratar la devolucion como mala suerte y empieza a tratarla como lo que es: un coste que ya sabes que va a pasar. El que vive de esto no es el que devuelve menos. Es el que ya lo tenia contado antes de vender el primer pedido.", "segundos": 17, "nota_direccion": "Deja la caja, apoya las dos manos en la mesa y habla mas despacio. Aqui NO se dice cuanto hay que meter en el precio ni como se calcula: solo que va dentro. Es la linea entre dar perspectiva y regalar el producto."}, {"bloque": "PRUEBA SOCIAL", "texto": "Mi alumno Carlos vendia lo mismo, al mismo cliente, con los mismos anuncios. Lo unico que cambio fue lo que le llegaba al cliente a casa: su marca, su caja, su nota dentro. Las devoluciones le bajaron a menos de la mitad. Mismo producto, la mitad de vueltas.", "segundos": 11, "nota_direccion": "Levanta la caja mala en «lo que le llegaba a casa» para que se entienda la comparacion sin decirla. Ficha validada: _casos_exito/caso_Carlos_drop_a_marca_32pct_margen.md (documentado -60% devoluciones tras marcar el SKU). Decimos «menos de la mitad», que se queda corto respecto al dato: nunca al reves. Ojo: es CARLOS, distinto de CARLO (JM-01)."}, {"bloque": "CTA", "texto": "Tengo una calculadora de rentabilidad por producto. Metes el precio, lo que te cuesta, el envio y las devoluciones, y te dice si ese producto te da de comer o te lo estas pagando tu. Esta en mi bio. Comenta ENVIO y la miras esta noche.", "segundos": 11, "nota_direccion": "Dilo con la caja todavia en cuadro. Una sola palabra clave, ENVIO, dicha aparte y despacio. Cero promesa de mandarlo por privado. Corte seco."}], "musica": "Pista instrumental baja solo bajo el inserto cenital de la caja (bloque PROBLEMA), fuera el resto. Misma fuente que JM-02: pack D:\\PACK_EDICION\\PACKS\\MÚSICA DE FONDO, pista verificada sin voz cantada, por encima de 90 BPM y por debajo del nivel de la voz. Pista DISTINTA a la de JM-02: en la misma semana no se repite cancion.", "duracion_s": 71, "texto_en_pantalla": "EL PEDIDO QUE VUELVE NO TE DEJA A CERO. TE DEJA POR DEBAJO", "caption": "El pedido que vuelve no te deja a cero: te deja por debajo. Y casi nadie lo tiene apuntado en ningun sitio, por eso las cuentas no cuadran. Comenta ENVIO y tienes la calculadora en la bio. #ecommerce #tiendaonline #logistica"}, {"id": "JM-04", "cuenta": "JAVI", "etapa": "MOFU", "titulo": "Elegir producto antes que cliente es el bucle en el que llevas meses", "formula": "F8 · CONTRA-CONSEJO («[lo que todos recomiendan] es de idiota. Usalo para [reencuadre]», g.7 del T02). Se elige porque el tema exige tumbar la conducta numero uno del ICP B (buscar producto ganador) y F8 es la unica del banco que ataca de frente sin sonar a consejo. La solucion es cambio de orden mental, no metodo de investigacion.", "escena": {"donde": "Sala de la formacion o aula con la pantalla de MENTORIUM apagada detras, o mesa de trabajo con el portatil cerrado. Sin alumnos en cuadro (si aparece alguien, hay que tener su nombre validado por Javi).", "plano": "Plano medio sentado, camara fija a la altura de los ojos. Un folio sobre la mesa. En el segundo 2 lo gira hacia camara.", "que_se_ve": "Javi sentado con un folio delante escrito a mano en dos columnas: a la izquierda QUE VENDO, tachado con una raya gorda; a la derecha A QUIEN SE LO VENDO, subrayado dos veces. Lo levanta a camara y lo deja apoyado en la mesa, visible el resto de la pieza.", "atrezzo": "El folio con las dos columnas, una tachada y otra subrayada. Es el elemento visual del hook: el orden correcto se entiende sin sonido."}, "bloques": [{"bloque": "ATENCION", "texto": "Buscar el producto ganador antes de saber a quien se lo vas a vender es de idiota. Y es literalmente lo primero que hace todo el mundo, incluido tu.", "segundos": 8, "nota_direccion": "Tono duro, sin sonreir ni suavizar despues. Gira el folio a camara justo en «es de idiota» y lo deja apoyado. El «incluido tu» va mas bajo, casi en confianza."}, {"bloque": "PROBLEMA", "texto": "Llevas tres semanas viendo videos de productos ganadores. Tienes una lista en el movil con doce cosas. Un aparato para el cuello, una lampara, un cacharro para el coche. Y no me sabes decir quien compra eso. Ni que edad tiene. Ni que le preocupa a las once de la noche. Ni por que te lo compraria a ti hoy en vez de esperarse dos dias y pedirlo mas barato en otro sitio. Asi que abres la tienda, subes el producto, pones anuncios a todo el mundo, y se te va el dinero sin que compre nadie. Y en vez de parar y preguntarte a quien le hablabas, cambias de producto. Y otra vez. Y otra. Ese es el bucle, y llevas meses dentro.", "segundos": 24, "nota_direccion": "Va enumerando con el movil en la mano como si leyera la lista. Acelera segun avanza la enumeracion y frena en seco en «Ese es el bucle». Ultimo golpe mirando fijo: «y llevas meses dentro»."}, {"bloque": "SOLUCION", "texto": "Un producto no funciona ni deja de funcionar solo. Funciona dentro de un grupo de gente concreto que ya tiene un problema y ya esta pagando por quitarselo. Elige primero a esa gente. Cuando sabes a quien le hablas, el producto casi se elige solo, y el que te copie el producto no te copia el negocio. Al reves no funciona nunca: con el producto ya elegido y sin saber a quien, cada venta que entra es un golpe de suerte, y un golpe de suerte no se puede repetir el mes que viene.", "segundos": 17, "nota_direccion": "Aqui baja el ritmo del todo y coge el folio otra vez, señalando la columna subrayada. Cero metodo: no se dice donde se busca a esa gente ni con que herramienta. Solo el orden."}, {"bloque": "PRUEBA SOCIAL", "texto": "Mi alumno Cristian no vende de todo a todo el mundo. Tiene una tienda de un nicho concreto, cocina, y estuvo seis meses clavado en la misma cifra hasta que dejo de tocar el producto. Ahora esta abriendo Mexico y despues va a por Estados Unidos. Mismo producto, otra gente delante.", "segundos": 11, "nota_direccion": "Neutro y factual, sin entusiasmo. Ficha validada: _casos_exito/caso_Cristian_18K_a_47K_cocina.md (nicho cocina, 6 meses estancado; la apertura de Mexico y Estados Unidos es cita literal suya de la entrevista). No se dice ninguna cifra de facturacion suya: en esta pieza no hace falta y la unica cifra escrita es la del rotulo."}, {"bloque": "CTA", "texto": "Tengo un validador de producto. Contestas cuatro cosas sobre a quien se lo vendes y te dice si eso es un producto de verdad o un capricho tuyo de esta semana. Es gratis y esta en mi bio. Comenta MERCADO.", "segundos": 10, "nota_direccion": "El «Comenta MERCADO» va suelto al final, dos segundos de silencio antes. Nada de privados, nada de «te lo paso». Corte seco justo despues de la palabra, sin despedirse."}], "musica": "Sin musica. Es el guion mas confrontativo de la tanda y va a plano fijo: el silencio entre «Ese es el bucle» y «y llevas meses dentro» solo funciona si no hay nada sonando debajo. Talking puro a camara, seco, como el resto de piezas de Javi que han funcionado.", "duracion_s": 70, "texto_en_pantalla": "LLEVAS 12 PRODUCTOS Y NINGUN CLIENTE", "caption": "Un producto no funciona solo. Funciona dentro de un grupo de gente concreto que ya tiene el problema. Elige antes a quien y el producto casi se elige solo. Comenta MERCADO y tienes el validador en la bio. #ecommerce #tiendaonline #emprender"}, {"id": "JAVI-BOFU-01", "cuenta": "JAVI", "etapa": "BOFU", "titulo": "El numero grande no es tuyo", "formula": "F16 · FACTURACION vs BENEFICIO (el mas «Javi», guion 48 de Santi T02) rellenada con el modelo literal que pidio Javi el 13-ago («facturas 30.000 y te queda 0»), rematada con F23 de Ramiro en el bloque PROBLEMA (sintoma crudo + porque). Se elige esta y no otra porque el BOFU de Javi es romper objeciones y su objecion nº1 del ICP A es «necesito facturar mas»: aqui se le quita de la cabeza sin tutorial, que es el gate S2 de Santi.", "escena": {"donde": "Dentro de su almacen propio, de pie en el pasillo entre dos estanterias de cajas. Fondo real de trabajo, cero decorado, cero coche, cero lujo (eso es de Jordi).", "plano": "Plano medio, camara a la altura de los ojos, el de pie. Camara fija sobre tripode, cero movimiento en el hook. Insertos cortos de b-roll del almacen (cajas, etiquetas de envio) durante PROBLEMA para que no sea plano fijo de 76 s.", "que_se_ve": "Javi de pie con camisa oscura, cajas y estanterias detras. En el bloque PROBLEMA, insertos de 1,5-2 s: una etiqueta de envio saliendo de la impresora, una caja de devolucion abierta, la puerta del almacen. En el bloque PRUEBA SOCIAL, inserto de sala llena del evento (material de _WORK_EVENTO_JAVI). Ningun dashboard suelto y ningun numero mas en pantalla aparte del rotulo del hook.", "atrezzo": "Un fajo de albaranes de pedidos en la mano. Lo levanta en el segundo 0 (elemento visual del hook, gate S4 de Santi) y va soltando hojas al suelo, una por cada cosa que paga, durante el bloque PROBLEMA."}, "bloques": [{"bloque": "ATENCION", "texto": "Facturas treinta mil al mes y no puedes pagarte un sueldo. Y ademas te da verguenza contarlo.", "segundos": 5, "nota_direccion": "Hook hablado: arranca a media idea, cero saludo, cero presentacion. Tono exagerado hacia arriba en «treinta mil» y seco en «verguenza». Levanta el fajo de albaranes en el segundo 0 y lo sostiene. La frontera hook-cuerpo tiene que caer en 1,8-3,5 s (hook hablado, es Javi): el corte va justo despues de «treinta mil al mes». Sin musica hasta aqui."}, {"bloque": "PROBLEMA", "texto": "Y sabes perfectamente lo que pasa. Entra el pedido, suena la campanita, subidon. Luego pagas al proveedor. Pagas el transporte. Pagas la devolucion del que se equivoco de talla. Y pagas los anuncios de ayer para vender lo de hoy. Abres el banco a final de mes y hay menos que el mes pasado. Y como en tu cabeza esto se arregla vendiendo mas, metes mas. Ahora vendes mas, trabajas mas, y sigues sin cobrar tu.", "segundos": 23, "nota_direccion": "Bajar al barro: cada «pagas» va con una hoja del fajo cayendo al suelo, ritmo de metralleta, sin respirar entre ellas. Pausa de un segundo entero antes de «y sigues sin cobrar tu», mirando a camara. Aqui entran los insertos de almacen para picar el plano. La musica entra por debajo en el segundo 5, muy baja."}, {"bloque": "SOLUCION", "texto": "Deja de perseguir el numero de arriba. Ese numero no es tuyo. Es del proveedor, del transportista y de la plataforma. Tu solo tienes uno: lo que queda cuando ya has pagado a todo el mundo. Y en el momento en que empiezas a mirar ese, las decisiones se toman solas. Que producto se queda. A quien dejas de pagar. Que anuncio apagas hoy mismo. No necesitas vender mas. Necesitas dejar de regalar lo que ya estas vendiendo.", "segundos": 22, "nota_direccion": "Es un cambio de mirada, NO un paso a paso: no se explica como se calcula nada (gate S2 de Santi, si lo explica regala el producto). Tono mas bajo y mas lento que el bloque anterior, casi de consejo. Suelta el fajo entero en «no es tuyo». La ultima frase, seca, cortada, sin sonrisa."}, {"bloque": "PRUEBA SOCIAL", "texto": "Una alumna mia con una tienda de hogar estaba exactamente aqui. No tocamos el producto. No subimos ni un euro de inversion. Cambiamos lo que miraba cada manana antes de decidir nada. Hoy le queda el triple en la cuenta con la misma tienda.", "segundos": 14, "nota_direccion": "Sin nombre (regla 8: en pieza publica el nombre del alumno se tapa; el caso esta validado en _casos_exito/caso_Sara_8K_a_26K_hogar_3x_cash.md). Cero pantallazo de dashboard suelto: aqui va el inserto de la sala llena del evento, que es la prueba social que Javi exige («que se vea que hay gente real»). Tono de dato, no de venta. «El triple» va dicho, NO escrito en pantalla."}, {"bloque": "CTA", "texto": "Te he dejado la CALCULADORA DE MARGEN REAL. Metes lo que te cuesta el producto, el envio y lo que gastas en anuncios, y te dice en un minuto lo que te queda de verdad por cada pedido. Es lo primero que abrimos el primer dia con cada alumno que entra. Comenta MARGEN y la dejo fijada arriba. Esta en mi biografia.", "segundos": 12, "nota_direccion": "Recurso REAL en disco: 06_HERRAMIENTAS_HTML/calculadora_margen_real.html. CANDADO: no se promete mandar nada por privado (la sancion de links por DM de Javi sigue viva hasta el 19-ago) — se pide comentario, el recurso se nombra y vive en la bio. Palabra clave MARGEN dicha despacio y separada, tipo boton. Cero friccion: una sola palabra, nada de «escribeme», nada de «si te interesa». Final cortado limpio, sin despedida."}], "musica": "Pista trend suave (biblioteca de virales de USA/Espana, no del nicho), instrumental, ENTRA en el segundo 5 — el hook va a voz limpia para que la primera frase pegue sola. Nivel 12 dB por debajo de la voz durante todo el cuerpo y bajada extra de 3 dB en PRUEBA SOCIAL para que el dato se oiga. No es un ad: aqui manda la voz, la musica solo evita el silencio muerto de un talking de 76 s.", "duracion_s": 76, "texto_en_pantalla": "30.000 AL MES Y NO TE PAGAS UN SUELDO", "caption": "El numero grande no es tuyo. Es del proveedor, del transportista y de la plataforma. Lo tuyo es lo que queda cuando ya has pagado a todo el mundo. Comenta MARGEN y lo dejo fijado arriba. #ecommerce #tiendaonline #mentoria"}, {"id": "JAVI-BOFU-02", "cuenta": "JAVI", "etapa": "BOFU", "titulo": "Tu momento no existe", "formula": "F17 · ORIGEN / MENTOR (guiones 45 y 53 de Santi T02: «tengo X y he hecho Y, y no, no lo hice por el atajo que sospechas, tampoco vengo de privilegio») cruzada con F12 · ESPEJO INCOMODO DE VIDA. Se elige porque el BOFU de Javi es creencias limitantes y esta es la unica pieza donde su autoridad real (exfutbolista, entrenador personal, 8-9 anos, almacen y equipo propio) es EL argumento y no un adorno. F17 permite dar autoridad sin tocar cifras de facturacion.", "escena": {"donde": "El despacho pequeno dentro del almacen. Se ve la puerta al almacen al fondo, con las estanterias desenfocadas. Realista y suyo, cero lujo.", "plano": "Plano medio corto, sentado en el borde de la mesa (no en la silla), camara ligeramente por debajo de los ojos. Un solo plano largo con dos o tres insertos muy cortos de b-roll del almacen y del equipo trabajando para picar el ritmo.", "que_se_ve": "Javi sentado en el borde de la mesa, portatil cerrado a un lado. En PRUEBA SOCIAL, insertos de 1,5 s: gente del equipo trabajando en el almacen y un plano de la sala del evento llena. Ningun numero en pantalla en toda la pieza aparte del rotulo del hook.", "atrezzo": "Una mancuerna de gimnasio encima de la mesa del despacho, al lado del portatil. La coge en el segundo 0 (elemento visual del hook: no pega nada ahi, y por eso frena el scroll) y la deja de golpe sobre la mesa al empezar el bloque SOLUCION."}, "bloques": [{"bloque": "ATENCION", "texto": "Llevas dos anos diciendo que no es tu momento. No es el momento. Eres tu, que te da miedo.", "segundos": 4, "nota_direccion": "Cero saludo. Coge la mancuerna en el frame 0, la sostiene a la altura del pecho mientras habla. Tono exagerado y bajo, casi acusador, sin sonreir. Pausa dura entre «no es el momento» y «eres tu». Frontera hook-cuerpo a los 2,5 s aprox (hook hablado)."}, {"bloque": "PROBLEMA", "texto": "Y no te da miedo el ecommerce. Te da miedo que salga mal y que se entere tu cunado. Por eso llevas meses eligiendo el nombre, mirando plantillas, cambiando el logo y viendo videos de gente montando tiendas. Eso no es prepararte. Eso es esconderte con cara de estar trabajando. Y a ti te vale, porque mientras estas eligiendo el nombre todavia no has fracasado. El dia que abras, ya se puede saber si vales o no. Y eso es lo que no quieres saber.", "segundos": 23, "nota_direccion": "Aqui esta el barro: no describe una situacion, describe la conducta exacta y le pone el motivo real detras. Ritmo rapido en la lista («el nombre, plantillas, el logo, videos»), y freno total en «y eso es lo que no quieres saber», mirando fijo. Sin musica: aqui la incomodidad la da el silencio."}, {"bloque": "SOLUCION", "texto": "Deja de intentar estar preparado. No vas a estarlo nunca, ni yo lo estoy hoy. Cambia la pregunta. En vez de que me falta para empezar, preguntate que es lo mas pequeno que puedo poner delante de alguien esta semana para que me diga que no. Porque el no es informacion y llega gratis. El si llega despues. Un negocio no se estudia. Se estrena y se corrige mientras esta en la calle.", "segundos": 20, "nota_direccion": "Deja la mancuerna de golpe sobre la mesa en «deja de intentar estar preparado» — el golpe seco marca el cambio de bloque. Es paradigma, no tutorial: no dice como se valida nada. Tono mas calmado, de igual a igual, no de jefe."}, {"bloque": "PRUEBA SOCIAL", "texto": "Yo venia de un campo de futbol y de dar clases en un gimnasio. Cero idea de informatica, cero contactos, cero dinero en casa. Hoy tengo este almacen, un equipo de mas de veinte personas y llevo casi nueve anos en esto. Y sigo sin ser el mas listo de la sala. Solo empece antes que el que se lo estaba pensando.", "segundos": 14, "nota_direccion": "Aqui entran los insertos del equipo trabajando y de la sala del evento llena — la autoridad se VE, no solo se dice. Tono plano, sin epica, sin musica de fondo triunfal: si suena a discurso motivacional, se ha roto. Frase final seca y sin sonrisa."}, {"bloque": "CTA", "texto": "Te he dejado el VALIDADOR DE PRODUCTO. Es lo mas pequeno que puedes poner en la calle esta semana: metes el producto que tienes en la cabeza y te dice si eso lo quiere alguien o te lo estas contando tu solo. Es lo que le pido a todo el que entra conmigo antes de dejarle montar nada. Comenta VALIDAR y lo dejo fijado arriba. Esta en mi biografia.", "segundos": 12, "nota_direccion": "Recurso REAL: 06_HERRAMIENTAS_HTML (Validador Producto, listado en URLS_RECURSOS.txt). CANDADO: nada de «te lo mando por privado». Palabra clave VALIDAR aislada, dicha como boton. Cierre cortado en seco justo despues de «biografia», sin coletilla."}], "musica": "SIN MUSICA. Es talking puro a camara y es la pieza confesional de la tanda: cuenta de donde viene. Cualquier pista de fondo la convierte en video motivacional, que es exactamente lo que Ramiro prohibe en el bloque SOLUCION y lo que Javi tumba como humo. El unico sonido no-voz es el golpe de la mancuerna en la mesa al entrar en SOLUCION.", "duracion_s": 73, "texto_en_pantalla": "LLEVAS 2 ANOS DICIENDO QUE NO ES TU MOMENTO", "caption": "No te falta informacion. Te falta la primera semana. Comenta VALIDAR y lo dejo fijado arriba. #ecommerce #tiendaonline #emprender"}, {"id": "JAVI-BOFU-03", "cuenta": "JAVI", "etapa": "BOFU", "titulo": "El cuarto producto tampoco era", "formula": "F7 · MATA EL FALSO CULPABLE (guion 6 de Santi T02: «X no te va a hacer Y, solo te asegura que Z») como hook, y F26 de Ramiro · CASO COMO NARRATIVA (no lista de cifras) en el bloque de prueba social. Se elige porque es la objecion que mas dinero cuesta al ICP A y porque el caso real disponible (alumno de moda que paso de vender producto de otro a marca propia) es literalmente una narrativa, no un numero suelto: encaja con la exigencia de Javi de prueba social con gente real y placas, no dashboards.", "escena": {"donde": "La sala del evento Mentorium, de pie delante del escenario con la pantalla con el logo detras. Grabado antes o despues de una sesion, con las sillas colocadas.", "plano": "Plano medio, el de pie, camara a la altura de los ojos. Pequenos cortes frecuentes (formato clase, ritmo picado) con insertos del evento durante PRUEBA SOCIAL.", "que_se_ve": "Javi delante de la pantalla de MENTORIUM. En PRUEBA SOCIAL, insertos reales del evento: sala llena de gente y el momento de la entrega de la placa a un alumno. Cero dashboards, cero capturas de facturacion en pantalla, ningun numero visible aparte del rotulo del hook.", "atrezzo": "Una de las placas que se entregan en el evento, en la mano. La levanta en el segundo 0 sin explicarla (elemento visual del hook) y no vuelve a nombrarla hasta el bloque de prueba social, donde por fin se entiende que hacia ahi."}, "bloques": [{"bloque": "ATENCION", "texto": "Llevas cuatro productos este ano y ninguno era el problema. Cambiar de producto no te va a arreglar la tienda. Solo te asegura empezar otra vez de cero.", "segundos": 5, "nota_direccion": "Levanta la placa en el frame 0 y la sostiene ladeada, sin decir que es. Tono exagerado y rapido en «cuatro productos» y seco en «de cero». Frontera hook-cuerpo a los 3 s (hook hablado). Sin musica en los dos primeros segundos."}, {"bloque": "PROBLEMA", "texto": "Y el ciclo es siempre el mismo, lo has hecho ya cuatro veces. Encuentras el producto, te ilusionas, montas la pagina en dos tardes, lanzas, entra gente, no compra nadie. Y en vez de mirar tu pagina, culpas al producto. Y a buscar otro. Otro proveedor, otras fotos, otro nombre, otro logo. Y esa parte te encanta, porque empezar de cero es comodo y no duele. Lo que duele es abrir tu propia tienda como si fueras un desconocido y aceptar que no le das confianza a nadie.", "segundos": 23, "nota_direccion": "Ritmo picado, cortes cortos (formato clase, como pidio Jordi el 12-ago para este molde). La lista «otro proveedor, otras fotos, otro nombre, otro logo» va rapida y con un corte por elemento. Freno total y pausa de un segundo antes de «lo que duele». Aqui la musica ya esta por debajo, muy baja."}, {"bloque": "SOLUCION", "texto": "Deja de buscar productos y empieza a buscar el punto exacto en el que la gente se va. Alguien entra en tu tienda y decide en segundo y medio si te compra o si se larga. Y esa decision no la toma con tu producto. La toma con lo que ve. La foto, el precio, quien eres tu, y que le pasa si le sale mal. Arregla eso y el producto que ya tienes empieza a vender. No cambies de bala. Cambia de punteria.", "segundos": 22, "nota_direccion": "Paradigma, cero paso a paso: no dice como se arregla la foto ni la pagina (gate S2). «Segundo y medio» con chasquido de dedos. La ultima frase, muy despacio y separada, mirando fijo a camara; es el remate y tiene que quedarse en la cabeza."}, {"bloque": "PRUEBA SOCIAL", "texto": "Un alumno mio vendia moda comprandole el producto a otro. No cambiamos de producto. Le pusimos su marca al que ya estaba vendiendo. Hoy factura lo mismo que entonces, un poco menos incluso, y le queda cuatro veces mas en la cuenta. Esta placa se la entregamos en el evento, con la sala llena, delante de todo el mundo.", "segundos": 16, "nota_direccion": "Sin nombre (regla 8; caso validado en _casos_exito/caso_Carlos_drop_a_marca_32pct_margen.md). Aqui se entiende por fin la placa: la ensena a camara en «esta placa». Insertos reales del evento (sala llena + entrega de placa) — es la prueba social que Javi pide, gente real, nada de dashboards. «Cuatro veces» se dice, NO se escribe en pantalla."}, {"bloque": "CTA", "texto": "Te he dejado el AUDITOR DE CONFIANZA DE TIENDA. Es la lista de lo que miro yo en una tienda antes de mirar siquiera el producto, y en el mismo orden en que lo miro. Si te fallan los primeros, cambiar de producto es tirar otro mes. Es lo primero que hacemos con cada alumno que entra por esa puerta. Comenta CONFIANZA y lo dejo fijado arriba. Esta en mi biografia.", "segundos": 14, "nota_direccion": "Recurso REAL: 06_HERRAMIENTAS_HTML/auditor-confianza-tienda.html. CANDADO: cero promesa de envio por privado. Palabra clave CONFIANZA sola, dicha como boton, mirando a camara. Corte limpio al terminar, sin despedida y sin logo animado."}], "musica": "Pista trend de la biblioteca de virales de USA/Espana (no del nicho), instrumental y con pegada, entrando en el segundo 3 y con el golpe fuerte cuadrado en el primer corte al inserto del evento dentro de PRUEBA SOCIAL. Justificacion: es la pieza mas movida de las tres (formato clase con cortes cortos) y sin base ritmica los cortes suenan a error. Siempre por debajo de la voz; nada lento ni funebre.", "duracion_s": 80, "texto_en_pantalla": "LLEVAS 4 PRODUCTOS Y NINGUNO ERA EL PROBLEMA", "caption": "Nadie se va de tu tienda por el producto. Se va por lo que ve antes de decidir. Comenta CONFIANZA y lo dejo fijado arriba. #ecommerce #tiendaonline #shopify"}, {"id": "JOR-TOFU-01", "cuenta": "JORDI", "etapa": "TOFU", "titulo": "La IA te monta la tienda. Lo que no te monta es la decisión", "formula": "F13 · NOTICIA / DESCUBRIMIENTO («Se encontró una nueva herramienta que hace por ti lo que odias»). Elegida porque el tema medido nº2 de Jordi es IA + ecom («la peña le flipa Claude y ecom», 17-jul) y F13 es la única fórmula del banco que arranca desde la herramienta y no desde el nicho: la entiende alguien que no ha vendido nada nunca, que es lo que Jordi exige del TOFU («es muy nicho / tiene que ser un poco más viral»).", "escena": {"donde": "Su despacho en casa. Mesa de madera, pared lisa detrás, luz de ventana por la izquierda. Cero cuadrícula: se graba vertical a sangre.", "plano": "Plano medio fijo a la altura de los ojos, Jordi sentado. El portátil entra en cuadro por la esquina inferior derecha, girado hacia cámara.", "que_se_ve": "Jordi hablando a cámara con el portátil abierto a su lado y la pantalla llena de texto escribiéndose solo. En el bloque de PRUEBA SOCIAL entra a pantalla completa la foto del evento con la placa de Luis (la cifra se ve en la placa, no se dice ni se escribe en el caption). Vuelve a Jordi para el CTA.", "atrezzo": "El portátil abierto con la conversación de la IA generando texto en vivo — es el elemento visual del hook (gate S4 de Santi): se entiende en mute, sin necesidad de audio."}, "bloques": [{"bloque": "ATENCION", "texto": "Le he pedido a una inteligencia artificial que me monte una tienda online entera. Delante de mí. Sin tocar yo nada.", "segundos": 7, "nota_direccion": "Tono exagerado, casi de guasa incrédula. Gira el portátil hacia cámara en la palabra «entera» y se queda mirando la pantalla medio segundo antes de volver a cámara. Hook LEÍDO: el rótulo tiene que estar desde el frame 0 y aguantar los 7 segundos enteros."}, {"bloque": "PROBLEMA", "texto": "Y lo incómodo no es lo que ha tardado. Lo incómodo es que tú llevas tres semanas con esa misma tienda. Tres semanas eligiendo el nombre. El logo. El color del botón de comprar. Cierras el portátil cada noche pensando que has avanzado un poco. Y no has avanzado: has estado decorando un escaparate vacío.", "segundos": 17, "nota_direccion": "Pausado, sin subir la voz. Pausa entera después de «tres semanas con esa misma tienda». Las tres cosas (nombre, logo, botón) se enumeran despacio, casi con lástima, no con burla. La frase «escaparate vacío» se dice bajando el volumen."}, {"bloque": "SOLUCION", "texto": "La máquina no te ha quitado el trabajo. Te ha quitado la excusa. Montar la tienda ya no es el trabajo: es el trámite. El trabajo es decidir qué vendes y a quién se lo vendes, y eso no lo va a decidir ninguna máquina por ti. Así que deja de construir. Empieza a elegir.", "segundos": 19, "nota_direccion": "Aquí sube medio tono y se echa hacia delante. Pausa real de un segundo entre «Te ha quitado la excusa» y lo siguiente. «Deja de construir. Empieza a elegir.» se dice separado, casi deletreado — es el remate. Paradigma, cero paso a paso: no se explica cómo se elige."}, {"bloque": "PRUEBA SOCIAL", "texto": "Mi alumno Luis ya tenía la tienda montada y funcionando cuando llegó conmigo. Montarla nunca fue su problema. Vino a dar el salto. Y esa placa se la entregué yo.", "segundos": 11, "nota_direccion": "Baja el ritmo, tono de orgullo tranquilo, cero efusividad. Mientras habla entra la foto del evento con la placa a pantalla completa. La cifra vive DENTRO de la placa: no se pronuncia y no se escribe en el caption. Alumno con ficha validada en _casos_exito/caso_Luis_placa_2M_euros_Jordi.md."}, {"bloque": "CTA", "texto": "Tengo escrito el documento con las preguntas exactas que le hago yo a una inteligencia artificial antes de montar nada. Se llama ARRANQUE y lo tienes en mi perfil. Comenta ARRANQUE.", "segundos": 11, "nota_direccion": "Vuelve a plano medio, mirada directa, sin sonreír. Dice «ARRANQUE» dos veces y la segunda más despacio. ⛔ CANDADO: no se promete mandar nada por privado — se pide comentario y el recurso se nombra y vive en la bio. ⚠️ El documento ARRANQUE tiene que existir en el panel de recursos ANTES de publicar la pieza."}], "musica": "Dos pistas. Hook (0-7 s): pista viral de USA/España, 100-115 BPM, entrada seca en el frame 0 — nada lento ni de cementerio (queja literal de Jordi, 28-jul). Cuerpo (7 s al final): la misma familia bajada a instrumental de fondo, 6-8 dB por debajo de la voz. El cambio de pista cae exactamente en la frontera del hook.", "duracion_s": 65, "texto_en_pantalla": "LE PEDÍ A UNA IA QUE ME MONTARA LA TIENDA ENTERA", "caption": "La tienda ya no es el trabajo. El trabajo es decidir qué vendes y a quién. Eso no lo decide una máquina por ti. Comenta ARRANQUE y lo tienes en mi perfil."}, {"id": "JOR-TOFU-02", "cuenta": "JORDI", "etapa": "TOFU", "titulo": "Cambiar el diseño no te va a hacer vender", "formula": "F7 · MATA EL FALSO CULPABLE («[compra/tarea que todos creen necesaria] no te va a hacer [resultado]. Solo te asegura que [coste]»). Elegida porque el falso culpable nº1 del novato absoluto es el diseño, se entiende sin saber nada de ecom y da un titular-síntoma en vez de un beneficio abstracto (edicion-viral-score B12).", "escena": {"donde": "Dentro del coche parado, en el aparcamiento, motor apagado. Luz de tarde entrando por el parabrisas.", "plano": "Plano corto desde el salpicadero, Jordi en el asiento del conductor con el móvil en la mano. El móvil se acerca a cámara en el hook.", "que_se_ve": "Jordi enseñando en el móvil una tienda con plantilla cara, preciosa y vacía. En el PROBLEMA cambia a una segunda tienda, fea, hecha en casa. En PRUEBA SOCIAL entra a pantalla completa la foto de la entrega de la placa de Alejandro. Cierre otra vez con la cara.", "atrezzo": "El móvil con las dos tiendas en pantalla — es el elemento visual del hook. Coche parado y motor apagado: no hay sonido de motor, así que no hace falta cuadrar coche-sonido."}, "bloques": [{"bloque": "ATENCION", "texto": "Tu tienda no vende porque es fea. Eso es lo que te has contado esta semana. Y es mentira. Mira esto.", "segundos": 7, "nota_direccion": "Seco al principio y luego se rompe con media sonrisa en «Y es mentira». Levanta el móvil hacia cámara en «Mira esto». El rótulo del hook entra en el frame 0 y aguanta los 7 segundos (hook leído)."}, {"bloque": "PROBLEMA", "texto": "Esta tienda es preciosa. No vende un pedido al día. Esta otra la montó el dueño en una tarde, con la foto que le hizo a su producto en el salón de su casa, y no da abasto. Tú llevas semanas cambiando la tipografía porque cambiar la tipografía no da miedo. Enseñarle el producto a un desconocido, sí.", "segundos": 18, "nota_direccion": "Va alternando las dos pantallas del móvil mientras habla, sin prisa. Pausa larga antes de la última frase y la dice mirando fijo a cámara, más bajo. Es la frase que tiene que doler."}, {"bloque": "SOLUCION", "texto": "El que entra en tu tienda no está juzgando tu diseño. Está decidiendo, en un segundo y medio, si eso le quita un problema o no. Y eso no se decide con el color del botón: se decide con lo que vendes y con cómo se lo cuentas. Deja de maquillar el escaparate y empieza a explicar qué problema quitas.", "segundos": 20, "nota_direccion": "Deja el móvil boca abajo sobre la pierna en «no está juzgando tu diseño» — quitar el atrezzo de en medio marca el cambio de bloque. Ritmo lento, capas: contexto, tensión, remate. Cero cómo: no se dice qué escribir ni dónde."}, {"bloque": "PRUEBA SOCIAL", "texto": "Mi alumno Alejandro no venía del diseño. Venía de trabajar en una nave industrial. Tuvo una hija y necesitaba algo rápido. Esa placa se la di yo.", "segundos": 10, "nota_direccion": "Tono bajo, respetuoso, sin épica de influencer. Entra la foto de la entrega de la placa mientras habla. La cifra está dentro de la placa: no se pronuncia. Alumno con ficha validada en _casos_exito/caso_Alejandro_1M_ultimo_ano_Jordi.md."}, {"bloque": "CTA", "texto": "Tengo hecho el documento con lo que miro yo en una tienda antes de mirar el diseño. Se llama ESCAPARATE y está en mi perfil. Comenta ESCAPARATE.", "segundos": 11, "nota_direccion": "Mirada directa, sin sonreír, remate seco y corte limpio justo al acabar la palabra. ⛔ Cero promesa de envío por privado. ⚠️ El documento ESCAPARATE tiene que existir antes de publicar."}], "musica": "Dos pistas. Hook (0-7 s): pista viral tipo trending, 95-110 BPM, entra con el frame 0 y corta en seco al acabar el hook. Cuerpo: instrumental de fondo, mismo mundo sonoro, muy por debajo de la voz. Prohibida la pista lenta o triste: esta pieza es de guasa incómoda, no de drama.", "duracion_s": 66, "texto_en_pantalla": "TU TIENDA NO VENDE PORQUE ES FEA. MENTIRA.", "caption": "Llevas semanas cambiando el color del botón. Tu cliente decide en un segundo y no está mirando eso. Comenta ESCAPARATE, está en mi perfil."}, {"id": "JOR-TOFU-03", "cuenta": "JORDI", "etapa": "TOFU", "titulo": "El que más le pregunta a la IA es el que menos avanza", "formula": "F21 · CONTRAINTUITIVO PURO («[el que más X] es el que menos [Y]»). Elegida porque da un hook viral que se entiende fuera del nicho, ataca la conducta exacta del novato con IA (coleccionar respuestas) y evita cualquier jerga: no hace falta saber qué es una tienda para pillarlo.", "escena": {"donde": "Mesa de la terraza al aire libre, primera hora, sin gente detrás. Pared o vegetación de fondo, nunca personas.", "plano": "Plano medio corto, cámara fija. Jordi de pie apoyado en la mesa, no sentado: da más energía y el hook necesita movimiento en el frame 0.", "que_se_ve": "Sobre la mesa, un taco de folios impresos con respuestas de la IA. Jordi los coge y los deja caer de golpe en el hook. En SOLUCIÓN se queda con un solo folio en la mano. En PRUEBA SOCIAL entra a pantalla completa la captura del panel de Nil.", "atrezzo": "El taco de folios impresos con las respuestas de la IA cayendo sobre la mesa — elemento visual del hook, se lee en mute y da el movimiento del frame 0 (gate 5 de qa-binario)."}, "bloques": [{"bloque": "ATENCION", "texto": "El que más le pregunta a la inteligencia artificial es el que menos vende. Y te voy a decir por qué, porque es incómodo.", "segundos": 6, "nota_direccion": "Suelta el taco de folios sobre la mesa justo al decir «menos vende»: el golpe es el pattern interrupt. Tono exagerado en «incómodo». Rótulo desde el frame 0."}, {"bloque": "PROBLEMA", "texto": "Dame un producto ganador. Dame un negocio que funcione. Dame veinte ideas más. Y ahí sigues, con una carpeta llena de respuestas perfectas y cero pedidos. Porque preguntar se siente igual que trabajar: te cansas, te acuestas tarde, tienes la sensación de haber hecho algo. Y no has hecho nada, porque preguntar no te expone a nadie.", "segundos": 18, "nota_direccion": "Las tres primeras frases se dicen imitando al que escribe, rápidas y planas. Luego frena en seco. La frase «preguntar no te expone a nadie» se dice muy bajo, casi confesándola. Bajar al barro: es la conducta literal, no una idea general."}, {"bloque": "SOLUCION", "texto": "Una máquina puede ejecutar. No puede elegir por ti. Y mientras no elijas, tienes un ayudante buenísimo trabajando para un negocio que no existe. Así que deja de pedirle ideas y pon la tuya encima de la mesa, aunque sea mala. Una idea mediocre probada esta semana te enseña más que cuarenta ideas perfectas guardadas.", "segundos": 21, "nota_direccion": "Coge un solo folio y lo deja sobre la mesa en «pon la tuya encima de la mesa». Pausa de dos segundos antes del remate final — sin miedo al silencio, es su marca. Paradigma puro: no se dice cómo se prueba."}, {"bloque": "PRUEBA SOCIAL", "texto": "Mi alumno Nil no había vendido nada en su vida cuando empezó conmigo. Empezó desde cero en marzo. Este es su panel.", "segundos": 11, "nota_direccion": "Tranquilo, con orgullo contenido. Entra la captura del panel a pantalla completa mientras habla; la cifra se ve dentro de la captura y no se pronuncia ni se escribe en el caption. Alumno con ficha validada en _casos_exito/caso_Nil_200K_2meses_Jordi.md."}, {"bloque": "CTA", "texto": "Tengo montada la hoja de una sola página para dejar de dar vueltas y sacar la primera prueba. Se llama PRIMERA y está en mi perfil. Comenta PRIMERA.", "segundos": 11, "nota_direccion": "Vuelve a cámara, remate seco, corte limpio sin cola de silencio. ⛔ Nada de mandar por privado. ⚠️ La hoja PRIMERA tiene que existir antes de publicar."}], "musica": "Dos pistas. Hook (0-6 s): pista viral con golpe en el frame 0 que cuadre con el taco de folios cayendo, 100-120 BPM. Cuerpo: instrumental seco, poco melódico, por debajo de la voz — la pieza va de incomodidad, no de emoción. Cambio de pista en la frontera del hook.", "duracion_s": 67, "texto_en_pantalla": "EL QUE MÁS PREGUNTA A LA IA ES EL QUE MENOS VENDE", "caption": "Cuarenta ideas guardadas y ninguna probada. La máquina ejecuta, pero no elige por ti. Comenta PRIMERA, está en mi perfil."}, {"id": "JOR-TOFU-04", "cuenta": "JORDI", "etapa": "TOFU", "titulo": "Ya no puedes decir que es por tiempo", "formula": "F12 · ESPEJO INCÓMODO DE VIDA («la gente está dispuesta a [sacrificio enorme por otro] pero no puede [esfuerzo pequeño por sí misma]»). Elegida porque es la fórmula más viral del banco fuera del nicho —funciona con alguien que no ha vendido nada nunca— y engancha directa con el ángulo IA: la excusa del tiempo se cae cuando la máquina hace en una tarde lo que costaba meses.", "escena": {"donde": "Salón de casa, de noche, luz cálida de lámpara. Pantalla grande o monitor encendido detrás, en diagonal.", "plano": "Plano medio, Jordi de pie, la pantalla detrás desenfocada pero legible. Sin rótulo fijo superior: manda el subtítulo abajo.", "que_se_ve": "Detrás de él, la pantalla con la IA escribiendo sola, sin nadie tocando el teclado. Jordi ni la mira hasta el bloque de SOLUCIÓN, donde se gira medio segundo y señala con el pulgar. En PRUEBA SOCIAL entra la captura del panel de Nil a pantalla completa.", "atrezzo": "La pantalla grande trabajando sola detrás de él — elemento visual del hook: se entiende en mute que la máquina está haciendo el trabajo mientras él habla."}, "bloques": [{"bloque": "ATENCION", "texto": "Le dedicas ocho horas al día al negocio de otro. Y ni una tarde al tuyo. Y a partir de hoy ya no puedes decir que es por tiempo.", "segundos": 8, "nota_direccion": "Muy pausado, mirando fijo, sin gesticular. Es la frase más dura de la tanda y funciona en frío. Pausa de un segundo antes de «Y a partir de hoy». Hook leído: el rótulo aguanta los 8 segundos."}, {"bloque": "PROBLEMA", "texto": "Porque la excusa siempre era esa, ¿verdad? Cuando acabe el turno. Cuando pase el verano. Cuando los críos crezcan. Yo he estado ahí. Y lo que pasa de verdad es que el domingo por la noche te sientas, abres el ordenador, ves la montaña de cosas que no sabes hacer, y lo cierras. Y al día siguiente dices que no tuviste tiempo.", "segundos": 20, "nota_direccion": "«Yo he estado ahí» se dice bajando la voz, sin épica: es lo que le da permiso para lo que viene. Las tres excusas van enumeradas planas, sin burla. El remate se dice despacio y sin señalar a nadie."}, {"bloque": "SOLUCION", "texto": "Esa montaña ya no existe. Todo lo que te frenaba, escribir los textos, montar las páginas, entender por dónde se empieza, hoy lo hace una máquina mientras tú cenas. Lo único que no puede hacer por ti es sentarse. Así que deja de prepararte y empieza en sucio, hoy, mal. Lo que está mal se
