/* Abre la pieza entera: todas las slides en fila, con sonido. El video NO va muteado a
   proposito — Gerard juzga la musica aqui, y una slide muda no se puede juzgar. */
function abreVisor(id){
  const p=(DATOS.piezas||[]).find(x=>x.id===id); if(!p)return;
  const arr=p.archivos||[];
  $("#vtit").textContent=`${p.id} · ${arr.length} ${arr.length===1?"pieza":"slides"}`;
  $("#vpistas").innerHTML=arr.map((a,k)=>{
    const m=a.video?`<video src="${esc(a.video)}" poster="${esc(a.poster||"")}" controls playsinline preload="metadata"></video>`
                   :(a.poster?`<img src="${esc(a.poster)}">`:'<div style="height:60vh;width:34vh;background:#111;border-radius:12px"></div>');
    const nota=((dec(id)||{}).motivo_slides||{})[k]||"";
    return `<div class="vslide${nota?" conmarca":""}" data-k="${k}">`
      +`<span class="marca">corregir</span>${m}`
      +`<span class="vn">${k+1} / ${arr.length}</span>`
      +`<textarea class="snota${nota?" tiene":""}" data-id="${esc(id)}" data-k="${k}" `
      +`placeholder="¿falla algo en ESTA slide? escríbelo">${esc(nota)}</textarea></div>`;
  }).join("");
  /* se guarda al salir del campo: una slide, una nota */
  $("#vpistas").querySelectorAll(".snota").forEach(t=>t.onchange=()=>{
    const k=t.dataset.k, txt=t.value.trim();
    t.classList.toggle("tiene",!!txt);
    t.closest(".vslide").classList.toggle("conmarca",!!txt);
    guardar(srv=>{
      srv.decisiones=srv.decisiones||{};
      const d=srv.decisiones[t.dataset.id]||{estado:"corregir",motivo:"",por:YO,cuando:""};
      d.motivo_slides=d.motivo_slides||{};
      if(txt) d.motivo_slides[k]=txt; else delete d.motivo_slides[k];
      if(Object.keys(d.motivo_slides).length && d.estado!=="denegado") d.estado="corregir";
      d.por=YO; d.cuando=new Date().toISOString().slice(0,16).replace("T"," ");
      srv.decisiones[t.dataset.id]=d;
    });
  });
  $("#vcap").textContent=p.caption||"(sin caption)";
  $("#visor").classList.add("on");
  document.body.style.overflow="hidden";
}
function cierraVisor(){
  $("#visor").classList.remove("on");
  $("#vpistas").querySelectorAll("video").forEach(v=>{try{v.pause()}catch(e){}});
  $("#vpistas").innerHTML="";
  document.body.style.overflow="";
}

function cablear(){
  document.querySelectorAll(".copiacap").forEach(b=>b.onclick=()=>{
    const t=document.getElementById(b.dataset.cap); if(!t)return;
    t.select(); try{document.execCommand("copy");}catch(e){}
    const v=b.textContent; b.textContent="Copiado"; setTimeout(()=>b.textContent=v,1200);
  });
  document.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{
    MODO=b.dataset.modo; localStorage.setItem("mx_modo",MODO); IDX=0; render();
  });
  document.querySelectorAll("[data-paso]").forEach(b=>b.onclick=()=>{
    IDX+=(+b.dataset.paso); render();
  });

  document.querySelectorAll(".verver").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const card=b.closest(".card"); if(card) abreVisor(card.dataset.id);
  });
  const vc=$("#vcerrar"); if(vc) vc.onclick=cierraVisor;
  const vv=$("#visor"); if(vv) vv.onclick=e=>{ if(e.target===vv) cierraVisor(); };

  document.querySelectorAll(".filtros button").forEach(b=>b.onclick=()=>{
    if(b.dataset.f)FCUENTA=b.dataset.f; else if(b.dataset.e)FETAPA=b.dataset.e; render();});
  /* flechas de la galeria + caption expandible (delegado: sobrevive a re-pintados) */
  const app=$("#app");
  app.onclick=ev=>{
    const nav=ev.target.closest(".nav");
    if(nav){
      const card=nav.closest(".card"), med=nav.closest(".med");
      const p=DATOS.piezas.find(x=>x.id===card.dataset.id);
      if(!p)return;
      const n=(p.archivos||[]).length;
      const i=((+med.dataset.i)+(+nav.dataset.n)+n)%n;
      med.outerHTML=mediaHTML(p,i);
      return;
    }
    const cap=ev.target.closest(".cap");
    if(cap)cap.classList.toggle("abierta");
  };
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id, ta=card.querySelector(".motivo");
    card.querySelectorAll(".acc button").forEach(b=>b.onclick=()=>{
      const est=b.dataset.a, motivo=(ta.value||"").trim();
      if(est==="corregir"&&!motivo){
        aviso("Escribe qué hay que corregir",true); ta.focus(); return;
      }
      guardar(srv=>{ const sello=new Date().toISOString().slice(0,16).replace("T"," ");
        srv.decisiones=srv.decisiones||{};
        srv.decisiones[id]={estado:est,motivo:motivo,por:YO,cuando:sello};
      });
    });
  });
  /* hooks: aprobar / cambiar texto / denegar — todo queda en el blob con quién y cuándo */
  document.querySelectorAll(".hk").forEach(hk=>{
    const hid=hk.dataset.hid;
    hk.querySelectorAll(".acc button").forEach(b=>b.onclick=()=>{
      const a=b.dataset.h;
      if(a==="editar"){ hk.classList.toggle("editando"); const t=hk.querySelector(".hedit"); if(hk.classList.contains("editando")){t.focus();t.setSelectionRange(t.value.length,t.value.length);} return; }
      const nuevo=hk.querySelector(".hedit").value.trim();
      guardar(srv=>{
        srv.hooks=(srv.hooks&&srv.hooks.length?srv.hooks:JSON.parse(JSON.stringify(HOOKS_INI)));
        const k=srv.hooks.find(x=>x.id===hid); if(!k)return;
        const sello=new Date().toISOString().slice(0,16).replace("T"," ");
        if(nuevo&&nuevo!==k.texto){ k.texto=nuevo; k.editado=sello+" por "+YO; }
        k.estado=a; k.por=YO; k.cuando=sello;
      }).then(render);
    });
    const t=hk.querySelector(".hedit");
    if(t) t.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); hk.querySelector('[data-h="aprobado"]').click(); } };
  });
  document.querySelectorAll(".gprod").forEach(b=>b.onclick=async()=>{
    const gid=b.dataset.gid; b.disabled=true; b.textContent="ENVIANDO…";
    const ok=await guardarMio(mio=>{ if(!mio.ordenes.some(o=>o.tipo==="producir_guion"&&o.id===gid))
      mio.ordenes.push({tipo:"producir_guion", id:gid, por:YO,
        cuando:new Date().toISOString().slice(0,16).replace("T"," ")}); });
    if(ok){ aviso("Orden enviada: producir "+gid); render(); }
    else { b.disabled=false; b.textContent="PRODUCIR"; }
  });
  document.querySelectorAll(".repl").forEach(b=>b.onclick=async()=>{
    const sc=b.dataset.sc; b.disabled=true; b.textContent="ENVIANDO…";
    const ok=await guardarMio(mio=>{ if(!mio.ordenes.some(o=>o.tipo==="replicar"&&(o.url||"").indexOf(sc)>=0))
      mio.ordenes.push({tipo:"replicar",
        url:"https://www.instagram.com/reel/"+sc+"/", por:YO,
        cuando:new Date().toISOString().slice(0,16).replace("T"," ")}); });
    if(ok){ aviso("Orden enviada a Claude: replicar "+sc); render(); }
    else { b.disabled=false; b.textContent="REPLICAR"; }
  });
  const add=$("#raddr");
  if(add)add.onclick=()=>{
    const u=($("#rurl").value||"").trim();
    if(!/^https?:\/\//.test(u)){aviso("Pega un link válido",true);return;}
    const nota=($("#rnota").value||"").trim();
    guardar(srv=>{ srv.referentes=srv.referentes||[];
      srv.referentes.push({url:u.split("?")[0],quien:YO,nota:nota,
        fecha:new Date().toISOString().slice(0,16).replace("T"," "),
        etapa:"",estado:"sin analizar"});
    });
    $("#rurl").value="";$("#rnota").value="";
  };

  /* chips de correccion rapida: rellenan el motivo y marcan la pieza como 'corregir' */
  document.querySelectorAll('.fixr button[data-fx]').forEach(b=>{
    b.onclick=e=>{
      const card=b.closest('.card'); if(!card)return;
      const ta=card.querySelector('.motivo'); const f=FIX_RAPIDO[+b.dataset.fx];
      if(ta){ ta.value = ta.value.trim() ? (ta.value.trim()+". "+f[1]) : f[1];
              ta.dispatchEvent(new Event('input',{bubbles:true})); ta.dispatchEvent(new Event('change',{bubbles:true})); }
      const fix=card.querySelector('button.fix'); if(fix) fix.click();
      b.style.borderColor='#5B9DFF'; b.style.color='#fff';
    };
  });
  /* aprobar toda una seccion de golpe, con confirmacion */
  document.querySelectorAll('.secacc[data-sec]').forEach(b=>{
    b.onclick=e=>{
      const sec=b.closest('.sec'); const grid=sec&&sec.nextElementSibling;
      const cards=grid?grid.querySelectorAll('.card'):[];
      if(!cards.length)return;
      if(!confirm('¿Aprobar las '+cards.length+' piezas de esta sección? Míralas antes: en lote es donde se cuela algo sin ver.'))return;
      cards.forEach(c=>{const ok=c.querySelector('button.ok'); if(ok&&!ok.classList.contains('sel'))ok.click();});
    };
  });


  /* REPASAR: decidir avanza sola a la siguiente — lo que agota es perder el sitio, no revisar */
  document.querySelectorAll('[data-rp]').forEach(b=>{
    b.onclick=()=>{
      const ps=rpLista(); const p=ps[RP_I]; if(!p)return;
      const est=b.dataset.rp;
      const ta=document.querySelector('.rp .motivo');
      const motivo=(ta&&ta.value||"").trim();
      if(est==="corregir" && !motivo){
        aviso("Escribe qué hay que corregir",true);
        const det=ta&&ta.closest("details"); if(det)det.open=true; if(ta)ta.focus(); return;
      }
      guardar(srv=>{ const sello=new Date().toISOString().slice(0,16).replace("T"," ");
        srv.decisiones=srv.decisiones||{};
        srv.decisiones[p.id]={estado:est,motivo:motivo,por:YO,cuando:sello};
      });
    };
  });
  document.querySelectorAll('[data-rpnav]').forEach(b=>{
    b.onclick=()=>{ RP_I+=(+b.dataset.rpnav); render(); };
  });
  if(TAB==="repasar" && !window._rpTecla){
    window._rpTecla=true;
    document.addEventListener('keydown',e=>{
      if(TAB!=="repasar")return;
      if(/(input|textarea)/i.test((e.target.tagName||"")))return;
      if(e.key==="ArrowRight"){RP_I++;render();}
      else if(e.key==="ArrowLeft"){RP_I--;render();}
      else if(e.key==="1"||e.key==="2"||e.key==="3"){
        const m={"1":"aprobado","2":"corregir","3":"denegado"};
        const b=document.querySelector('[data-rp="'+m[e.key]+'"]'); if(b)b.click();
      }
    });
  }

}

     dejaba la página entera en negro porque nunca se llegaba a render()) */
  let vivo=true;

    /* primera vez: precarga los referentes que ya nos pasaron por WhatsApp */

  }
}
