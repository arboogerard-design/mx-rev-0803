*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.wrap{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 2px}

.quien button.sel{background:#3ecf8e;color:#0d0e12;border-color:#3ecf8e}
/* filtros */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:#0d0e12;z-index:10}
.filtros button{flex:0 0 auto;padding:10px 16px;border-radius:99px;border:1px solid #2a2c36;background:#16171d;color:#c9cbd6;font-size:14px;font-weight:600}
.filtros button.on{background:#ececf0;color:#0d0e12;border-color:#ececf0}
/* dias */
details.dia{border:1px solid #23242d;border-radius:14px;margin-bottom:10px;background:#121318;overflow:hidden}
details.dia>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px}

.mini{font-size:12px;color:#8b8d98;font-weight:600}

.gtit{font-size:12px;letter-spacing:1px;color:#8b8d98;font-weight:700;margin:10px 6px 6px;text-transform:uppercase}

.card{background:#181920;border:1px solid #262833;border-radius:14px;margin-bottom:12px;overflow:hidden}

.chead{display:flex;gap:8px;align-items:center;padding:10px 12px 6px;flex-wrap:wrap}

const CLAVE="mentorium2026";
const BLOB="https://jsonblob.com/api/jsonBlob/019fc97b-6f60-7c6b-8983-0a922843051e";
const D=DATOS_INCRUSTADOS, PIEZAS=D.piezas, DIAS=D.dias.concat(["reserva","sin día"]);
const PERSONAS=["Javi","Jordi","Santi","Gerard"];
let YO=localStorage.getItem("yo")||"", V={votos:{}}, filtro="todo", timer=null;

/* ---------- login ---------- */
const q=document.getElementById("quien");
PERSONAS.forEach(p=>{const b=document.createElement("button");b.textContent=p;
  b.onclick=()=>{document.querySelectorAll('.quien button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    if(document.getElementById("clave").value.trim().toLowerCase()===CLAVE){
      YO=p;localStorage.setItem("yo",p);document.getElementById("login").style.display="none";arranca();}
    else alert("Código incorrecto");};
  q.appendChild(b);});
if(YO){document.getElementById("clave").value=CLAVE;}

/* ---------- votos compartidos ---------- */
async function bajar(){try{const r=await fetch(BLOB,{headers:{Accept:"application/json"}});
  if(r.ok){V=await r.json();V.votos=V.votos||{};pinta();
    document.getElementById("sync").textContent="sincronizado "+new Date().toLocaleTimeString().slice(0,5);}
}catch(e){document.getElementById("sync").textContent="sin conexión (local)";}}
async function subir(){try{
  const r=await fetch(BLOB,{headers:{Accept:"application/json"}});
  if(r.ok){const srv=await r.json();srv.votos=srv.votos||{};
    for(const pid in V.votos){srv.votos[pid]=Object.assign(srv.votos[pid]||{},V.votos[pid]);}
    V=srv;}
  await fetch(BLOB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(V)});
  document.getElementById("sync").textContent="guardado ✓ "+new Date().toLocaleTimeString().slice(0,5);
}catch(e){document.getElementById("sync").textContent="⚠ no guardó, reintento…";setTimeout(subir,4000);}}
function votar(pid,v){V.votos[pid]=V.votos[pid]||{};
  const cur=V.votos[pid][YO];
  V.votos[pid][YO]={v:v,nota:(cur&&cur.nota)||"",ts:Date.now()};
  pinta();subir();
  if(v!=="si"){const n=document.getElementById("nota-"+cssid(pid));if(n)n.style.display="block";}}
function nota(pid,txt){V.votos[pid]=V.votos[pid]||{};const cur=V.votos[pid][YO]||{v:"duda"};
  cur.nota=txt;cur.ts=Date.now();V.votos[pid][YO]=cur;clearTimeout(timer);timer=setTimeout(subir,800);}
function cssid(s){return s.replace(/[^a-z0-9]/gi,"_");}

/* ---------- filtros ---------- */
const FILTROS=[["todo","Todo"],["pend","Me faltan"],["JAVI","Javi"],["JORDI","Jordi"],["story","Historias"],["feed","Feed"]];
const fdiv=document.getElementById("filtros");
FILTROS.forEach(([k,t])=>{const b=document.createElement("button");b.textContent=t;b.dataset.k=k;
  if(k==="todo")b.classList.add("on");
  b.onclick=()=>{filtro=k;document.querySelectorAll(".filtros button").forEach(x=>x.classList.toggle("on",x.dataset.k===k));pinta();};
  fdiv.appendChild(b);});
function pasa(p){if(filtro==="todo")return true;
  if(filtro==="pend")return !(V.votos[p.id]&&V.votos[p.id][YO]);
  if(filtro==="JAVI"||filtro==="JORDI")return p.cuenta===filtro;
  if(filtro==="story")return p.tipo==="story";
  if(filtro==="feed")return p.tipo!=="story";return true;}

/* ---------- render ---------- */
function estado(p){const vs=V.votos[p.id]||{};const vals=Object.values(vs).map(x=>x.v);
  if(!vals.length)return "";if(vals.includes("no"))return "no";
  if(vals.includes("duda"))return "duda";return "ok";}
function card(p){
  const est=estado(p), vs=V.votos[p.id]||{};
  const chips=PERSONAS.map(per=>{const x=vs[per];
    return `<span class="vchip ${x?x.v:''}">${per}${x?(x.v==="si"?" ✓":x.v==="no"?" ✗":" ?"):""}${x&&x.nota?" 💬":""}</span>`;}).join("");
  const notas=Object.entries(vs).filter(([,x])=>x.nota).map(([per,x])=>`<div class="cap">💬 <b>${per}</b>: ${x.nota}</div>`).join("");
  const multi=p.archivos.length>1;
  const media=p.archivos.map((a,i)=>{
    const sk=p.id+"#"+(i+1), sv=V.votos[sk]||{}, mioS=sv[YO]&&sv[YO].v;
    const dots=PERSONAS.map(per=>{const x=sv[per];return `<i class="${x?x.v:''}" title="${per}"></i>`;}).join("");
    const inner=a.video?`<video class="num" data-n="${i+1}" src="${a.video}" poster="${a.poster||''}" controls preload="none"></video>`
                       :`<span class="num" data-n="${i+1}"><img loading="lazy" src="${a.poster||''}" onclick="ampliar('${a.poster||''}')"></span>`;
    if(!multi)return inner;
    return `<div class="slidebox">${inner}
      <div class="sdots">${dots}</div>
      <div class="svotes">
        <button class="si ${mioS==='si'?'on':''}" onclick="votar('${sk}','si')">✓</button>
        <button class="no ${mioS==='no'?'on':''}" onclick="votar('${sk}','no')">✗</button>
      </div></div>`;}).join("");
  const mio=vs[YO]&&vs[YO].v;
  return `<div class="card ${est}">
    <div class="chead"><span class="tag t${p.cuenta}">${p.cuenta}</span>
      <span class="tag tt">${p.tipo}</span><span class="cid">${p.id.replace(/_/g," ")}</span></div>
    <div class="media">${media}</div>
    ${p.caption?`<div class="cap">${p.caption.slice(0,160)}</div>`:""}
    <div class="votos">${chips}</div>${notas}
    <div class="btns">
      <button class="bsi ${mio==="si"?"on":""}" onclick="votar('${p.id}','si')">Sí ✓</button>
      <button class="bduda ${mio==="duda"?"on":""}" onclick="votar('${p.id}','duda')">Duda</button>
      <button class="bno ${mio==="no"?"on":""}" onclick="votar('${p.id}','no')">No ✗</button></div>
    <div class="nota" id="nota-${cssid(p.id)}" ${mio&&mio!=="si"?'style="display:block"':""}>
      <textarea placeholder="¿Qué cambiarías? (lo ven todos)" oninput="nota('${p.id}',this.value)">${vs[YO]&&vs[YO].nota||""}</textarea></div>
  </div>`;}
function ampliar(src){const m=document.getElementById("modal");
  m.innerHTML=`<img src="${src}">`;m.style.display="flex";}
function pinta(){
  const cont=document.getElementById("lista");let html="";
  DIAS.forEach(d=>{const ps=PIEZAS.filter(p=>p.dia===d&&pasa(p));if(!ps.length)return;
    const hechas=ps.filter(p=>V.votos[p.id]&&V.votos[p.id][YO]).length;
    const stories=ps.filter(p=>p.tipo==="story"), feed=ps.filter(p=>p.tipo!=="story");
    html+=`<details class="dia" ${d===DIAS.find(x=>PIEZAS.some(p=>p.dia===x&&pasa(p)))?"open":""}>
      <summary>${d.toUpperCase()}<span class="mini">${hechas}/${ps.length} tuyas</span></summary>`;
    if(feed.length){html+=`<div class="grupo"><div class="gtit">Feed (reels · carruseles · memes)</div>${feed.map(card).join("")}</div>`;}
    if(stories.length){html+=`<div class="grupo"><div class="gtit">Historias — en orden de subida, desliza →</div>${stories.map(card).join("")}</div>`;}
    html+=`</details>`;});
  cont.innerHTML=html||'<div class="sub">Nada con este filtro.</div>';
  const tot=PIEZAS.length, mias=PIEZAS.filter(p=>V.votos[p.id]&&V.votos[p.id][YO]).length;
  document.getElementById("prog").textContent=`${YO}: ${mias}/${tot} revisadas`;
  document.getElementById("cab").textContent=`${tot} piezas · votos del equipo en vivo · en carruseles e historias puedes votar CADA slide (✓/✗ debajo)`;}
function copiar(){let out="REVISIÓN SEMANA 3-9 AGO\n";
  PIEZAS.forEach(p=>{const vs=V.votos[p.id]||{};if(!Object.keys(vs).length)return;
    out+=`\n${p.dia} · ${p.id}\n`;
    Object.entries(vs).forEach(([per,x])=>{out+=`  [${x.v.toUpperCase()}] ${per}${x.nota?" — "+x.nota:""}\n`;});});
  navigator.clipboard.writeText(out).then(()=>alert("Copiado. Pégalo en el grupo si hace falta."));}
function arranca(){pinta();bajar();setInterval(bajar,15000);}
if(YO&&document.getElementById("clave").value.trim().toLowerCase()===CLAVE){
  document.getElementById("login").style.display="none";arranca();}
</script></body></html>
