const GUIONES=[{"id": "QA03", "hook": "Tenemos alumnos que han facturado más del millón al mes con sus tiendas online", "dur": 20.1, "t1": 1662.9, "t2": 1683.0, "etapa": "BOFU", "estructura": "pregunta (\"hablemos de números: vuestros casos de éxito ¿cuánto facturan?\" 1662.9-1665.8) → Javi (1666.6-1683.0: +1M/mes, gente entre 300 y 500 mil €/mes)", "porque": ""}, {"id": "QA04", "hook": "Los dos alumnos que están facturando más de un millón al mes tenían un margen de beneficio de un 18%", "dur": 32.6, "t1": 1684.3, "t2": 1716.9, "etapa": "BOFU", "estructura": "pregunta (\"¿es realmente facturación o hay beneficio?\" 1684.3-1689.7) → respuesta (1690.4-1712.5: cuanto más facturas, el margen baja; 1M al 18% \"no está mal\")", "porque": ""}, {"id": "QA08", "hook": "Si quieres realmente conocimiento… el que estás viendo va a tener menos de 1.000 suscriptores\" / cierre: \"posiblemente el contenido va a ser una mierda", "dur": 37.9, "t1": 3411.8, "t2": 3449.7, "etapa": "BOFU", "estructura": "respuesta (YouTube premia visualizaciones, no conocimiento; retos estúpidos de facturación; filtra a quién ves)", "porque": ""}, {"id": "QA14", "hook": "Nuestra vida puede ser bastante aburrida… pasa que eso no vende, ese es el problema", "dur": 40.2, "t1": 3547.5, "t2": 3587.7, "etapa": "BOFU", "estructura": "diálogo (trabajar sábado o domingo no es problema, es vocacional → la gente quiere viajar, lifestyle… lo que se vende no es la realidad)", "porque": ""}, {"id": "QA16", "hook": "Para mí el verdadero millonario es la persona que puede ocupar su tiempo en lo que él quiera", "dur": 36.1, "t1": 3750.6, "t2": 3786.7, "etapa": "BOFU", "estructura": "Javi solo (si mañana quiero tomarme el día libre para estar con mi hijo, me lo tomo… no depender de una oficina para ganar dinero)", "porque": ""}, {"id": "QA17", "hook": "Al poder comprarme el Lamborghini me abrió muchísimas puertas", "dur": 42.6, "t1": 715.3, "t2": 757.9, "etapa": "BOFU", "estructura": "pregunta lujo/Lambo (708-714, overlay) → Jordi (el conocimiento no se puede materializar, lo material sí; la gente materializa el éxito)", "porque": ""}, {"id": "QA18", "hook": "Un compañero del equipo de fútbol me decía: aparte de saber hay que aparentar. Hay mucha gente que aparenta en vez de saber", "dur": 38.8, "t1": 809.4, "t2": 848.2, "etapa": "TOFU", "estructura": "Javi (comprarte un objeto de lujo para transmitir que sabes = no; Jordi lleva años emprendiendo y era SU objetivo — eso es distinto)", "porque": ""}, {"id": "QA19", "hook": "Yo soy Javier Sánchez, tengo 45 años, soy padre de familia, exfutbolista, entrenador personal…", "dur": 31.7, "t1": 109.8, "t2": 141.5, "etapa": "BOFU", "estructura": "pregunta (\"si alguien no os conociera de nada ¿cómo os presentaríais?\" 109.8-114.1) → Javi (9 años en tiendas online, Mentorium, \"referentes en habla hispana… muchos mentores que venden formaciones se han formado con nosotros\")", "porque": ""}, {"id": "QA20", "hook": "Cuando fui padre dije: voy a hacer algo como hobby para generar un ingreso extra… y a los pocos meses ya estaba generando más que mi propio trabajo de 8 horas", "dur": 34.3, "t1": 142.3, "t2": 176.6, "etapa": "MOFU", "estructura": "Jordi solo (soy Jordi García, 8 años en tiendas online, trabajo de 8 horas, boom 2017-2018 en España)", "porque": ""}, {"id": "QA21", "hook": "No venimos de ser programadores ni de haber sido informáticos… yo soy entrenador personal, Jordi tenía su trabajo", "dur": 35.8, "t1": 207.2, "t2": 243.0, "etapa": "TOFU", "estructura": "Javi (venimos totalmente de cero, aprendiendo como cualquier persona normal, trabajando 8 horas)", "porque": ""}, {"id": "QA22", "hook": "Si yo os digo que soy un paleta o soy pintor, que sé cuatro cosas de ordenadores… ¿podría llegar al punto donde estáis vosotros?\" — \"Por supuesto", "dur": 39.8, "t1": 243.5, "t2": 283.3, "etapa": "BOFU", "estructura": "pregunta entrevistador (243.5-253.4) → Javi (253.4-283.3: \"yo iba con mi mochilita a casa de clientes y a gimnasios… hay que tomar acción, formarse… la experiencia te da resultados a largo plazo\")", "porque": ""}, {"id": "QA23", "hook": "Mucha gente quiere ganar dinero online de forma rápida, y el dinero rápido no existe", "dur": 38.4, "t1": 990.6, "t2": 1029.0, "etapa": "TOFU", "estructura": "pregunta (\"¿qué tengo que hacer para tener éxito en e-commerce?\" 990.6-994.8) → Javi (995.6-1029.0: tomar acción + paciencia; \"cuando monté mi primera tienda perdí dinero… hasta que me empecé a formar\")", "porque": ""}, {"id": "QA24", "hook": "Yo te doy el conocimiento, pero yo no puedo abrir el ordenador por ti, no puedo crear la tienda por ti", "dur": 39.1, "t1": 1029.0, "t2": 1068.1, "etapa": "MOFU", "estructura": "Javi solo (mínimo 6 meses le digo a todos los que entran en Mentorium… el que a la segunda semana pone excusas se está engañando a sí mismo… \"vamos de la mano al éxito\")", "porque": ""}, {"id": "QA25", "hook": "Esa gente no nos interesa… es que prefiero que no entre", "dur": 51.3, "t1": 1604.2, "t2": 1655.5, "etapa": "TOFU", "estructura": "Javi (le he dicho a gente por redes: \"tú con esa actitud no vas a entrar aquí\"… \"yo no quiero un alumno que me haga perder tiempo y dinero a mí, a Jordi y a mi equipo\"; queremos gente con actitud que quiera escalar)", "porque": ""}, {"id": "JUNTOS01", "hook": "¿Por qué vender una formación si tenéis tanto éxito con las tiendas?\" — \"Es una vertical dentro de nuestro negocio… no somos tontos", "dur": 49.6, "t1": 1312.7, "t2": 1362.3, "etapa": "MOFU", "estructura": "Zyro pregunta LA pregunta incómoda (1312.7-1316.6) → Javi (1317.1-1362.3: igual que hacemos contra reembolso, dropshipping y marca, hacemos formación; yo cogí mentores cuando empecé; nos ayuda a ganar dinero, \"no somos tontos\"; remate: ayudar a alguien que empieza de cero \"me gratifica mucho porque yo he estado en ese lugar también\")", "porque": ""}, {"id": "JUNTOS02", "hook": "Un día le dije: no vas a entrar en Mentorium… no te quiero aquí con esa actitud", "dur": 51.0, "t1": 3231.3, "t2": 3282.3, "etapa": "BOFU", "estructura": "un solo speaker (3231.3-3282.3: tuve una discusión con uno → le negué la entrada por actitud → al cabo de los meses volvió en frío y dijo \"mira, lo siento\" → le di la entrada → por su actitud ha tenido resultados y hoy me lo agradece; remate: \"esas pequeñas cosas que pasan en la vida te marcan la diferencia\")", "porque": ""}, {"id": "JUNTOS03", "hook": "Cualquier persona que te diga 'deja algo, creo que no es para ti'… posiblemente es una persona que no te quiere", "dur": 40.8, "t1": 2606.8, "t2": 2647.6, "etapa": "BOFU", "estructura": "speaker A (2606.8-2624.7: el que te dice que lo dejes no te quiere o le viene mal tu resultado; si confías en ti, la gente verá que lo puedes lograr) → speaker B (2624.7-2647.6: \"¿y si empiezas de cero? empezamos de cero\"; ¿qué es lo peor que puede pasar? \"nada, me quedaré igual… pues vamos a intentarlo\")", "porque": ""}, {"id": "JUNTOS04", "hook": "Cuando vas ganando no vas aprendiendo nada… todo va bien", "dur": 43.8, "t1": 2465.6, "t2": 2509.4, "etapa": "BOFU", "estructura": "speaker A (2465.6-2482.9: el éxito real llega cuando surgen los problemas — una separación, un amigo, un problema del negocio = aprendizaje brutal) → speaker B (2483.8-2509.4: \"es parte del juego\"; ojalá todos los días fueran verdes, la vida no es así; remate: si aprendes cuando estás abajo, cuando estés arriba vas a disfrutar y tendrás mejor resultado, \"100%\")", "porque": ""}, {"id": "JUNTOS05", "hook": "No cierras por la noche… puedes estar vendiendo productos a las 4 de la mañana", "dur": 36.0, "t1": 2125.9, "t2": 2161.9, "etapa": "MOFU", "estructura": "turnos rápidos Javi-Jordi (2125.9-2146.7: abierto sábado, domingo, no cierras de noche; el bar en pandemia cerró; si te vas de vacaciones el bar necesita personal) → (2151.6-2161.9: vendes a cualquier hora; el bar siempre abierto + personal + 80.000 € de inversión; remate: \"¿qué negocio es más rentable? que alguien me lo diga\")", "porque": ""}, {"id": "JUNTOS06", "hook": "¿Qué riesgo tienes? Perder dinero… ¿qué miedo tienes? ¿3.000, 2.000, 5.000? Ponte a trabajar y lo vas a recuperar", "dur": 37.4, "t1": 2162.5, "t2": 2199.9, "etapa": "TOFU", "estructura": "speaker A (2162.5-2192.7: yo se lo pongo delante a los alumnos, sobre todo jóvenes: el único riesgo es perder dinero; yo monté mi tienda con mis ahorros y dije \"si los pierdo no pasa nada, sigo trabajando y sigo generando\") → remate (2193.6-2199.9: lo que iba a ganar tomando acción era mucho más grande; \"mi tiempo lo que voy a hacer es aprender una habilidad, voy a aprender algo nuevo\")", "porque": ""}, {"id": "JUNTOS07", "hook": "No soy un bicho raro por tenerlo… la gente puede tenerlo; la verdad es que la gente materializa el éxito", "dur": 50.6, "t1": 757.9, "t2": 808.5, "etapa": "TOFU", "estructura": "Jordi (757.9-797.6: la gente puede tenerlo y no lo tiene porque tendrá otras inversiones; el Lambo no era mi objetivo nº1, \"si me canso lo vendo y me compro otro\"; para la gente es lo que da el cambio de chip) → réplica del otro (798.4-808.5: remate \"una cosa es que te compres un Lamborghini porque era tu ilusión desde que empezaste… y otra cosa es que te lo compres para vender a las personas\")", "porque": ""}, {"id": "JUNTOS08", "hook": "¿De qué sirve tener dinero, éxito, lo que quieras… si tu hijo no va a estar a tu lado?", "dur": 46.2, "t1": 3701.2, "t2": 3747.4, "etapa": "TOFU", "estructura": "un speaker (3701.2-3747.4: conozco mucha gente con éxito y mucho dinero que a los hijos apenas los ve; el tiempo pasa y eso no se recupera con dinero; sentir lo que necesita el niño y estar presente, poder acudir al colegio, acompañarlo si está enfermo; remate: compaginar el negocio online con la vida familiar \"es lo más bonito y lo que más te llena\")", "porque": ""}, {"id": "JUNTOS09", "hook": "¿Cómo sería vuestro día a día?\" — \"Yo estoy todo el día en la piscina dando vueltas", "dur": 44.4, "t1": 3450.5, "t2": 3494.9, "etapa": "BOFU", "estructura": "Zyro pregunta el día a día (3450.5-3458.8) → broma (3459.4-3461.3, risa multicam) → respuesta real (3462.4-3494.9: \"somos trabajadores\"; hijo pequeño de dos años, reuniones, la formación, pensar el siguiente paso del negocio; remate: tiempo para entrenar \"y sobre todo estar con la familia\")", "porque": ""}, {"id": "JUNTOS10", "hook": "¿Cómo se hace? ¿Magia? Son 8 horas, 10 horas al día enganchado", "dur": 50.9, "t1": 3496.1, "t2": 3547.0, "etapa": "BOFU", "estructura": "un speaker (3496.1-3523.2: muchas horas en oficina, el tiempo libre a la familia; en redes parece otra vida; cuanto más facturas, más problemas y más horas) → (3523.7-3547.0: desengancharse del trabajo es imposible si quieres facturar; puedes viajar, sí, \"pero algún domingo tendrás que trabajar — esa es la verdadera libertad\")", "porque": ""}, {"id": "JUNTOS11", "hook": "No importa lo que hayas hecho antes ni la experiencia que tengas: yo tenía cero experiencia", "dur": 54.2, "t1": 283.9, "t2": 338.1, "etapa": "BOFU", "estructura": "Jordi solo (283.9-338.1: lo que marca es la actitud; con actitud positiva de aprender y disfrutar el proceso \"te acaba yendo bien, 100%\"; mucha gente me conoce de la ciudad y dice \"me gustaría\"… pero no da el paso — esa gente no va a llegar a dedicarse a esto; remate: la actitud y las ganas marcan si vas a tener éxito)", "porque": ""}, {"id": "JUNTOS12", "hook": "¿Una palabra que haya marcado vuestro éxito?\" — \"Perseverancia… ya puede haber un muro enfrente, que hasta que no lo derribo no paro", "dur": 47.2, "t1": 1087.3, "t2": 1134.5, "etapa": "BOFU", "estructura": "Zyro pide UNA palabra (1087.3-1094.0) → \"Perseverancia\" en seco (1098.7-1099.1, pausa dramática natural) → desarrollo (1101.8-1134.5: mi mujer lo dice, cuando se me mete algo en la cabeza no paro; el deporte me enseñó que el trabajo y el esfuerzo tienen recompensa; remate: \"si tienes perseverancia y objetivos claros, el éxito llega\")", "porque": ""}, {"id": "JUNTOS13", "hook": "Como hobby vine sin nada… y si mañana lo pierdo, vuelvo a trabajar. No tengo miedo", "dur": 32.2, "t1": 1137.1, "t2": 1169.3, "etapa": "MOFU", "estructura": "Jordi solo (1137.1-1169.3: mi palabra es la actitud — en la vida, en los problemas, cuando tienes éxito y cuando no; he tenido problemas y los he sabido resolver; remate: \"si tengo buena actitud seguiré subiendo, y si no, empezamos de cero, no hay problema\")", "porque": ""}, {"id": "JUNTOS14", "hook": "Si no tienes el dinero, tienes tiempo… cuando no tienes tiempo es porque tienes dinero", "dur": 48.2, "t1": 1889.5, "t2": 1937.7, "etapa": "TOFU", "estructura": "Jordi solo, rebote sobre el turno de Javi (1889.5-1913.2: empecé con menos de 3.000 €, un curso de un estadounidense de 300 € en 2018, dedicándole muchas horas; el dilema tiempo/dinero; fórmate gratis en YouTube preguntando) → (1913.2-1937.7: yo aprendí gratis y el conocimiento era muy disperso, tú haces el filtro; remate: \"cuando pagas un ticket por entrar te acortan muchísimo tiempo porque tiene", "porque": ""}, {"id": "JUNTOS17", "hook": "Trabajaba de lunes a sábado, más de 8 horas, buscando clientes de casa en casa, de gimnasio en gimnasio", "dur": 51.5, "t1": 3892.4, "t2": 3943.9, "etapa": "BOFU", "estructura": "pregunta Zyro como overlay (\"¿cómo era vuestra vida antes del e-commerce?\" 3880.0-3882.6) → Javi solo (3892.4-3943.9: llegaba el sábado a comer y me iba a acostarme, sin vida social; si dejaba de entrenar gente, dejaba de ganar; ahora: negocio digital, tiempo, vivo en un chalet al lado de la playa, mi hijo tiene una calidad de vida brutal; remate: \"gracias a que tomé acción en su momento, mi vida ", "porque": ""}, {"id": "JUNTOS18", "hook": "Mi vida antes del e-commerce era lo más plana que hay: 8 horas de trabajo y las horas muertas a hobbies que no aportaban nada", "dur": 30.0, "t1": 3949.3, "t2": 3979.3, "etapa": "TOFU", "estructura": "un speaker (3949.3-3979.3: cambié los hobbies vacíos por hobbies que construyen; remate: \"cuando estoy trabajando, para mí no es un trabajo — me estoy dedicando a mi hobby; ese es el cambio de mi vida de antes a la de ahora\")", "porque": ""}, {"id": "JUNTOS19", "hook": "El 90% de las formaciones: los que son las caras visibles del proyecto no están en el día a día. Y nosotros sí", "dur": 41.0, "t1": 1171.4, "t2": 1212.4, "etapa": "BOFU", "estructura": "Zyro pregunta qué os hace diferentes (1171.4-1177.1) → Javi (1177.9-1212.4: Jordi y yo damos las clases, somos cercanos, estamos en el día a día con los alumnos; no enseñamos una sola modalidad sino a vender online en dropshipping, contra reembolso y marca; remate: \"enseñamos a vender en diferentes mercados, cosa que otros sabemos que no hacen\")", "porque": ""}, {"id": "JUNTOS20", "hook": "Cuando cambia el algoritmo, cambia la plataforma, cambia el mercado… ¿tú qué vas a enseñar? ¿Lo que ha pasado hace 5 años?", "dur": 49.6, "t1": 604.1, "t2": 653.7, "etapa": "BOFU", "estructura": "un turno continuo (604.1-643.7: el mundo online va súper deprisa — algoritmo Andrómeda de Facebook; si no estuviéramos en el día a día no podríamos enseñar lo nuevo; \"no puedes vender algo que en el día a día no estás mamando — para mí eso es vender humo\") → cierre (645.6-653.7: nunca dejaremos de tener tienda online; remate: \"yo quiero enseñar a mis alumnos lo que quiero que me enseñaran a mí\")", "porque": ""}, {"id": "JUNTOS21", "hook": "Para mí un vendehumos es aquella persona que vende algo sin tener experiencia en lo que está vendiendo", "dur": 48.8, "t1": 470.0, "t2": 518.8, "etapa": "BOFU", "estructura": "Zyro pide la definición de vendehumos (470.0-478.0) → respuesta (479.1-518.8: si eres infoproductor con especialistas contratados, perfecto; pero si vendes formación a través de tu lifestyle, tus coches y tu lujo diciendo que salió de tus tiendas online…; remate: \"para mí eso es vender humo y es mentira\")", "porque": ""}, {"id": "JUNTOS22", "hook": "Gente que empieza de cero, que tiene la ilusión de montar una tienda
