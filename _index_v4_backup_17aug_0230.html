border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}

.tag{font-size:12px;font-weight:800;padding:2px 7px;border-radius:5px}
.TOFU{background:#123d29;color:#7ee2ab}.MOFU{background:#2b2b42;color:#b9b9ff}
.BOFU{background:#42311b;color:#ffcf8a}.SIN{background:#3a2020;color:#ff9c9c}
.cuenta{background:#1e1e28;color:#a9a9bb}.tipo{background:#191922;color:#8f8fa3}
.cap{font-size:14px;color:#b6b6c6;white-space:pre-wrap;max-height:76px;overflow:hidden;cursor:pointer}

.cap:not(.abierta):not(:empty)::after{content:" … (toca para leer)";color:#6c6c80}
.med{position:relative}
.med .nav{position:absolute;top:50%;transform:translateY(-50%);background:#000000aa;border:0;color:#fff;
font-size:22px;font-weight:900;width:36px;height:48px;cursor:pointer;border-radius:9px;line-height:1}
.med .nav.izq{left:6px}.med .nav.der{right:6px}
.med .cnt{position:absolute;top:8px;right:8px;background:#000000bb;color:#fff;font-size:11px;
font-weight:800;padding:3px 9px;border-radius:999px}
.sec{margin:20px 0 10px;display:flex;align-items:center;gap:9px}
.sec h2{font-size:16px;margin:0;letter-spacing:.4px}
.sec .lin{flex:1;height:1px;background:#242430}
.sec .n{font-size:13px;color:#8b8b9c;font-weight:800}
.acc{display:flex;gap:5px;margin-top:auto}
.acc button{flex:1;border:0;border-radius:10px;padding:13px 6px;font-weight:800;font-size:15px;cursor:pointer}
.ok{background:#1d5c39;color:#c6ffe2}.fix{background:#6b5316;color:#ffe6ad}.no{background:#5e2226;color:#ffc9c9}
.acc button.sel{outline:2px solid #fff}
.motivo{width:100%;background:#0d0d12;border:1px solid #33333f;color:#eee;border-radius:8px;
padding:10px;font-size:14px;resize:vertical;min-height:62px}
.dia{background:#131319;border:1px solid #242430;border-radius:12px;padding:11px;margin-bottom:11px}
.dia h3{margin:0 0 8px;font-size:13.5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.slots{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.slot{background:#0f0f15;border:1px dashed #2e2e3a;border-radius:9px;padding:8px;min-height:64px;font-size:12px}
.slot.lleno{border-style:solid;border-color:#3a3a48}
.slot .fmt{font-size:10px;color:#7d7d90;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.alerta{background:#4a1d1f;color:#ffc9c9;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
.okdia{background:#123d29;color:#7ee2ab;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800}
.ref{background:#131319;border:1px solid #242430;border-radius:10px;padding:10px;margin-bottom:9px;
display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ref a{color:#8fc7ff;font-size:12.5px;word-break:break-all}
.addref{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.addref input{flex:1;min-width:230px;background:#0d0d12;border:1px solid #33333f;color:#eee;
border-radius:9px;padding:10px;font-size:13px}
.addref button{background:#D3AF39;border:0;color:#151509;font-weight:800;padding:10px 17px;
border-radius:9px;cursor:pointer}
.nota{background:#15151d;border-left:3px solid #D3AF39;padding:9px 12px;border-radius:0 8px 8px 0;
font-size:12.5px;color:#b6b6c6;margin-bottom:13px}
.sync{position:fixed;right:12px;bottom:12px;background:#1d5c39;color:#d9ffe9;padding:8px 14px;
border-radius:9px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.sync.ver{opacity:1}.sync.mal{background:#6b2226;color:#ffd6d6}
#login{position:fixed;inset:0;background:#0b0b0e;display:flex;align-items:center;justify-content:center;z-index:80}
#login .box{background:#131319;border:1px solid #242430;border-radius:14px;padding:22px;width:min(340px,92vw)}
#login input{width:100%;background:#0d0d12;border:1px solid #33333f;color:#eee;border-radius:9px;
padding:11px;margin:9px 0 12px;font-size:15px}
#login .q{display:flex;gap:7px;flex-wrap:wrap}
#login .q button{flex:1;background:#1e1e28;border:1px solid #2e2e3a;color:#ddd;padding:11px;
border-radius:9px;font-weight:700;cursor:pointer}
.err{color:#ff9c9c;font-size:12.5px;min-height:16px}
.vacio{color:#77778a;padding:26px;text-align:center;font-size:13.5px}

/* VISOR — pedido literal de Gerard 14-ago: «si le doy clic a un carrusel quiero ver TODAS
   las slides, incluso hasta con la musica». Abre a pantalla completa, se pasan con el dedo
   y el video suena (no va muteado, que es como se juzga la musica). */
.visor{position:fixed;inset:0;z-index:60;background:#000000f2;display:none;flex-direction:column}
.visor.on{display:flex}
.visor .vtop{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff;
font-size:15px;font-weight:800;border-bottom:1px solid #23232c}
.visor .vcerrar{margin-left:auto;background:#26262f;border:0;color:#fff;font-size:22px;
width:46px;height:46px;border-radius:11px;cursor:pointer;line-height:1}
.visor .vpistas{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;
padding:14px;align-items:center}
.visor .vslide{scroll-snap-align:center;flex:0 0 auto;height:100%;display:flex;
flex-direction:column;gap:8px;align-items:center;justify-content:center}
.visor .vslide video,.visor .vslide img{height:calc(100% - 34px);max-height:74vh;width:auto;
border-radius:12px;background:#000;display:block}
.visor .vn{color:#9a9aab;font-size:13px;font-weight:800}
.visor .vcap{padding:12px 16px;color:#d8d8e4;font-size:15px;line-height:1.5;white-space:pre-wrap;
border-top:1px solid #23232c;max-height:26vh;overflow:auto}
.verver{position:absolute;left:8px;bottom:8px;background:#000000c4;border:1px solid #ffffff30;
color:#fff;font-size:13px;font-weight:800;padding:8px 12px;border-radius:9px;cursor:pointer}

/* MODO FOCO — Gerard 14-ago: «la organizacion es malisima… mas sencillo, mas util,
   mejor explicado». 69 tarjetas en una pared no se revisan en un movil. Se revisa
   de UNA EN UNA, con la pieza grande y tres botones que se puedan pulsar con el pulgar. */
.foco{max-width:540px;margin:0 auto}
.foco .card{border-radius:16px}
.foco .card video,.foco .card img{aspect-ratio:9/16;max-height:58vh;object-fit:contain;background:#000}
.foco .acc button{padding:17px 6px;font-size:17px;border-radius:12px}
.foco .tit{font-size:19px}
.barra{height:8px;background:#1c1c24;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.barra i{display:block;height:100%;background:#D3AF39}
.avance{display:flex;align-items:baseline;gap:10px;font-size:15px;color:#c9c9d4;font-weight:800}
.avance b{font-size:26px;color:#fff}
.avance .resto{margin-left:auto;font-weight:700;color:#8b8b9c;font-size:14px}
.pasos{display:flex;gap:10px;margin:14px 0 4px}
.pasos button{flex:1;background:#17171f;border:1px solid #2c2c36;color:#c9c9d4;
padding:12px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
.pasos button:disabled{opacity:.35;cursor:default}
.comovva{background:#12121a;border:1px solid #23232d;border-radius:12px;padding:13px 15px;
margin-bottom:14px;font-size:15px;line-height:1.6;color:#c4c4d2}
.comovva b{color:#fff}
.comovva div{margin:5px 0}
.vermodo{background:none;border:0;color:#8fc7ff;font-size:14px;font-weight:700;
cursor:pointer;padding:10px 0;text-decoration:underline}
.terminado{text-align:center;padding:50px 20px}
.terminado .big{font-size:46px}
.terminado h2{font-size:22px;margin:12px 0 6px}
.terminado p{color:#9a9aab;font-size:15px;margin:0}

/* BURBUJA del porqué — Gerard 14-ago: «la línea amarilla parece que se mezcle con el caption,
   ponlo en burbuja y dale más animación». Burbuja cerrada con su etiqueta, nada de borde suelto. */
.porque{position:relative;background:linear-gradient(180deg,#191505,#14120a);
border:1px solid #3d3312;border-radius:14px;padding:22px 14px 11px;margin:2px 0;
font-size:13.8px;line-height:1.55;color:#d8d2b8;white-space:pre-wrap;
box-shadow:0 2px 10px rgba(211,175,57,.07)}
.porque::before{content:"POR QUÉ EXISTE ESTA PIEZA";position:absolute;top:-9px;left:12px;
background:#D3AF39;color:#151509;font-size:10px;font-weight:900;letter-spacing:.09em;
padding:2.5px 9px;border-radius:999px}
.porque .q{color:#ffe89a;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.wrap>*{animation:fadeUp .28s ease both}
.card{animation:fadeUp .3s ease both}
.card:hover{transform:translateY(-2px);transition:transform .18s ease}
/* ESPÍA */
.espgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-top:12px}
.espcard{background:#101016;border:1px solid #26262f;border-radius:14px;overflow:hidden;
animation:fadeUp .3s ease both;transition:transform .18s ease,border-color .18s ease}
.espcard:hover{transform:translateY(-3px);border-color:#3a3a48}
.espcard iframe{width:100%;height:420px;background:#000;display:block}
.espmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:9px 10px}
.repl{margin-left:auto;background:#BAFC68;color:#10140b;font-weight:900;font-size:12px;
border:none;border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .15s}
.repl:hover{transform:scale(1.06)}
.repl.hecho{background:#2a3a2e;color:#9fe0b8}
/* HOOKS */
.hk{background:#101016;border:1px solid #26262f;border-radius:13px;padding:13px 14px;
margin-bottom:11px;animation:fadeUp .3s ease both}
.hk .htxt{font-size:16.5px;font-weight:700;color:#eee;line-height:1.4}
.hk .hmeta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.hk textarea{width:100%;background:#12121a;border:1px solid #33333f;color:#eee;border-radius:9px;
padding:9px 10px;font-size:14.5px;resize:vertical;min-height:44px;display:none;margin-top:8px}
.hk.editando textarea{display:block}
.hk .hfuente{font-size:11.5px;color:#77778a;margin-top:5px}
.hk.ap{border-color:#1d4030;background:#0d1510}
.hk.dn{opacity:.45}
.hk .acc{margin-top:9px}
/* IG */
.igbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:14px}
.igcard{background:#101016;border:1px solid #26262f;border-radius:13px;padding:14px;text-align:center}
.igcard .n{font-size:27px;font-weight:900;color:#fff;letter-spacing:-.02em}
.igcard .l{font-size:11.5px;color:#8b8b9c;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.igtab{width:100%;border-collapse:collapse;font-size:13.5px}
.igtab th{color:#8b8b9c;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
padding:7px 8px;border-bottom:1px solid #26262f}
.igtab td{padding:8px;border-bottom:1px solid #1a1a22;color:#ccc}
.igtab tr.nos td{color:#ffe89a;font-weight:700}
.igtab .r{text-align:right;font-variant-numeric:tabular-nums}

/* CORRECCION POR SLIDE — Gerard 14-ago: «si en un carrusel solo falla UNA slide, ¿qué?».
   Antes solo habia un motivo para la pieza entera, asi que decir «la 4 esta mal» era imposible
   sin escribirlo a mano en el motivo general y esperar que yo lo interpretase bien. */
.visor .vslide{position:relative}
.visor .snota{width:100%;max-width:min(34vh,320px);background:#12121a;border:1px solid #33333f;
color:#eee;border-radius:9px;padding:9px 10px;font-size:13.5px;resize:none;min-height:42px}
.visor .snota:focus{border-color:#D3AF39;outline:none}
.visor .snota.tiene{border-color:#D3AF39;background:#1a1710}
.visor .vslide .marca{position:absolute;top:6px;left:6px;background:#D3AF39;color:#151509;
font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;display:none}
.visor .vslide.conmarca .marca{display:block}
.nslides{background:#3a2f10;color:#ffd97a;font-size:12px;font-weight:800;padding:3px 9px;
border-radius:6px}

.espana{margin-top:8px;background:#161616;border:1px solid #2a2a2a;border-radius:10px;padding:8px 10px;font-size:12px;}
.espana summary{cursor:pointer;font-weight:800;color:#C9A961;letter-spacing:.04em;}

async function leerBlob(){
  /* lee el legado + los 4 bins personales y FUSIONA. La decisión efectiva de una pieza es la
     más reciente de cualquiera; las de los demás se conservan como notas visibles. */
  const r=await fetch(BLOB,{cache:"no-store"});
  if(!r.ok)throw new Error("GET "+r.status);
  const j=await r.json();
  const base=Object.assign({}, j, {decisiones:j.decisiones||{}, referentes:j.referentes||[],
                                    calendario:j.calendario||{}, f1:j.f1||{}, notas:{}, hooks:j.hooks||[]});
  const bins=await Promise.all(Object.entries(BINS).map(async([quien,url])=>{
    try{ const rr=await fetch(url,{cache:"no-store"}); return [quien, rr.ok? await rr.json():null]; }
    catch(e){ return [quien,null]; }
  }));
  for(const [quien,b] of bins){
    if(!b) continue;
    if(quien===YO) MIO=Object.assign({decisiones:{},hooks:{},ordenes:[],publicados:[]}, b);
    for(const [pid,d] of Object.entries(b.decisiones||{})){
      (base.notas[pid]=base.notas[pid]||[]).push(Object.assign({por:quien},d));
      const prev=base.decisiones[pid];
      if(!prev || (d.cuando||"")>(prev.cuando||"")) base.decisiones[pid]=Object.assign({por:quien},d);
    }
    for(const [hid,h] of Object.entries(b.hooks||{})){
      const k=base.hooks.find(x=>x.id===hid); if(!k) continue;
      if(!k.cuando || (h.cuando||"")>(k.cuando||"")) Object.assign(k,h,{por:quien});
    }
  }
  return base;
}

      mio.ordenes=mio.ordenes||[]; mio.publicados=mio.publicados||[];
      aplicar(mio);
      const w=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
                               body:JSON.stringify(mio)});
      if(!w.ok)throw new Error("POST "+w.status);
      MIO=mio; E=await leerBlob(); aviso("Guardado"); return;
    }catch(e){ if(i===2){aviso("No se pudo guardar",true);return;}
      await new Promise(r=>setTimeout(r,500*(i+1))); }
  }
}
async function guardar(aplicar){
  if(guardando){pendiente=aplicar;return;}
  guardando=true;
  for(let i=0;i<3;i++){
    try{
      const srv=await leerBlob(); aplicar(srv);
      const r=await fetch(BLOB,{method:"POST",headers:{"Content-Type":"application/json"},
                                body:JSON.stringify(srv)});
      if(!r.ok)throw new Error("POST "+r.status);
      E=srv; aviso("Guardado"); guardando=false;
      const p=pendiente; pendiente=null; if(p)guardar(p); else render();
      return;
    }catch(e){ if(i===2){guardando=false;pendiente=null;
        aviso("No se pudo guardar (almacén caído). El panel sigue en solo-lectura.",true);
        render();return;}
      await new Promise(r=>setTimeout(r,600*(i+1))); }
  }
}

const SECCIONES=[["TOFU","TOFU · problema / dolor"],["MOFU","MOFU · solución"],
                 ["BOFU","BOFU · mentalidad / casos"],["SIN","Sin etapa asignada"]];
function vistaRevisar(){
  const ps=pendientes().filter(p=>FETAPA==="todo"||etapa(p)===FETAPA);
  const total=(DATOS.piezas||[]).filter(p=>FCUENTA==="todo"||p.cuenta===FCUENTA).length;
  const hechas=Math.max(0,total-ps.length);
  const explica='<div class="comovva">'
    +'<div><b>Aprobar</b> — vale, y se coloca sola en el calendario.</div>'
    +'<div><b>Corregir</b> — escribe qué está mal. Lo arreglo yo, tú no tocas nada.</div>'
    +'<div><b>Denegar</b> — no sirve: se retira y se limpia del ordenador.</div>'
    +'<div style="color:#8b8b9c;margin-top:8px">Decide el primero que entre. Una pieza, un voto.</div>'
    +'</div>';
  if(!ps.length) return filtrosHTML()+'<div class="terminado"><div class="big">👌</div>'
    +'<h2>No queda nada por revisar</h2><p>Has decidido las '+total+' piezas de esta vista.</p></div>';

  if(MODO==="cuadricula"){
    let h=explica+filtrosHTML()
      +'<button class="vermodo" data-modo="foco">Revisar de una en una (más rápido en el móvil)</button>';
    for(const [clave,titulo] of SECCIONES){
      const grupo=ps.filter(p=>etapa(p)===clave);
      if(!grupo.length)continue;
      h+=`<div class="sec"><span class="tag ${clave}">${clave}</span><h2>${titulo}</h2>`
        +`<span class="n">${grupo.length}</span><span class="lin"></span></div>`;
      h+='<div class="grid">'+grupo.map(cardHTML).join("")+'</div>';
    }
    return h;
  }

  if(IDX>=ps.length)IDX=ps.length-1;
  if(IDX<0)IDX=0;
  const p=ps[IDX];
  const pct=total?Math.round(hechas*100/total):0;
  return explica+filtrosHTML()
    +'<div class="foco">'
    +`<div class="avance"><b>${hechas}</b> de ${total} decididas`
    +`<span class="resto">quedan ${ps.length}</span></div>`
    +`<div class="barra"><i style="width:${pct}%"></i></div>`
    +cardHTML(p)
    +`<div class="pasos">`
    +`<button data-paso="-1" ${IDX===0?"disabled":""}>‹ Anterior</button>`
    +`<button data-paso="1" ${IDX>=ps.length-1?"disabled":""}>Saltar ›</button></div>`
    +'<button class="vermodo" data-modo="cuadricula">Ver todas en cuadrícula</button>'
    +'</div>';
}

function vistaCalendario(){
  const cs=(CAL_AUTO&&CAL_AUTO.cuentas)||null;
  let h='<div class="nota">Solo entra aquí lo que <b>Gerard aprobó</b>. Se coloca solo: 3 al día '
       +'con el formato que toca según Santi, reparto 50/30/20 y <b>nunca 3 piezas de la misma '
       +'etapa el mismo día ni 2 Lead Magnets seguidos</b>. Lo que votéis aquí no mueve el '
       +'calendario: confirma o tumba el hueco.</div>'+filtrosHTML();
  if(!cs)return h+'<div class="vacio">Calendario sin generar. En el PC: '
                 +'<code>python _SCRIPTS/calendario_auto.py</code></div>';

    +`${esc(CAL_AUTO.desde||"")} · ${CAL_AUTO.dias||7} días</div>`;
  if(CAL_AUTO.modo_f1==="todas")h+='<div class="alerta">⚠ SIMULACIÓN: este reparto usa el '
    +'catálogo entero porque Gerard todavía no ha pasado su filtro. Cuando lo pase, el plan se '
    +'rehace solo con lo aprobado.</div>';
  const cuentas=FCUENTA==="todo"?["JAVI","JORDI"]:[FCUENTA];
  for(const c of cuentas){
    const d=cs[c]; if(!d)continue;
    const r=d.reparto||{}, n=(r.TOFU||0)+(r.MOFU||0)+(r.BOFU||0)+(r.SIN||0)||1;
    const pc=e=>Math.round(100*(r[e]||0)/n);
    h+=`<h2 style="font-size:15px;margin:18px 0 7px">${c}`
      +`<span style="font-weight:400;color:#8b8b9c;font-size:12px"> · ${n} colocadas · `
      +`TOFU ${pc("TOFU")}% / MOFU ${pc("MOFU")}% / BOFU ${pc("BOFU")}%</span></h2>`;
    (d.violaciones||[]).forEach(v=>h+=`<div class="alerta">⛔ ${esc(v)}</div>`);
    if(d.lm>d.techo_lm)h+=`<div class="alerta">⚠ ${d.lm} de ${d.feed} piezas piden un recurso por `
      +`DM. Sin 2 seguidos caben ${d.techo_lm}: el resto sobra siempre.</div>`;
    const fechas=[...new Set([...(d.colocadas||[]),...(d.vacios||[])].map(x=>x.fecha))].sort();
    for(const f of fechas){
      const dia=((d.colocadas||[]).concat(d.vacios||[]).find(x=>x.fecha===f)||{}).dia||"";
      h+=`<div class="dia"><h3>${esc(dia)} ${esc(f)}</h3><div class="slots">`;
      for(let s=0;s<3;s++){
        const c1=(d.colocadas||[]).find(x=>x.fecha===f&&x.slot===s);
        const v1=(d.vacios||[]).find(x=>x.fecha===f&&x.slot===s);
        const fmt=(c1||v1||{}).formato_santi||(v1||{}).formato||"";
        const sm=(c1||v1||{}).sin_motor?' <span style="color:#e8a500">⚠sin motor</span>':"";
        if(c1){
          const dd=dec(c1.id);
          const est=dd?({aprobado:"✅ visto bueno",denegado:"⛔ tumbada",
                          corregir:"✏️ a corregir"}[dd.estado]||""):"";
          h+=`<div class="slot lleno"><div class="fmt">${esc(fmt)}${sm}</div>`
            +`<b>${esc(c1.id)}</b><br><span class="tag ${esc(c1.etapa)}">${esc(c1.etapa)}</span>`
            +(c1.lead_magnet?' <span class="tag tipo">LM</span>':"")
            +(c1.encaje==="exacto"?"":` <span class="tag tipo">${esc(c1.formato)}</span>`)
            +(est?`<div style="font-size:11px;color:#8b8b9c;margin-top:4px">${est}</div>`:"")
            +`</div>`;
        }else{
          h+=`<div class="slot"><div class="fmt">${esc(fmt)}${sm}</div>`
            +`<span style="color:#5f5f70">— libre —</span>`
            +`<div style="font-size:10.5px;color:#8b8b9c;margin-top:3px">`
            +`${esc((v1||{}).motivo||"")}</div></div>`;
        }
      }
      h+='</div></div>';
    }
    if((d.sin_colocar||[]).length)
      h+=`<div class="nota" style="font-size:11.5px">Sin hueco esta semana (${d.sin_colocar.length}): `
        +`${esc(d.sin_colocar.join(", "))}</div>`;
  }
  return h;
}

/* Abre la pieza entera: todas las slides en fila, con sonido. El video NO va muteado a
   proposito — Gerard juzga la musica aqui, y una slide muda no se puede juzgar. */
function abreVisor(id){
  const p=(DATOS.piezas||[]).find(x=>x.id===id); if(!p)return;
  const arr=p.archivos||[];
  $("#vtit").textContent=`${p.id} · ${arr.length} ${arr.length===1?"pieza":"slides"}`;
  $("#vpistas").innerHTML=arr.map((a,k)=>{
    const m=a.video?`<video src="${esc(a.video)}" poster="${esc(a.poster||"")}" controls playsinline preload="metadata"></video>`
                   :(a.poster?`<img src="${esc(a.poster)}">`:'<div style="height:60vh;width:34vh;background:#111;border-radius:12px"></div>');
    const nota=((dec(id)||{}).motivo_slides||{})[k]||"";
    return `<div class="vslide${nota?" conmarca":""}" data-k="${k}">`
      +`<span class="marca">corregir</span>${m}`
      +`<span class="vn">${k+1} / ${arr.length}</span>`
      +`<textarea class="snota${nota?" tiene":""}" data-id="${esc(id)}" data-k="${k}" `
      +`placeholder="¿falla algo en ESTA slide? escríbelo">${esc(nota)}</textarea></div>`;
  }).join("");
  /* se guarda al salir del campo: una slide, una nota */
  $("#vpistas").querySelectorAll(".snota").forEach(t=>t.onchange=()=>{
    const k=t.dataset.k, txt=t.value.trim();
    t.classList.toggle("tiene",!!txt);
    t.closest(".vslide").classList.toggle("conmarca",!!txt);
    guardar(srv=>{
      srv.decisiones=srv.decisiones||{};
      const d=srv.decisiones[t.dataset.id]||{estado:"corregir",motivo:"",por:YO,cuando:""};
      d.motivo_slides=d.motivo_slides||{};
      if(txt) d.motivo_slides[k]=txt; else delete d.motivo_slides[k];
      if(Object.keys(d.motivo_slides).length && d.estado!=="denegado") d.estado="corregir";
      d.por=YO; d.cuando=new Date().toISOString().slice(0,16).replace("T"," ");
      srv.decisiones[t.dataset.id]=d;
    });
  });
  $("#vcap").textContent=p.caption||"(sin caption)";
  $("#visor").classList.add("on");
  document.body.style.overflow="hidden";
}
function cierraVisor(){
  $("#visor").classList.remove("on");
  $("#vpistas").querySelectorAll("video").forEach(v=>{try{v.pause()}catch(e){}});
  $("#vpistas").innerHTML="";
  document.body.style.overflow="";
}

function cablear(){
  document.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{
    MODO=b.dataset.modo; localStorage.setItem("mx_modo",MODO); IDX=0; render();
  });
  document.querySelectorAll("[data-paso]").forEach(b=>b.onclick=()=>{
    IDX+=(+b.dataset.paso); render();
  });

  document.querySelectorAll(".verver").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const card=b.closest(".card"); if(card) abreVisor(card.dataset.id);
  });
  const vc=$("#vcerrar"); if(vc) vc.onclick=cierraVisor;
  const vv=$("#visor"); if(vv) vv.onclick=e=>{ if(e.target===vv) cierraVisor(); };

  document.querySelectorAll(".filtros button").forEach(b=>b.onclick=()=>{
    if(b.dataset.f)FCUENTA=b.dataset.f; else if(b.dataset.e)FETAPA=b.dataset.e; render();});
  /* flechas de la galeria + caption expandible (delegado: sobrevive a re-pintados) */
  const app=$("#app");
  app.onclick=ev=>{
    const nav=ev.target.closest(".nav");
    if(nav){
      const card=nav.closest(".card"), med=nav.closest(".med");
      const p=DATOS.piezas.find(x=>x.id===card.dataset.id);
      if(!p)return;
      const n=(p.archivos||[]).length;
      const i=((+med.dataset.i)+(+nav.dataset.n)+n)%n;
      med.outerHTML=mediaHTML(p,i);
      return;
    }
    const cap=ev.target.closest(".cap");
    if(cap)cap.classList.toggle("abierta");
  };
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id, ta=card.querySelector(".motivo");
    card.querySelectorAll(".acc button").forEach(b=>b.onclick=()=>{
      const est=b.dataset.a, motivo=(ta.value||"").trim();
      if(est==="corregir"&&!motivo){
        aviso("Escribe qué hay que corregir",true); ta.focus(); return;
      }
      guardar(srv=>{ const sello=new Date().toISOString().slice(0,16).replace("T"," ");
        srv.decisiones=srv.decisiones||{};
        srv.decisiones[id]={estado:est,motivo:motivo,por:YO,cuando:sello};
      });
    });
  });
  /* hooks: aprobar / cambiar texto / denegar — todo queda en el blob con quién y cuándo */
  document.querySelectorAll(".hk").forEach(hk=>{
    const hid=hk.dataset.hid;
    hk.querySelectorAll(".acc button").forEach(b=>b.onclick=()=>{
      const a=b.dataset.h;
      if(a==="editar"){ hk.classList.toggle("editando"); const t=hk.querySelector(".hedit"); if(hk.classList.contains("editando")){t.focus();t.setSelectionRange(t.value.length,t.value.length);} return; }
      const nuevo=hk.querySelector(".hedit").value.trim();
      guardar(srv=>{
        srv.hooks=(srv.hooks&&srv.hooks.length?srv.hooks:JSON.parse(JSON.stringify(HOOKS_INI)));
        const k=srv.hooks.find(x=>x.id===hid); if(!k)return;
        const sello=new Date().toISOString().slice(0,16).replace("T"," ");
        if(nuevo&&nuevo!==k.texto){ k.texto=nuevo; k.editado=sello+" por "+YO; }
        k.estado=a; k.por=YO; k.cuando=sello;
      }).then(render);
    });
    const t=hk.querySelector(".hedit");
    if(t) t.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); hk.querySelector('[data-h="aprobado"]').click(); } };
  });
  document.querySelectorAll(".gprod").forEach(b=>b.onclick=()=>{
    guardarMio(mio=>{ mio.ordenes.push({tipo:"producir_guion", id:b.dataset.gid, por:YO,
      cuando:new Date().toISOString().slice(0,16).replace("T"," ")}); });
    b.textContent="EN COLA ✓"; b.disabled=true; aviso("Orden enviada: producir "+b.dataset.gid);
  });
  document.querySelectorAll(".repl").forEach(b=>b.onclick=()=>{
    const sc=b.dataset.sc;
    guardarMio(mio=>{ mio.ordenes.push({tipo:"replicar",
      url:"https://www.instagram.com/reel/"+sc+"/", por:YO,
      cuando:new Date().toISOString().slice(0,16).replace("T"," ")}); });
    b.textContent="PEDIDO ✓"; b.classList.add("hecho"); b.disabled=true;
    aviso("Orden enviada a Claude: replicar "+sc);
  });
  const add=$("#raddr");
  if(add)add.onclick=()=>{
    const u=($("#rurl").value||"").trim();
    if(!/^https?:\/\//.test(u)){aviso("Pega un link válido",true);return;}
    const nota=($("#rnota").value||"").trim();
    guardar(srv=>{ srv.referentes=srv.referentes||[];
      srv.referentes.push({url:u.split("?")[0],quien:YO,nota:nota,
        fecha:new Date().toISOString().slice(0,16).replace("T"," "),
        etapa:"",estado:"sin analizar"});
    });
    $("#rurl").value="";$("#rnota").value="";
  };
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  if(b.dataset.t==="salir")return salir();
  TAB=b.dataset.t; render();
});

async function arranca(){
  /* pase lo que pase con el almacén, el panel SIEMPRE pinta (13-ago: el blob caído
     dejaba la página entera en negro porque nunca se llegaba a render()) */
  let vivo=true;
  try{ E=await leerBlob(); }catch(e){ vivo=false; aviso("Sin conexión con el guardado",true); }
  render();
  if(vivo && !(E.referentes||[]).length && REFS_INI.length){
    /* primera vez: precarga los referentes que ya nos pasaron por WhatsApp */
    guardar(srv=>{ srv.referentes=REFS_INI.slice(); });
  }
  if(vivo && !(E.hooks||[]).length){
    /* primera vez: siembra el banco de hooks para que el equipo ya tenga cola que aprobar */
    guardar(srv=>{ srv.hooks=JSON.parse(JSON.stringify(HOOKS_INI)); });
  }
}
